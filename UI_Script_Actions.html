<script>
/* -------------------------------------------------------------------------- */
/*  TableCrafter Actions Tab State                                            */
/* -------------------------------------------------------------------------- */
const ACTION_CHANNEL_LABELS = Object.freeze({
  download: 'Descargar',
  email: 'Correo electrónico',
  whatsapp: 'WhatsApp'
});
const ACTION_EDITOR_DEFAULT_SUBTITLE =
  'Ajustá las características guardadas y actualizá la acción guardada directamente desde este panel.';
const WORD_ACTION_ID_KEYWORDS = Object.freeze(['creartextowc', 'editartextowc', 'accioneswc']);

let savedActionsCache = [];
let savedActionsLoaded = false;
let loadingSavedActions = false;
let currentSavedActionId = '';
let currentSavedActionDetails = null;
let reportEditorPortal = null;
let reportEditorMounted = false;
let queuedSavedActionsRefresh = null;
let savedActionsRefreshTimer = 0;
let savedActionsPanelInitialized = false;
let pendingSavedActionMutation = null;
let currentActionSupportsSave = false;
let savingSelectedAction = false;
let deletingSelectedAction = false;

function getActiveThemeForActions() {
  if (document.body && document.body.classList.contains('theme-wordcrafter')) {
    return 'word';
  }
  return 'table';
}

function shouldDisplayActionForTheme(action, theme) {
  if (!action) {
    return false;
  }
  const resolvedType = resolveFavoriteTypeFromEntry(action);
  const normalizedTheme = theme === 'word' ? 'word' : 'table';
  if (normalizedTheme === 'word') {
    if (resolvedType === 'wordFavorite') {
      return true;
    }
    return isWordcrafterActionFavorite(action, resolvedType);
  }
  if (resolvedType === 'wordFavorite' && normalizedTheme === 'table') {
    return false;
  }
  return true;
}

function filterSavedActionsForTheme(actions, theme) {
  if (!Array.isArray(actions)) {
    return [];
  }
  const normalizedTheme = theme === 'word' ? 'word' : 'table';
  return actions.filter(function(action) {
    return shouldDisplayActionForTheme(action, normalizedTheme);
  });
}

function isWordcrafterActionFavorite(action, resolvedTypeHint) {
  if (!action) {
    return false;
  }
  const directType = normalizeFavoriteTypeCandidate(action.type);
  if (directType === 'wordFavorite') {
    return true;
  }
  const resolvedType = resolvedTypeHint || resolveFavoriteTypeFromEntry(action);
  if (resolvedType === 'wordFavorite') {
    return true;
  }
  const metadata = action.metadata && typeof action.metadata === 'object' ? action.metadata : null;
  if (metadata) {
    const metadataType = normalizeFavoriteTypeCandidate(
      metadata.type || metadata.kind || metadata.favoriteKind || metadata.recordType || metadata.sourceType
    );
    if (metadataType === 'wordFavorite') {
      return true;
    }
    const metadataContext = metadata.context ? String(metadata.context).toLowerCase() : '';
    if (
      metadataContext &&
      (metadataContext.indexOf('wordcrafter') !== -1 ||
        metadataContext.indexOf('word') !== -1 ||
        metadataContext.indexOf('texto') !== -1)
    ) {
      return true;
    }
  }
  const idText = action.id ? String(action.id).toLowerCase() : '';
  if (!idText) {
    return false;
  }
  for (let i = 0; i < WORD_ACTION_ID_KEYWORDS.length; i++) {
    const keyword = WORD_ACTION_ID_KEYWORDS[i];
    if (keyword && idText.indexOf(keyword) !== -1) {
      return true;
    }
  }
  return false;
}

function findSavedActionById(actionId) {
  if (!actionId) {
    return null;
  }
  const list = Array.isArray(savedActionsCache) ? savedActionsCache : [];
  const target = String(actionId);
  for (let i = 0; i < list.length; i++) {
    const entry = list[i];
    if (entry && String(entry.id) === target) {
      return entry;
    }
  }
  return null;
}

function clearSavedActionsSelection() {
  const list = document.getElementById('aiSavedActionsList');
  if (!list) {
    return;
  }
  const items = list.querySelectorAll('[data-action-id]');
  items.forEach(function(item) {
    item.classList.remove('selected');
    item.setAttribute('aria-selected', 'false');
  });
  updateSavedActionsSummary(null, { collapse: false });
}

function setSavedActionsSelection(actionId, options) {
  const list = document.getElementById('aiSavedActionsList');
  if (!list) {
    return;
  }
  const opts = options || {};
  const target = actionId ? String(actionId) : '';
  let selectedAction = null;
  const items = list.querySelectorAll('[data-action-id]');
  items.forEach(function(item) {
    const itemId = item.getAttribute('data-action-id');
    const isSelected = target && itemId === target;
    if (isSelected) {
      item.classList.add('selected');
      item.setAttribute('aria-selected', 'true');
      selectedAction = item.__favoriteAction || null;
    } else {
      item.classList.remove('selected');
      item.setAttribute('aria-selected', 'false');
    }
  });
  if (!selectedAction && target) {
    selectedAction = findSavedActionById(target);
  }
  if (opts.actionOverride) {
    selectedAction = opts.actionOverride;
  }
  updateSavedActionsSummary(selectedAction, opts);
}

function updateSavedActionsSummary(action, options) {
  const summary = document.getElementById('aiSavedActionsSummary');
  const summaryName = document.getElementById('aiSavedActionsSummaryName');
  const summaryMeta = document.getElementById('aiSavedActionsSummaryMeta');
  const list = document.getElementById('aiSavedActionsList');
  const showAllBtn = document.getElementById('aiSavedActionsShowAllBtn');
  if (!summary || !summaryName || !summaryMeta || !list) {
    return;
  }
  const opts = options || {};
  const hasAction = !!(action && action.id);
  if (!hasAction) {
    summaryName.textContent = '';
    summaryMeta.textContent = '';
    summary.classList.add('ai-hidden');
    list.classList.remove('ai-hidden');
    if (showAllBtn) {
      showAllBtn.disabled = true;
    }
    return;
  }
  summaryName.textContent = action.name ? String(action.name) : 'Acción sin nombre';
  const metaLabel = formatActionMetadataLabel(action.metadata);
  summaryMeta.textContent = metaLabel || (action.id ? String(action.id) : '');
  if (showAllBtn) {
    showAllBtn.disabled = false;
  }
  if (opts.collapse === false) {
    summary.classList.add('ai-hidden');
    list.classList.remove('ai-hidden');
  } else {
    summary.classList.remove('ai-hidden');
    list.classList.add('ai-hidden');
  }
}

function formatActionMetadataLabel(metadata) {
  if (typeof formatFavoriteMetadataLabel === 'function') {
    return formatFavoriteMetadataLabel(metadata);
  }
  if (!metadata || typeof metadata !== 'object') {
    return '';
  }
  const id = metadata.id ? String(metadata.id).trim() : '';
  const type = metadata.type ? String(metadata.type).trim() : '';
  if (id && type && id !== type) {
    return type + ' • ' + id;
  }
  return id || type || '';
}

function buildSavedActionListDescription(action) {
  if (!action) {
    return '';
  }
  let summary = '';
  if (action.type === 'wordFavorite') {
    summary = buildWordFavoriteSummary(action);
  } else if (action.type === 'reportFavorite') {
    summary = buildReportFavoriteSummary(action);
  } else if (action.type === 'tableFavorite' || action.type === 'tableEditFavorite') {
    summary = buildTableFavoriteSummary(action);
  } else if (action.type === 'table') {
    const bits = [];
    if (action.sheetName) {
      bits.push('Hoja: ' + action.sheetName);
    }
    if (action.rangeA1) {
      bits.push('Rango: ' + action.rangeA1);
    }
    if (action.rows) {
      bits.push('Filas: ' + action.rows);
    }
    if (action.cols) {
      bits.push('Columnas: ' + action.cols);
    }
    summary = bits.join(' • ');
  }
  if (!summary && action.description) {
    summary = String(action.description);
  }
  if (summary && summary.length > 220) {
    summary = summary.substring(0, 217) + '…';
  }
  return summary;
}

function inferFavoriteTypeFromId(id) {
  if (!id) {
    return '';
  }
  const text = String(id).trim();
  if (!text) {
    return '';
  }
  const delimiterIndex = text.indexOf(':');
  const prefix = delimiterIndex === -1 ? text : text.substring(0, delimiterIndex);
  const normalizedPrefix = prefix.toLowerCase().replace(/[^a-z0-9]+/g, '');
  const normalizedFull = text.toLowerCase().replace(/[^a-z0-9]+/g, '');
  if (
    normalizedPrefix === 'reportfavorite' ||
    normalizedPrefix === 'reporte' ||
    normalizedPrefix === 'favorite' ||
    normalizedPrefix === 'favorito' ||
    normalizedPrefix === 'report' ||
    normalizedFull.indexOf('reportfavorite') !== -1 ||
    normalizedFull.indexOf('reporte') !== -1
  ) {
    return 'reportFavorite';
  }
  if (
    normalizedPrefix === 'wordfavorite' ||
    normalizedPrefix === 'word' ||
    normalizedPrefix === 'texto' ||
    normalizedPrefix === 'textfavorite' ||
    normalizedPrefix === 'textofavorito' ||
    normalizedPrefix === 'favoritotexto' ||
    normalizedPrefix === 'textoguardado' ||
    normalizedPrefix === 'creartextowc' ||
    normalizedPrefix === 'editartextowc' ||
    normalizedPrefix === 'accioneswc' ||
    normalizedFull.indexOf('textoguardado') !== -1 ||
    normalizedFull.indexOf('creartextowc') !== -1 ||
    normalizedFull.indexOf('editartextowc') !== -1 ||
    normalizedFull.indexOf('accioneswc') !== -1
  ) {
    return 'wordFavorite';
  }
  if (
    normalizedPrefix === 'tablefavorite' ||
    normalizedPrefix === 'favoritotabla' ||
    normalizedPrefix === 'tablafavorita' ||
    normalizedPrefix === 'creartablatc' ||
    normalizedFull.indexOf('tablefavorite') !== -1 ||
    normalizedFull.indexOf('favoritotabla') !== -1 ||
    normalizedFull.indexOf('creartablatc') !== -1
  ) {
    return 'tableFavorite';
  }
  if (
    normalizedPrefix === 'tableeditfavorite' ||
    normalizedPrefix === 'tableedit' ||
    normalizedPrefix === 'favoritoeditar' ||
    normalizedPrefix === 'tablaeditarfavorita' ||
    normalizedPrefix === 'editartablatc' ||
    normalizedFull.indexOf('tableeditfavorite') !== -1 ||
    normalizedFull.indexOf('tablaeditar') !== -1 ||
    normalizedFull.indexOf('editartablatc') !== -1
  ) {
    return 'tableEditFavorite';
  }
  if (normalizedPrefix === 'table' || normalizedFull.indexOf('tablaguardada') !== -1) {
    return 'table';
  }
  return '';
}

function normalizeFavoriteTypeCandidate(value) {
  if (value === null || value === undefined) {
    return '';
  }
  const text = String(value).trim();
  if (!text) {
    return '';
  }
  const delimiterIndex = text.indexOf(':');
  const base = delimiterIndex === -1 ? text : text.substring(0, delimiterIndex);
  const normalized = base.toLowerCase().replace(/[^a-z0-9]+/g, '');
  const normalizedFull = text.toLowerCase().replace(/[^a-z0-9]+/g, '');
  if (
    normalized === 'reportfavorite' ||
    normalized === 'reporte' ||
    normalized === 'reportefavorito' ||
    normalized === 'favorite' ||
    normalized === 'favorito' ||
    normalized === 'report' ||
    normalizedFull.indexOf('reportfavorite') !== -1 ||
    normalizedFull.indexOf('reporte') !== -1
  ) {
    return 'reportFavorite';
  }
  if (
    normalized === 'wordfavorite' ||
    normalized === 'word' ||
    normalized === 'texto' ||
    normalized === 'textfavorite' ||
    normalized === 'textofavorito' ||
    normalized === 'favoritotexto' ||
    normalized === 'textoguardado' ||
    normalized === 'creartextowc' ||
    normalized === 'editartextowc' ||
    normalized === 'accioneswc' ||
    normalizedFull.indexOf('textoguardado') !== -1 ||
    normalizedFull.indexOf('creartextowc') !== -1 ||
    normalizedFull.indexOf('editartextowc') !== -1 ||
    normalizedFull.indexOf('accioneswc') !== -1
  ) {
    return 'wordFavorite';
  }
  if (
    normalized === 'tablefavorite' ||
    normalized === 'favoritotabla' ||
    normalized === 'tablafavorita' ||
    normalized === 'creartablatc' ||
    normalizedFull.indexOf('tablefavorite') !== -1 ||
    normalizedFull.indexOf('favoritotabla') !== -1 ||
    normalizedFull.indexOf('creartablatc') !== -1
  ) {
    return 'tableFavorite';
  }
  if (
    normalized === 'tableeditfavorite' ||
    normalized === 'tableedit' ||
    normalized === 'favoritoeditar' ||
    normalized === 'tablaeditarfavorita' ||
    normalized === 'tablaeditar' ||
    normalized === 'editartablatc' ||
    normalizedFull.indexOf('tableeditfavorite') !== -1 ||
    normalizedFull.indexOf('tablaeditar') !== -1 ||
    normalizedFull.indexOf('editartablatc') !== -1
  ) {
    return 'tableEditFavorite';
  }
  if (normalized === 'table' || normalized === 'tabla' || normalizedFull.indexOf('tablaguardada') !== -1) {
    return 'table';
  }
  return '';
}

function hasWordFavoriteConfigSignals(payload, depth) {
  if (!payload || typeof payload !== 'object') {
    return false;
  }
  const level = typeof depth === 'number' && depth >= 0 ? depth : 0;
  if (level > 4) {
    return false;
  }
  if (Array.isArray(payload)) {
    for (let a = 0; a < payload.length; a++) {
      if (hasWordFavoriteConfigSignals(payload[a], level + 1)) {
        return true;
      }
    }
  }
  let keys = [];
  try {
    keys = Object.keys(payload);
  } catch (err) {
    keys = [];
  }
  for (let i = 0; i < keys.length; i++) {
    const key = keys[i];
    if (!key) {
      continue;
    }
    const lowerKey = String(key).toLowerCase();
    if (
      lowerKey.indexOf('wordcrafter') !== -1 ||
      lowerKey.indexOf('wordfavorite') !== -1 ||
      lowerKey.indexOf('wordai') !== -1 ||
      lowerKey.indexOf('texto') !== -1 ||
      lowerKey.indexOf('textfavorite') !== -1 ||
      lowerKey.indexOf('panelia') !== -1
    ) {
      return true;
    }
  }
  const context = payload.context;
  if (context) {
    if (typeof context === 'string' && context.trim()) {
      return true;
    }
    if (typeof context === 'object') {
      if (
        (context.instructions && String(context.instructions).trim()) ||
        (context.focus && String(context.focus).trim()) ||
        (context.summary && String(context.summary).trim())
      ) {
        return true;
      }
    }
  }
  const structure = payload.structure;
  if (structure && typeof structure === 'object') {
    const intro = structure.intro;
    const conclusion = structure.conclusion;
    if (
      (intro && typeof intro === 'object' && (intro.enabled || (intro.focus && String(intro.focus).trim()))) ||
      (conclusion && typeof conclusion === 'object' && (conclusion.enabled || (conclusion.focus && String(conclusion.focus).trim())))
    ) {
      return true;
    }
    if (Array.isArray(structure.sections) && structure.sections.length > 0) {
      return true;
    }
  }
  const personalization = payload.personalization;
  if (personalization && typeof personalization === 'object') {
    const personaKeys = ['length', 'language', 'tone', 'profile'];
    for (let j = 0; j < personaKeys.length; j++) {
      const personaKey = personaKeys[j];
      if (
        Object.prototype.hasOwnProperty.call(personalization, personaKey) &&
        personalization[personaKey] !== '' &&
        personalization[personaKey] !== null &&
        personalization[personaKey] !== undefined
      ) {
        return true;
      }
    }
  }
  const web = payload.web;
  if (web && typeof web === 'object') {
    if (
      Object.prototype.hasOwnProperty.call(web, 'externalEnabled') ||
      Object.prototype.hasOwnProperty.call(web, 'savedEnabled') ||
      Object.prototype.hasOwnProperty.call(web, 'sources') ||
      Object.prototype.hasOwnProperty.call(web, 'savedTexts') ||
      Object.prototype.hasOwnProperty.call(web, 'savedTables')
    ) {
      return true;
    }
  }
  if (payload.placement && typeof payload.placement === 'object') {
    return true;
  }
  if (
    Object.prototype.hasOwnProperty.call(payload, 'splitSentences') ||
    Object.prototype.hasOwnProperty.call(payload, 'splitTextIntoCells')
  ) {
    return true;
  }
  if (payload.theme && String(payload.theme).toLowerCase().indexOf('word') !== -1) {
    return true;
  }
  if (payload.mode && String(payload.mode).toLowerCase().indexOf('word') !== -1) {
    return true;
  }
  const nestedKeys = ['config', 'settings', 'details', 'meta', 'data', 'value', 'options', 'favorite', 'payload'];
  for (let k = 0; k < nestedKeys.length; k++) {
    const nestedKey = nestedKeys[k];
    if (!Object.prototype.hasOwnProperty.call(payload, nestedKey)) {
      continue;
    }
    const nestedValue = payload[nestedKey];
    if (!nestedValue || nestedValue === payload) {
      continue;
    }
    if (hasWordFavoriteConfigSignals(nestedValue, level + 1)) {
      return true;
    }
  }
  return false;
}

function inferFavoriteOriginType(origin) {
  if (origin === null || origin === undefined) {
    return '';
  }
  const text = String(origin).toLowerCase();
  if (!text) {
    return '';
  }
  if (
    text.indexOf('word') !== -1 ||
    text.indexOf('texto') !== -1 ||
    text.indexOf('wordcrafter') !== -1 ||
    text.indexOf('panelia') !== -1
  ) {
    return 'wordFavorite';
  }
  if (text.indexOf('edit') !== -1 || text.indexOf('editar') !== -1) {
    return 'tableEditFavorite';
  }
  if (
    text.indexOf('table') !== -1 ||
    text.indexOf('tabla') !== -1 ||
    text.indexOf('create') !== -1 ||
    text.indexOf('crear') !== -1
  ) {
    return 'tableFavorite';
  }
  return '';
}

function inferFavoriteTypeFromConfigPayload(payload, depth) {
  if (payload === null || payload === undefined) {
    return '';
  }
  const level = typeof depth === 'number' && depth >= 0 ? depth : 0;
  if (level > 4) {
    return '';
  }
  if (typeof payload === 'string') {
    const text = payload.trim();
    if (!text) {
      return '';
    }
    try {
      const parsed = JSON.parse(text);
      return inferFavoriteTypeFromConfigPayload(parsed, level + 1);
    } catch (err) {
      return normalizeFavoriteTypeCandidate(text);
    }
  }
  if (Array.isArray(payload)) {
    for (let i = 0; i < payload.length; i++) {
      const nested = inferFavoriteTypeFromConfigPayload(payload[i], level + 1);
      if (nested) {
        return nested;
      }
    }
    return '';
  }
  if (typeof payload !== 'object') {
    return '';
  }
  let tableCandidate = '';
  const directKeys = ['favoriteKind', 'recordType', 'kind', 'type'];
  for (let i = 0; i < directKeys.length; i++) {
    const key = directKeys[i];
    if (!Object.prototype.hasOwnProperty.call(payload, key)) {
      continue;
    }
    const candidate = normalizeFavoriteTypeCandidate(payload[key]);
    if (candidate && candidate !== 'table') {
      return candidate;
    }
    if (candidate === 'table') {
      tableCandidate = 'table';
    }
  }
  const originCandidate = inferFavoriteOriginType(payload.origin);
  if (originCandidate) {
    return originCandidate;
  }
  if (hasWordFavoriteConfigSignals(payload)) {
    return 'wordFavorite';
  }
  const nestedKeys = ['config', 'settings', 'details', 'meta', 'data', 'value', 'options', 'favorite', 'payload'];
  for (let j = 0; j < nestedKeys.length; j++) {
    const nestedKey = nestedKeys[j];
    if (!Object.prototype.hasOwnProperty.call(payload, nestedKey)) {
      continue;
    }
    const nestedValue = payload[nestedKey];
    if (nestedValue === payload) {
      continue;
    }
    const nestedResult = inferFavoriteTypeFromConfigPayload(nestedValue, level + 1);
    if (nestedResult) {
      if (nestedResult === 'table' && tableCandidate) {
        return tableCandidate;
      }
      return nestedResult;
    }
  }
  if (tableCandidate) {
    return tableCandidate;
  }
  return '';
}

function inferFavoriteTypeFromEntryConfig(entry) {
  if (!entry || typeof entry !== 'object') {
    return '';
  }
  const directKeys = ['favoriteKind', 'recordType', 'kind', 'type'];
  let tableCandidate = '';
  for (let i = 0; i < directKeys.length; i++) {
    const key = directKeys[i];
    if (!Object.prototype.hasOwnProperty.call(entry, key)) {
      continue;
    }
    const candidate = normalizeFavoriteTypeCandidate(entry[key]);
    if (candidate && candidate !== 'table') {
      return candidate;
    }
    if (candidate === 'table') {
      tableCandidate = 'table';
    }
  }
  const originCandidate = inferFavoriteOriginType(entry.origin);
  if (originCandidate) {
    return originCandidate;
  }
  if (hasWordFavoriteConfigSignals(entry)) {
    return 'wordFavorite';
  }
  const sources = [];
  if (entry.config !== null && entry.config !== undefined) {
    sources.push(entry.config);
  }
  if (entry.reportConfig !== null && entry.reportConfig !== undefined) {
    sources.push(entry.reportConfig);
  }
  if (entry.settings !== null && entry.settings !== undefined) {
    sources.push(entry.settings);
  }
  if (entry.meta !== null && entry.meta !== undefined) {
    sources.push(entry.meta);
  }
  if (entry.details !== null && entry.details !== undefined) {
    sources.push(entry.details);
  }
  if (entry.data !== null && entry.data !== undefined) {
    sources.push(entry.data);
  }
  if (entry.value !== null && entry.value !== undefined) {
    sources.push(entry.value);
  }
  for (let j = 0; j < sources.length; j++) {
    let source = sources[j];
    if (typeof source === 'string') {
      const text = source.trim();
      if (!text) {
        source = null;
      } else {
        try {
          source = JSON.parse(text);
        } catch (err) {
          source = null;
        }
      }
    }
    if (!source) {
      continue;
    }
    const nested = inferFavoriteTypeFromConfigPayload(source, 0);
    if (nested) {
      if (nested === 'table' && tableCandidate) {
        return tableCandidate;
      }
      return nested;
    }
  }
  if (tableCandidate) {
    return tableCandidate;
  }
  return '';
}

function resolveFavoriteTypeFromEntry(entry) {
  if (!entry) {
    return '';
  }
  const directType = normalizeFavoriteTypeCandidate(entry.type);
  const configType = inferFavoriteTypeFromEntryConfig(entry);
  const idType = entry.id ? inferFavoriteTypeFromId(entry.id) : '';
  if (directType && directType !== 'table') {
    return directType;
  }
  if (configType && configType !== 'table') {
    return configType;
  }
  if (idType && idType !== 'table') {
    return idType;
  }
  if (directType === 'table') {
    if (configType) {
      return configType;
    }
    if (idType) {
      return idType;
    }
    return 'table';
  }
  if (configType === 'table') {
    return 'table';
  }
  if (idType === 'table') {
    return 'table';
  }
  return directType || configType || idType || '';
}

function getCurrentSavedActionId() {
  return currentSavedActionId;
}

function getSavedActionsSnapshot() {
  return savedActionsCache.slice();
}

function dispatchSavedActionsUpdated() {
  const detail = {
    actions: getSavedActionsSnapshot(),
    currentId: currentSavedActionId
  };
  document.dispatchEvent(new CustomEvent('tc:savedActionsUpdated', { detail: detail }));
}

function getReportEditorPortal() {
  if (reportEditorPortal) {
    return reportEditorPortal;
  }
  const section = document.getElementById('aiReportSection');
  const host = document.getElementById('aiActionEditorBody');
  if (!section || !host) {
    return null;
  }
  let placeholder = document.getElementById('aiReportSectionPlaceholder');
  if (!placeholder) {
    const parent = section.parentNode;
    if (!parent) {
      return null;
    }
    placeholder = document.createElement('div');
    placeholder.id = 'aiReportSectionPlaceholder';
    placeholder.style.display = 'contents';
    parent.insertBefore(placeholder, section);
  }
  if (!placeholder.contains(section)) {
    placeholder.appendChild(section);
  }
  reportEditorPortal = {
    section: section,
    host: host,
    placeholder: placeholder
  };
  return reportEditorPortal;
}

function mountReportEditorInActions() {
  const portal = getReportEditorPortal();
  if (!portal || !portal.section || !portal.host) {
    return false;
  }
  if (!portal.host.contains(portal.section)) {
    portal.host.appendChild(portal.section);
  }
  reportEditorMounted = true;
  return true;
}

function restoreReportEditorHome() {
  const portal = getReportEditorPortal();
  if (!portal || !portal.section || !portal.placeholder) {

function cloneFavoriteCustomization(customization) {

    return {};

  try {
    return JSON.parse(JSON.stringify(customization));
  } catch (err) {
    const copy = Array.isArray(customization) ? [] : {};
    Object.keys(customization).forEach(function(key) {
      const value = customization[key];
      if (Array.isArray(value)) {
        copy[key] = value.slice();
      } else if (value && typeof value === 'object') {
        copy[key] = cloneFavoriteCustomization(value);
      } else {
        copy[key] = value;
      }
    });
    return copy;
  }
}

function cloneFavoriteFeatureDetail(detail) {

function normalizeFavoriteActionEntry(action) {

  let type = resolvedType || 'reportFavorite';
  if (type === 'table') {
    const inferredType = inferFavoriteTypeFromId(id);
    if (inferredType && inferredType !== 'table') {
      type = inferredType;
    }
  }
  const normalized = {
    id: id,
    type: type,
    name: action.name ? String(action.name) : '',
    description: action.description ? String(action.description) : '',
    createdAt: action.createdAt ? String(action.createdAt) : '',
    updatedAt: action.updatedAt ? String(action.updatedAt) : ''

  if (action.metadata && typeof action.metadata === 'object') {
    try {
      normalized.metadata = JSON.parse(JSON.stringify(action.metadata));
    } catch (err) {
      normalized.metadata = Object.assign({}, action.metadata);
    }
  } else {
    normalized.metadata = {};

  if (type === 'reportFavorite') {
    normalized.format = action.format ? String(action.format) : '';
    normalized.fileName = action.fileName ? String(action.fileName) : '';
    normalized.fileExtension = action.fileExtension ? String(action.fileExtension) : '';
    normalized.appendDateToFile = !!action.appendDateToFile;
    normalized.tables = Array.isArray(action.tables) ? action.tables.slice() : [];
    normalized.channels = Array.isArray(action.channels) ? action.channels.slice() : [];
    normalized.descriptionEnabled = !!action.descriptionEnabled;
    normalized.descriptionText = action.descriptionText ? String(action.descriptionText) : '';
    normalized.features = Array.isArray(action.features) ? action.features.slice() : [];
    normalized.featureDetails = Array.isArray(action.featureDetails)
      ? action.featureDetails
          .map(function(detail) {

          .filter(Boolean)
      : [];
    normalized.featureOrder = Array.isArray(action.featureOrder) ? action.featureOrder.slice() : [];
    normalized.emails = Array.isArray(action.emails) ? action.emails.slice() : [];
    normalized.phones = Array.isArray(action.phones) ? action.phones.slice() : [];
    normalized.customization = cloneFavoriteCustomization(action.customization);
    if (!normalized.descriptionText && action.descriptionEnabled && action.description) {
      normalized.descriptionText = String(action.description);

  } else if (type === 'table') {
    normalized.sheetName = action.sheetName ? String(action.sheetName) : '';
    normalized.rangeA1 = action.rangeA1 ? String(action.rangeA1) : '';
    normalized.fullRangeA1 = action.fullRangeA1 ? String(action.fullRangeA1) : '';
    normalized.cols = action.cols === null || action.cols === undefined ? '' : String(action.cols);
    normalized.rows = action.rows === null || action.rows === undefined ? '' : String(action.rows);
  } else if (type === 'wordFavorite') {
    if (action.config && typeof action.config === 'object') {
      try {
        normalized.config = JSON.parse(JSON.stringify(action.config));
      } catch (err) {
        normalized.config = action.config;
      }
    } else {
      normalized.config = null;
    }
  } else if (type === 'tableFavorite' || type === 'tableEditFavorite') {
    if (action.config && typeof action.config === 'object') {
      try {
        normalized.config = JSON.parse(JSON.stringify(action.config));
      } catch (err) {
        normalized.config = action.config;
      }
    } else {
      normalized.config = null;
    }
    if (action.style && typeof action.style === 'object') {
      try {
        normalized.style = JSON.parse(JSON.stringify(action.style));
      } catch (err2) {
        normalized.style = action.style;
      }
    } else {
      normalized.style = null;
    }
    if (Array.isArray(action.headers)) {
      try {
        normalized.headers = JSON.parse(JSON.stringify(action.headers));
      } catch (err3) {
        normalized.headers = action.headers.slice();
      }
    } else {
      normalized.headers = [];
    }
    normalized.rangeA1 = action.rangeA1 ? String(action.rangeA1) : '';
    normalized.fullRangeA1 = action.fullRangeA1 ? String(action.fullRangeA1) : '';
    normalized.sheetName = action.sheetName ? String(action.sheetName) : '';
    normalized.cols = action.cols === null || action.cols === undefined ? '' : String(action.cols);
    normalized.rows = action.rows === null || action.rows === undefined ? '' : String(action.rows);
    if (!Object.prototype.hasOwnProperty.call(normalized, 'config') || !normalized.config) {
      normalized.config = {};
    }
    normalized.updateFormulaReferences = Object.prototype.hasOwnProperty.call(action, 'updateFormulaReferences')
      ? !!action.updateFormulaReferences

function normalizeFavoriteActionList(list) {
  if (!Array.isArray(list)) {
    return [];
  }
  const seen = Object.create(null);
  return list
    .map(function(entry) {
      return normalizeFavoriteActionEntry(entry);
    })
    .filter(function(entry) {
      if (!entry || seen[entry.id]) {
        return false;
      }
      seen[entry.id] = true;
      return true;
    });
}

function filterLegacyFavoriteEntries(list) {
  if (!Array.isArray(list)) {
    return [];
  }
  return list.filter(function(entry) {
    if (!entry) {
      return false;
    }
    const resolvedType = resolveFavoriteTypeFromEntry(entry);
    if (
      resolvedType === 'reportFavorite' ||
      resolvedType === 'wordFavorite' ||
      resolvedType === 'tableFavorite' ||
      resolvedType === 'tableEditFavorite'
    ) {
      return true;
    }
    const hasFeatures = Array.isArray(entry.features) && entry.features.length > 0;
    const hasDetails = Array.isArray(entry.featureDetails) && entry.featureDetails.length > 0;
    const hasChannels = Array.isArray(entry.channels) && entry.channels.length > 0;
    const hasReportHints =
      hasFeatures ||
      hasDetails ||
      hasChannels ||
      !!(entry && (entry.format || entry.fileName || entry.fileExtension));
    if (hasReportHints) {
      return true;
    }
    if (entry && entry.customization && typeof entry.customization === 'object') {
      return Object.keys(entry.customization).length > 0;
    }
    return false;
  });
}

async function supplementWordFavorites(list) {
  const normalizedList = Array.isArray(list) ? list.slice() : [];
  const hasWordFavorites = normalizedList.some(function(entry) {
    return entry && entry.type === 'wordFavorite';
  });
  if (hasWordFavorites) {
    return normalizedList;
  }
  let wordResults;
  try {
    wordResults = await callServerFunction('listWordFavorites');
  } catch (err) {
    console.log('No se pudieron obtener las acciones de texto guardadas adicionales.', err);
    return normalizedList;
  }
  const normalizedWordFavorites = normalizeFavoriteActionList(wordResults);
  if (!normalizedWordFavorites.length) {
    return normalizedList;
  }
  const seenIds = Object.create(null);
  normalizedList.forEach(function(entry) {
    if (entry && entry.id) {
      seenIds[entry.id] = true;
    }
  });
  normalizedWordFavorites.forEach(function(entry) {
    if (!entry || !entry.id || seenIds[entry.id]) {
      return;
    }
    normalizedList.push(entry);
    seenIds[entry.id] = true;
  });
  return normalizedList;
}

async function fetchFavoriteActionList(options) {
  const opts = options || {};
  let primaryResult;
  let primaryError = null;
  if (!opts.preferLegacy) {
    try {
      primaryResult = await callServerFunction('listFavoriteActions');
      const normalizedPrimary = normalizeFavoriteActionList(primaryResult);
      if (normalizedPrimary.length > 0 || opts.skipLegacyFallback) {
        return supplementWordFavorites(normalizedPrimary);
      }
      if (opts.allowLegacyFallback === false) {
        return supplementWordFavorites(normalizedPrimary);
      }
    } catch (err) {
      primaryError = err;
      if (opts.skipLegacyFallback || opts.allowLegacyFallback === false) {
        throw err;
      }
    }
  }
  if (opts.allowLegacyFallback === false) {
    if (Array.isArray(primaryResult)) {
      return supplementWordFavorites(normalizeFavoriteActionList(primaryResult));
    }
    if (primaryError) {
      throw primaryError;
    }
    return supplementWordFavorites([]);
  }
  try {
    const legacyResult = await callServerFunction('listSavedActions', { scope: 'all' });
    const favoritesOnly = filterLegacyFavoriteEntries(legacyResult);
    const normalizedLegacy = normalizeFavoriteActionList(favoritesOnly);
    if (normalizedLegacy.length > 0) {
      return supplementWordFavorites(normalizedLegacy);
    }
    if (Array.isArray(primaryResult)) {
      return supplementWordFavorites(normalizeFavoriteActionList(primaryResult));
    }
    return supplementWordFavorites(normalizedLegacy);
  } catch (legacyError) {
    if (Array.isArray(primaryResult)) {
      return supplementWordFavorites(normalizeFavoriteActionList(primaryResult));
    }
    if (primaryError) {
      throw legacyError;
    }
    throw legacyError;
  }
}

function renderSavedActionsList(actions, selectedId, options) {
  const listElement = document.getElementById('aiSavedActionsList');
  if (!listElement) {
    return { hasEntries: false, selectedId: '', firstId: '' };
  }
  const opts = options || {};
  const list = Array.isArray(actions) ? actions : [];
  const theme = getActiveThemeForActions();
  let filteredList = filterSavedActionsForTheme(list, theme);
  listElement.innerHTML = '';
  listElement.setAttribute('aria-multiselectable', 'false');
  listElement.classList.remove('ai-hidden');
  listElement.classList.remove('disabled');
  listElement.setAttribute('aria-disabled', 'false');
  if (filteredList.length === 0) {
    updateSavedActionsEmptyState(false);
    clearSavedActionsSelection();
    const empty = document.createElement('div');
    empty.className = 'ai-multi-empty';
    empty.textContent = 'No hay acciones guardadas';
    listElement.appendChild(empty);
    listElement.classList.add('disabled');
    return { hasEntries: false, selectedId: '', firstId: '' };
  }
  updateSavedActionsEmptyState(true);
  const sortedList = filteredList
    .slice()
    .sort(function(a, b) {
      const nameA = (a && a.name ? a.name : '').toLowerCase();
      const nameB = (b && b.name ? b.name : '').toLowerCase();
      if (nameA < nameB) {
        return -1;
      }
      if (nameA > nameB) {
        return 1;
      }
      return 0;
    });
  const fragment = document.createDocumentFragment();
  sortedList.forEach(function(action) {
    if (!action || !action.id) {
      return;
    }
    const item = createAiMultiItem(action, false, {
      labelOverride: action.name ? action.name : 'Acción sin nombre'
    });
    if (!item) {
      return;
    }
    item.setAttribute('data-action-id', String(action.id));
    item.setAttribute('aria-selected', 'false');
    item.__favoriteAction = action;
    const metaLabel = formatActionMetadataLabel(action.metadata);
    const description = buildSavedActionListDescription(action);
    const tooltipParts = [];
    if (metaLabel) {
      tooltipParts.push(metaLabel);
    }
    if (description) {
      tooltipParts.push(description);
    }
    if (tooltipParts.length) {
      item.title = tooltipParts.join('\n');
    } else {
      item.title = action.id ? String(action.id) : '';
    }
    item.addEventListener('click', function() {
      handleSavedActionListSelection(action.id);
    });
    item.addEventListener('keydown', function(evt) {
      if (evt.key === 'Enter' || evt.key === ' ' || evt.key === 'Spacebar') {
        evt.preventDefault();
        handleSavedActionListSelection(action.id);
      }
    });
    fragment.appendChild(item);
  });
  listElement.appendChild(fragment);
  const normalizedSelectedId = selectedId ? String(selectedId) : '';
  let resolvedSelection = null;
  if (normalizedSelectedId) {
    resolvedSelection = sortedList.find(function(entry) {
      return entry && String(entry.id) === normalizedSelectedId;
    }) || null;
  }
  if (!resolvedSelection && opts.previousValue) {
    const normalizedPrevious = String(opts.previousValue);
    resolvedSelection = sortedList.find(function(entry) {
      return entry && String(entry.id) === normalizedPrevious;
    }) || null;
  }
  const firstEntry = sortedList.length > 0 ? sortedList[0] : null;
  if (!resolvedSelection && opts.autoSelectFirst !== false) {
    resolvedSelection = firstEntry;
  }
  if (resolvedSelection) {
    setSavedActionsSelection(resolvedSelection.id, { collapse: opts.collapse === true });
  } else {
    clearSavedActionsSelection();
  }
  return {
    hasEntries: sortedList.length > 0,
    selectedId: resolvedSelection ? resolvedSelection.id : '',
    firstId: firstEntry ? firstEntry.id : ''
  };
}

function buildReportFavoriteSummary(action) {
  if (!action) {
    return '';

  const parts = [];
  if (action.format) {
    const formatLabel = REPORT_FORMAT_LABELS[action.format] || action.format;
    parts.push('Formato: ' + formatLabel);
  }
  if (Array.isArray(action.featureDetails) && action.featureDetails.length > 0) {
    const labels = action.featureDetails
      .map(function(detail) {
        if (!detail || !detail.feature) {
          return '';

        const featureId = detail.feature;
        const baseLabel = REPORT_FEATURE_LABELS[featureId] || featureId;
        const quantity = detail.quantity;
        if (typeof quantity === 'number' && quantity > 1) {
          return baseLabel + ' × ' + quantity;
        }
        return baseLabel;
      })
      .filter(function(label) {
        return !!label;
      });
    if (labels.length) {
      parts.push('Características: ' + labels.join(', '));
    }
  } else if (Array.isArray(action.features) && action.features.length > 0) {
    const labels = action.features
      .map(function(feature) {
        return REPORT_FEATURE_LABELS[feature] || feature;
      })
      .filter(function(label) {
        return !!label;
      });
    if (labels.length) {
      parts.push('Características: ' + labels.join(', '));
    }
  }
  if (Array.isArray(action.channels) && action.channels.length > 0) {
    const channelLabels = action.channels
      .map(function(channel) {
        return formatActionChannel(channel);
      })
      .filter(function(label) {
        return !!label;
      });
    if (channelLabels.length) {
      parts.push('Canales: ' + channelLabels.join(', '));
    }
  }
  if (action.fileName) {
    parts.push('Archivo: ' + action.fileName + (action.fileExtension ? '.' + action.fileExtension : ''));
  }
  if (action.descriptionEnabled && action.descriptionText) {
    parts.push('Descripción del reporte incluida.');
  }
  if (action.appendDateToFile) {
    parts.push('Se agregará la fecha al nombre del archivo.');
  }
  return parts.join('\n');
}

function buildWordFavoriteSummary(action) {
  if (!action) {
    return '';
  }
  const config = action.config && typeof action.config === 'object' ? action.config : null;
  const parts = [];
  if (config && config.context && config.context.instructions) {
    const text = String(config.context.instructions).trim();
    if (text) {
      const snippet = text.length > 160 ? text.substring(0, 157) + '…' : text;
      parts.push('Contexto: ' + snippet);
    }
  }
  if (config && config.structure && typeof config.structure === 'object') {
    const sectionLabels = [];
    if (config.structure.intro && config.structure.intro.enabled) {
      sectionLabels.push('Introducción');
    }
    if (config.structure.conclusion && config.structure.conclusion.enabled) {
      sectionLabels.push('Conclusión');
    }
    if (sectionLabels.length) {
      parts.push('Secciones: ' + sectionLabels.join(', '));
    }
  }
  if (config && config.personalization && typeof config.personalization === 'object') {
    const personalization = [];
    if (config.personalization.length) {
      personalization.push('Extensión: ' + String(config.personalization.length));
    }
    if (config.personalization.language) {
      personalization.push('Idioma: ' + String(config.personalization.language));
    }
    if (config.personalization.tone) {
      personalization.push('Tono: ' + String(config.personalization.tone));
    }
    if (config.personalization.profile) {
      personalization.push('Perfil: ' + String(config.personalization.profile));
    }
    if (personalization.length) {
      parts.push(personalization.join(' • '));
    }
  }
  if (config && config.web && typeof config.web === 'object') {
    const webDetails = [];
    if (config.web.externalEnabled && Array.isArray(config.web.sources)) {
      webDetails.push('Fuentes web: ' + config.web.sources.length);
    }
    if (config.web.savedEnabled) {
      const tablesCount = Array.isArray(config.web.savedTables) ? config.web.savedTables.length : 0;
      const textsCount = Array.isArray(config.web.savedTexts) ? config.web.savedTexts.length : 0;
      webDetails.push('Referencias guardadas: ' + (tablesCount + textsCount));
    }
    if (webDetails.length) {
      parts.push(webDetails.join(' • '));
    }
  }
  if (parts.length === 0 && action.description) {
    return String(action.description);
  }
  return parts.join('\n');
}

function buildTableFavoriteSummary(action) {
  if (!action) {
    return '';
  }
  const parts = [];
  const rangePieces = [];
  const sheetName = action.sheetName ? String(action.sheetName) : '';
  const fullRange = action.fullRangeA1
    ? String(action.fullRangeA1)
    : sheetName && action.rangeA1
    ? sheetName + '!' + String(action.rangeA1)
    : action.rangeA1
    ? String(action.rangeA1)
    : '';
  if (sheetName) {
    rangePieces.push('Hoja: ' + sheetName);
  }
  if (fullRange) {
    rangePieces.push('Rango: ' + fullRange);
  }
  if (rangePieces.length) {
    parts.push(rangePieces.join(' • '));
  }
  const cols = parseInt(action.cols, 10);
  const rows = parseInt(action.rows, 10);
  if (!isNaN(cols) && cols > 0 && !isNaN(rows) && rows > 0) {
    parts.push('Dimensiones: ' + cols + '×' + rows);
  } else if (!isNaN(cols) && cols > 0) {
    parts.push('Columnas: ' + cols);
  }
  let headersCount = 0;
  if (Array.isArray(action.headers)) {
    headersCount = action.headers.length;
  } else if (action.config && action.config.headers && Array.isArray(action.config.headers)) {
    headersCount = action.config.headers.length;
  }
  if (headersCount > 0) {
    parts.push('Encabezados: ' + headersCount);
  }
  const style = action.style && typeof action.style === 'object'
    ? action.style
    : action.config && action.config.style && typeof action.config.style === 'object'
    ? action.config.style
    : null;
  if (style) {
    const styleParts = [];
    if (Object.prototype.hasOwnProperty.call(style, 'border')) {
      styleParts.push(style.border ? 'Con bordes' : 'Sin bordes');
    }
    if (Object.prototype.hasOwnProperty.call(style, 'bold')) {
      styleParts.push(style.bold ? 'Encabezado en negrita' : 'Encabezado regular');
    }
    if (styleParts.length) {
      parts.push(styleParts.join(' • '));
    }
  }
  return parts.join('\n');
}

function buildActionDetailCard(action, options) {
  const opts = options || {};
  const card = document.createElement('div');
  card.className = 'ai-action-card';
  const title = document.createElement('h4');
  title.textContent = action && action.name ? action.name : 'Favorito sin nombre';
  card.appendChild(title);
  const meta = document.createElement('div');
  meta.className = 'ai-action-meta';
  const typeBadge = document.createElement('span');
  typeBadge.textContent = getActionTypeLabel(action && action.type);
  meta.appendChild(typeBadge);
  const metadataLabel = formatActionMetadataLabel(action && action.metadata);
  if (metadataLabel) {
    const metadataBadge = document.createElement('span');
    metadataBadge.textContent = metadataLabel;
    meta.appendChild(metadataBadge);
  }
  if (action && action.updatedAt) {
    const updated = document.createElement('span');
    updated.textContent = 'Actualizado: ' + action.updatedAt;
    meta.appendChild(updated);
  }
  if (action && action.createdAt) {
    const created = document.createElement('span');
    created.textContent = 'Creado: ' + action.createdAt;
    meta.appendChild(created);
  }
  card.appendChild(meta);
  if (action && action.description) {
    const description = document.createElement('p');
    description.className = 'ai-action-summary';
    description.textContent = action.description;
    card.appendChild(description);
  }
  if (action && action.type === 'table') {
    const extra = document.createElement('p');
    extra.className = 'ai-action-summary';
    const rangeInfo = [];
    if (action.sheetName) {
      rangeInfo.push('Hoja: ' + action.sheetName);
    }
    if (action.rangeA1) {
      rangeInfo.push('Rango: ' + action.rangeA1);
    }
    if (action.rows) {
      rangeInfo.push('Filas: ' + action.rows);
    }
    if (action.cols) {
      rangeInfo.push('Columnas: ' + action.cols);
    }
    extra.textContent = rangeInfo.join(' • ');
    card.appendChild(extra);
  } else if (action && action.type === 'reportFavorite') {
    const summaryText = buildReportFavoriteSummary(action);
    if (summaryText) {
      const summary = document.createElement('p');
      summary.className = 'ai-action-summary';
      summary.textContent = summaryText;
      card.appendChild(summary);
    }
    if (Array.isArray(action.tables) && action.tables.length > 0) {
      const tablesInfo = document.createElement('p');
      tablesInfo.className = 'ai-action-summary';
      tablesInfo.textContent = 'Tablas vinculadas: ' + action.tables.join(', ');
      card.appendChild(tablesInfo);
    }
    if (opts.mode === 'fallback') {
      const notice = document.createElement('p');
      notice.className = 'ai-action-summary';
      notice.textContent =
        'No se pudo mostrar el editor interactivo. Abrí el reporte en el panel IA para modificarlo.';
      card.appendChild(notice);
    }
  } else if (action && action.type === 'wordFavorite') {
    const summaryText = buildWordFavoriteSummary(action);
    if (summaryText) {
      const summary = document.createElement('p');
      summary.className = 'ai-action-summary';
      summary.textContent = summaryText;
      card.appendChild(summary);
    }
  } else if (
    action &&
    (action.type === 'tableFavorite' || action.type === 'tableEditFavorite')
  ) {
    const summaryText = buildTableFavoriteSummary(action);
    if (summaryText) {
      const summary = document.createElement('p');
      summary.className = 'ai-action-summary';
      summary.textContent = summaryText;
      card.appendChild(summary);
    }
  }
  if (opts.includeActions !== false) {
    const buttons = document.createElement('div');
    buttons.className = 'ai-action-buttons';
    const editBtn = document.createElement('button');
    editBtn.type = 'button';
    editBtn.className = 'btn-secondary';
    if (action && action.type === 'table') {
      editBtn.textContent = 'Editar tabla';
    } else if (action && action.type === 'wordFavorite') {
      editBtn.textContent = 'Editar texto';
    } else if (
      action &&
      (action.type === 'tableFavorite' || action.type === 'tableEditFavorite')
    ) {
      editBtn.textContent = 'Aplicar acción';
    } else {
      editBtn.textContent = 'Editar en panel IA';
    }
    editBtn.addEventListener('click', function() {
      openActionForEditing(action);
    });
    buttons.appendChild(editBtn);
    card.appendChild(buttons);
  }
  return card;
}

function populateActionDetailCard(action, options) {

  }
  wrapper.innerHTML = '';

    wrapper.classList.add('ai-hidden');

function buildSavedActionTooltip(action) {
  if (!action) {
    return '';
  }
  const parts = [];
  const typeLabel = getActionTypeLabel(action.type);
  if (typeLabel) {
    parts.push('Tipo: ' + typeLabel);
  }
  if (action.description) {
    parts.push(String(action.description));
  }
  const metadataLabel = formatActionMetadataLabel(action.metadata);
  if (metadataLabel) {
    parts.push('Metadata: ' + metadataLabel);
  }
  if (action.type === 'reportFavorite') {
    const summary = buildReportFavoriteSummary(action);
    if (summary) {
      parts.push(summary);
    }
  } else if (action.type === 'wordFavorite') {
    const summary = buildWordFavoriteSummary(action);
    if (summary) {
      parts.push(summary);
    }
  } else if (action.type === 'tableFavorite' || action.type === 'tableEditFavorite') {
    const summary = buildTableFavoriteSummary(action);
    if (summary) {
      parts.push(summary);
    }
  } else if (action.type === 'table') {
    const meta = [];
    if (action.sheetName) {
      meta.push('Hoja: ' + action.sheetName);
    }

      meta.push('Rango: ' + action.rangeA1);
    }
    if (action.rows) {
      meta.push('Filas: ' + action.rows);

async function renderSavedActionDetails(action) {
  const container = document.getElementById('aiActionDetails');
  if (!container) {
    return;
  }
  if (!action || !action.id) {
    clearSavedActionDetails();
    return;
  }
  currentSavedActionDetails = action;
  container.classList.remove('ai-hidden');
  let supportsSave = false;
  if (action.type === 'reportFavorite') {
    const cardWrapper = document.getElementById('aiActionDetailCard');
    if (cardWrapper) {
      cardWrapper.innerHTML = '';
      cardWrapper.classList.add('ai-hidden');
    }
    const loaded = await enterReportFavoriteEditor(action);
    supportsSave = !!loaded;
    if (!loaded) {
      populateActionDetailCard(action, { mode: 'fallback' });
    }
  } else {
    exitReportFavoriteEditor({ clearFavorite: true });
    populateActionDetailCard(action);
  }
  updateSavedActionControls(action, { supportsSave: supportsSave });
}

async function handleSavedActionSaveClick() {
  if (savingSelectedAction) {
    return;
  }
  const action = currentSavedActionDetails;
  if (!action || !action.id) {
    await showMessageModal('Seleccioná una acción guardada antes de guardarla.', {
      title: 'Acción no seleccionada',
      variant: 'warning'
    });
    return;
  }
  if (!currentActionSupportsSave || action.type !== 'reportFavorite') {
    await showMessageModal(
      'Esta acción no se puede guardar desde este panel. Usá el botón de edición para abrirla en su sección correspondiente.',
      {
        title: 'Guardado no disponible',
        variant: 'info'
      }
    );
    return;
  }
  if (typeof handleReportFavoriteSave !== 'function') {
    await showMessageModal('El editor de reportes no está disponible en este momento. Volvé a intentarlo más tarde.', {
      title: 'Guardado no disponible',
      variant: 'error'
    });
    return;
  }
  const nameInput = document.getElementById('aiReportFavoriteName');
  if (nameInput && !nameInput.value && action.name) {
    nameInput.value = action.name;
  }
  savingSelectedAction = true;
  updateSavedActionControls(action, { supportsSave: true });
  try {
    await handleReportFavoriteSave();
  } finally {
    savingSelectedAction = false;
    updateSavedActionControls(currentSavedActionDetails, { supportsSave: currentActionSupportsSave });
  }
}

async function handleSavedActionDeleteClick() {
  if (deletingSelectedAction) {
    return;
  }
  const action = currentSavedActionDetails;
  if (!action || !action.id) {
    await showMessageModal('Seleccioná una acción guardada antes de borrarla.', {
      title: 'Acción no seleccionada',
      variant: 'warning'
    });
    return;
  }
  const actionLabel = action.name ? '"' + action.name + '"' : 'seleccionada';
  let confirmed = true;
  if (typeof showConfirmModal === 'function') {
    confirmed = await showConfirmModal(
      '¿Querés borrar la acción guardada ' + actionLabel + '? Esta acción no se puede deshacer.',
      {
        title: 'Borrar acción guardada',
        confirmText: 'Borrar',
        cancelText: 'Cancelar',
        variant: 'danger'
      }
    );
  } else if (typeof window !== 'undefined' && typeof window.confirm === 'function') {
    confirmed = window.confirm('¿Querés borrar la acción guardada ' + actionLabel + '? Esta acción no se puede deshacer.');
  }
  if (!confirmed) {
    return;
  }
  deletingSelectedAction = true;
  updateSavedActionControls(action, { supportsSave: currentActionSupportsSave });
  try {
    const result = await callServerFunction('deleteSavedAction', action.id);
    if (result && result.error) {
      throw new Error(result.error);
    }
    const warning = result && result.warning ? String(result.warning) : '';
    if (warning) {
      await showMessageModal('La acción se eliminó con advertencias: ' + warning, {
        title: 'Acción eliminada con avisos',
        variant: 'warning'
      });
    } else {
      await showMessageModal('La acción seleccionada se eliminó correctamente.', {
        title: 'Acción eliminada',
        variant: 'success'
      });
    }
    if (action.type === 'wordFavorite' && window.WordFavoriteManager && typeof window.WordFavoriteManager.refreshSavedLists === 'function') {
      window.WordFavoriteManager.refreshSavedLists({ silent: true, broadcast: false }).catch(function() {});
    }
    currentSavedActionId = '';
    clearSavedActionDetails({ keepFavorite: false });
    if (typeof notifySavedActionMutation === 'function') {
      notifySavedActionMutation({
        id: '',
        force: true,
        delay: 0,
        autoSelectFirst: true,
        forceLoad: true
      });
    } else if (typeof requestSavedActionsRefresh === 'function') {
      requestSavedActionsRefresh({
        selectId: '',
        force: true,
        delay: 0,
        autoSelectFirst: true,
        forceLoad: true
      });
    } else if (typeof refreshSavedActions === 'function') {
      await refreshSavedActions({
        selectId: '',
        force: true,
        autoSelectFirst: true,
        forceLoad: true
      });
    }
  } catch (err) {
    await showMessageModal(
      'No se pudo borrar la acción seleccionada: ' + (err && err.message ? err.message : err),
      {
        title: 'No se pudo borrar',
        variant: 'error'
      }
    );
  } finally {
    deletingSelectedAction = false;
    updateSavedActionControls(currentSavedActionDetails, { supportsSave: currentActionSupportsSave });
  }
}

async function loadSavedActionDetails(actionId) {
  if (!actionId) {
    clearSavedActionDetails();
    currentSavedActionId = '';
    clearSavedActionsSelection();
    return;
  }
  setSavedActionsSelection(actionId, { collapse: false });
  let response;
  try {
    response = await callServerFunction('getFavoriteActionDetails', actionId);
  } catch (err) {
    await showMessageModal(
      'No se pudo cargar la acción seleccionada: ' + (err && err.message ? err.message : err),
      {
        title: 'Error al cargar',
        variant: 'error'
      }
    );
    return;
  }
  if (!response || response.error) {
    await showMessageModal((response && response.error) || 'No se encontró la acción seleccionada.', {
      title: 'Acción no disponible',
      variant: 'warning'
    });
    clearSavedActionDetails();
    currentSavedActionId = '';
    clearSavedActionsSelection();
    return;
  }
  currentSavedActionId = actionId;
  setSavedActionsSelection(actionId, { actionOverride: response, collapse: true });
  await renderSavedActionDetails(response);
}

async function ensureSavedActionsCache(options) {
  const opts = options || {};
  if (!opts.force && savedActionsLoaded) {
    return savedActionsCache;
  }
  let result;
  try {
    result = await fetchFavoriteActionList();
  } catch (err) {
    savedActionsLoaded = false;
    throw err;
  }
  savedActionsCache = Array.isArray(result) ? result.slice() : [];
  savedActionsLoaded = true;
  dispatchSavedActionsUpdated();
  return savedActionsCache;
}

async function refreshSavedActions(options) {
  const opts = options || {};
  const previousValue = currentSavedActionId || '';
  const hasExplicitTarget = Object.prototype.hasOwnProperty.call(opts, 'selectId');
  const targetId = opts.selectId || previousValue || '';
  const autoSelectFirst = opts.autoSelectFirst !== false;
  const shouldAutoSelect = autoSelectFirst && (!!targetId || hasExplicitTarget);
  const forceLoad = opts.forceLoad === true;
  if (!opts.force && savedActionsLoaded && !loadingSavedActions) {
    const renderInfo = renderSavedActionsList(savedActionsCache, targetId, {
      autoSelectFirst: shouldAutoSelect,
      previousValue: previousValue,
      collapse: !!currentSavedActionId
    });
    await syncSavedActionSelection(previousValue, {
      hasEntries: renderInfo.hasEntries,
      selectedId: renderInfo.selectedId,
      firstId: renderInfo.firstId,
      autoSelectFirst: shouldAutoSelect,
      forceLoad: forceLoad
    });
    dispatchSavedActionsUpdated();
    return savedActionsCache;
  }
  if (loadingSavedActions) {
    queuedSavedActionsRefresh = {
      selectId: targetId,
      force: true,
      autoSelectFirst: autoSelectFirst,
      forceLoad: forceLoad
    };
    return;
  }
  loadingSavedActions = true;
  try {
    const result = await fetchFavoriteActionList();
    savedActionsCache = Array.isArray(result) ? result.slice() : [];
    savedActionsLoaded = true;
    const renderInfo = renderSavedActionsList(savedActionsCache, targetId, {
      autoSelectFirst: shouldAutoSelect,
      previousValue: previousValue,
      collapse: !!currentSavedActionId
    });
    await syncSavedActionSelection(previousValue, {
      hasEntries: renderInfo.hasEntries,
      selectedId: renderInfo.selectedId,
      firstId: renderInfo.firstId,
      autoSelectFirst: shouldAutoSelect,
      forceLoad: forceLoad
    });
    dispatchSavedActionsUpdated();
  } catch (err) {
    savedActionsCache = [];
    savedActionsLoaded = false;
    renderSavedActionsList([], '', { autoSelectFirst: false, previousValue: previousValue, collapse: false });
    await syncSavedActionSelection(previousValue, { hasEntries: false, forceLoad: true });
    currentSavedActionId = '';
    dispatchSavedActionsUpdated();
    await showMessageModal(
      'No se pudieron obtener las acciones guardadas: ' + (err && err.message ? err.message : err),
      {
        title: 'Error al listar acciones guardadas',
        variant: 'error'
      }
    );
  } finally {
    loadingSavedActions = false;
    if (queuedSavedActionsRefresh) {
      const next = queuedSavedActionsRefresh;
      queuedSavedActionsRefresh = null;
      refreshSavedActions(next);
    }
  }
}

function notifySavedActionMutation(detail) {
  const payload = detail && typeof detail === 'object' ? detail : {};
  if (!savedActionsPanelInitialized) {
    pendingSavedActionMutation = payload;
  }
  document.dispatchEvent(new CustomEvent('tc:savedActionMutated', { detail: payload }));
}

function requestSavedActionsRefresh(options) {
  const opts = options || {};
  const request = {
    selectId: opts.selectId || '',
    force: opts.force === true,
    autoSelectFirst: opts.autoSelectFirst !== false,
    forceLoad: opts.forceLoad === true,
    delay: typeof opts.delay === 'number' ? opts.delay : 200
  };
  if (savedActionsRefreshTimer) {
    window.clearTimeout(savedActionsRefreshTimer);
    savedActionsRefreshTimer = 0;
  }
  if (request.delay <= 0) {
    refreshSavedActions(request);
    return;
  }
  savedActionsRefreshTimer = window.setTimeout(function() {
    savedActionsRefreshTimer = 0;
    refreshSavedActions(request);
  }, request.delay);
}

function handleSavedActionMutationEvent(event) {
  const detail = event && event.detail ? event.detail : {};
  requestSavedActionsRefresh({
    selectId: detail && detail.id ? detail.id : '',
    force: detail.force !== false,
    delay: typeof detail.delay === 'number' ? detail.delay : 200,
    autoSelectFirst: detail.autoSelectFirst !== false,
    forceLoad: detail.forceLoad === true
  });
}

      autoSelectFirst: false,
      forceLoad: true,
      delay: 0
    });
  });
  document.addEventListener('tc:themeModeChanged', function() {
    if (!savedActionsPanelInitialized) {
      return;
    }
    const previousValue = currentSavedActionId || '';
    const shouldAutoSelect = !!previousValue;
    const renderInfo = renderSavedActionsList(savedActionsCache, previousValue, {
      autoSelectFirst: shouldAutoSelect,
      previousValue: previousValue,
      collapse: !!currentSavedActionId
    });
    Promise.resolve(
      syncSavedActionSelection(previousValue, {
        hasEntries: renderInfo.hasEntries,
        selectedId: renderInfo.selectedId,
        firstId: renderInfo.firstId,
        autoSelectFirst: shouldAutoSelect,
        forceLoad: true
      })
    ).catch(function(err) {
      console.log('No se pudo sincronizar la lista de acciones guardadas con el cambio de tema.', err);
    });
  });
  document.addEventListener('tc:savedActionMutated', handleSavedActionMutationEvent);
  if (pendingSavedActionMutation) {
    handleSavedActionMutationEvent({ detail: pendingSavedActionMutation });
    pendingSavedActionMutation = null;
  }
  requestSavedActionsRefresh({ delay: 0, force: true, autoSelectFirst: false });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initSavedActionsPanel);
} else {
  initSavedActionsPanel();
}

if (typeof window !== 'undefined') {
  window.getSavedActionsSnapshot = getSavedActionsSnapshot;
  window.getCurrentSavedActionId = getCurrentSavedActionId;
  window.refreshSavedActions = refreshSavedActions;
  window.ensureSavedActionsCache = ensureSavedActionsCache;
  window.notifyActionsTabChanged = notifyActionsTabChanged;
  window.requestSavedActionsRefresh = requestSavedActionsRefresh;
  window.notifySavedActionMutation = notifySavedActionMutation;
}
const TableCrafterActionsTab = Object.freeze({
        initialize: initSavedActionsPanel,
        mountEditor: mountReportEditorInActions,
        exitEditor: exitReportFavoriteEditor,
        notifyTabChanged: notifyActionsTabChanged,
        refreshSavedActions: requestSavedActionsRefresh
      });

window.TableCrafterActionsTab = TableCrafterActionsTab;

const WordCrafterActionsTab = Object.freeze({
        initialize: initSavedActionsPanel,
        mountEditor: mountReportEditorInActions,
        exitEditor: exitReportFavoriteEditor,
        notifyTabChanged: notifyActionsTabChanged,
        refreshSavedActions: requestSavedActionsRefresh
      });

window.WordCrafterActionsTab = WordCrafterActionsTab;

</script>
