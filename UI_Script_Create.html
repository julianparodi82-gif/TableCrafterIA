<script>
/* -------------------------------------------------------------------------- */
/*  Create Tab Shared State                                                   */
/* -------------------------------------------------------------------------- */
let currentHeaders = [];
let rangeInfo = null;
let createFormatDirty = false;
let pendingFormatState = { applied: false, range: null };
let tableFavoriteEditingId = '';
let tableFavoriteEditingName = '';
let tableFavoritesCache = [];
let tableFavoritesLoadingPromise = null;
let tableFavoriteSaving = false;

const CREATE_TITLE_COPY = {
        word: {
          label: 'Título del texto',
          tooltip:
            'Define el nombre principal del texto. Puedes ajustar el formato incluso si se genera automáticamente.'
        },
        table: {
          label: 'Título de la tabla',
          tooltip:
            'Define el nombre principal de la tabla. Puedes ajustar el formato incluso si se genera automáticamente.'
        }
      };

/* -------------------------------------------------------------------------- */
/*  Create Tab Range Controls                                                 */
/* -------------------------------------------------------------------------- */
function syncCreateRangeModeUI() {
        const isWordTheme = isWordThemeActiveForCreate();
        const useRange = isWordRangeSelectionEnabled();
        const toggleRow = document.getElementById('wordRangeToggleRow');
        const rangeFields = document.getElementById('wordRangeFields');
        const legend = document.getElementById('wordRangeLegend');
        const cursorNotice = document.getElementById('wordCursorNotice');
        const splitRow = document.getElementById('wordSplitSentencesRow');
        const splitToggle = document.getElementById('wordSplitSentencesToggle');
        const splitLabel = document.querySelector('label[for="wordSplitSentencesToggle"]');
        const titleLabel = document.getElementById('tableNameLabel');
        const shouldDisableSplit = Boolean(isWordTheme && useRange);
        const refreshBtn = document.getElementById('refreshRangeBtn');
        const rangeInput = document.getElementById('rangeInput');
        const applyBtn = document.getElementById('applyFormatBtn');
        const headerOptions = document.getElementById('tableHeaderOptions');
        if (titleLabel) {
          const copy = isWordTheme ? CREATE_TITLE_COPY.word : CREATE_TITLE_COPY.table;
          titleLabel.textContent = copy.label;
          titleLabel.setAttribute('data-tooltip', copy.tooltip);
          if (titleLabel.dataset) {
            titleLabel.dataset.tooltip = copy.tooltip;
          }
        }
        if (toggleRow) {
          toggleRow.style.display = isWordTheme ? 'flex' : 'none';
        }
        if (rangeFields) {
          rangeFields.style.display = !isWordTheme || useRange ? '' : 'none';
        }
        if (legend) {
          legend.style.display = isWordTheme && useRange ? 'block' : 'none';
        }
        if (cursorNotice) {
          cursorNotice.style.display = isWordTheme && !useRange ? 'block' : 'none';
        }
        if (splitRow) {
          splitRow.style.display = isWordTheme ? 'block' : 'none';
          splitRow.classList.toggle('is-disabled', !!shouldDisableSplit);
        }
        if (splitToggle) {
          if (shouldDisableSplit) {
            if (
              !splitToggle.dataset ||
              !Object.prototype.hasOwnProperty.call(splitToggle.dataset, 'wordStoredValue')
            ) {
              splitToggle.dataset.wordStoredValue = splitToggle.checked ? 'true' : 'false';
            }
            splitToggle.checked = false;
            splitToggle.disabled = true;
            splitToggle.setAttribute('aria-disabled', 'true');
          } else {
            splitToggle.disabled = false;
            splitToggle.removeAttribute('aria-disabled');
            let restoredValue = null;
            if (
              splitToggle.dataset &&
              Object.prototype.hasOwnProperty.call(splitToggle.dataset, 'wordStoredValue')
            ) {
              restoredValue = splitToggle.dataset.wordStoredValue === 'true';
              delete splitToggle.dataset.wordStoredValue;
            } else if (typeof loadWordSplitSentencesPreference === 'function') {
              restoredValue = !!loadWordSplitSentencesPreference();
            }
            if (restoredValue !== null) {
              splitToggle.checked = restoredValue;
            }
          }
        }
        if (splitLabel) {
          splitLabel.classList.toggle('is-disabled', !!shouldDisableSplit);
          if (shouldDisableSplit) {
            splitLabel.setAttribute('aria-disabled', 'true');
          } else {
            splitLabel.removeAttribute('aria-disabled');
          }
        }
        if (refreshBtn) {
          refreshBtn.disabled = Boolean(isWordTheme && !useRange);
          if (refreshBtn.disabled) {
            refreshBtn.setAttribute('aria-disabled', 'true');
          } else {
            refreshBtn.removeAttribute('aria-disabled');
          }
        }
        if (rangeInput) {
          const shouldDisable = Boolean(isWordTheme && !useRange);
          rangeInput.disabled = shouldDisable;
          if (shouldDisable) {
            rangeInput.setAttribute('aria-disabled', 'true');
          } else {
            rangeInput.removeAttribute('aria-disabled');
          }
        }
        if (applyBtn) {
          const shouldDisableApply = Boolean(isWordTheme && !useRange);
          applyBtn.disabled = shouldDisableApply;
          if (shouldDisableApply) {
            applyBtn.setAttribute('aria-disabled', 'true');
          } else {
            applyBtn.removeAttribute('aria-disabled');
          }
        }
        if (headerOptions) {
          headerOptions.style.display = isWordTheme ? 'none' : '';
        }
        const saveBtn = document.getElementById('saveTableBtn');
        if (saveBtn) {
          const shouldDisableSave = Boolean(isWordTheme && !useRange);
          saveBtn.disabled = shouldDisableSave;
          if (shouldDisableSave) {
            saveBtn.setAttribute('aria-disabled', 'true');
          } else {
            saveBtn.removeAttribute('aria-disabled');
          }
        }
      }

/* -------------------------------------------------------------------------- */
/*  Create Tab Formatting State                                               */
/* -------------------------------------------------------------------------- */
function resetPendingFormatState() {
        pendingFormatState = { applied: false, range: null };
      }

function setPendingFormattedRange(info) {
        if (info && info.sheetName && info.a1Notation) {
          pendingFormatState = {
            applied: true,
            range: {
              sheetName: info.sheetName,
              a1Notation: info.a1Notation
            }
          };
        } else {
          resetPendingFormatState();
        }
      }

function isFormatLockActive() {
        return !!(pendingFormatState && pendingFormatState.applied);
      }

function clearCreateFormatDirty() {
        createFormatDirty = false;
      }

function markCreateFormatDirty() {
        createFormatDirty = true;
      }

function isCreateFormatDirty() {
        return !!createFormatDirty;
      }

function resetCreateTabView(options) {
        options = options || {};
        if (!options.preserveRange) {
          resetPendingFormatState();
          clearRangeUI();
        }
        if (!options.preserveFields) {
          resetWordTextOptions();
          const nameInput = document.getElementById('tableName');
          if (nameInput) {
            nameInput.value = '';
          }
          const descInput = document.getElementById('tableDesc');
          if (descInput) {
            descInput.value = '';
          }
          setDefaultStyles();
          setTableFavoriteEditingId('');
        }
        if (!options.preserveHeaders) {
          currentHeaders = [];
          renderCreateHeaders();
        }
        clearCreateFormatDirty();
        syncCreateRangeModeUI();
        syncWordCreateOptions();
      }

function clearRangeUI() {
        const label = document.getElementById('rangeLabel');
        if (label) {
          label.textContent = '—';
        }
        const input = document.getElementById('rangeInput');
        if (input) {
          input.value = '';
          input.dataset.manual = 'false';
        }
        rangeInfo = null;
        clearCreateFormatDirty();
      }

function setRangeUI(info, options) {
        options = options || {};
        if (!info || !info.sheetName || !info.a1Notation) {
          clearRangeUI();
          return;
        }
        const rows = typeof info.rows === 'number' ? info.rows : (info.rows || 0);
        const cols = typeof info.cols === 'number' ? info.cols : (info.cols || 0);
        const label = document.getElementById('rangeLabel');
        const input = document.getElementById('rangeInput');
        const fullA1 = info.sheetName + '!' + info.a1Notation;
        if (label) {
          const dims = rows && cols ? ' (' + cols + '×' + rows + ')' : '';
          label.textContent = fullA1 + dims;
        }
        if (input && (options.force || input.dataset.manual !== 'true')) {
          input.value = fullA1;
          input.dataset.manual = 'false';
        }
        const incomingHeaders = Array.isArray(info.headers) ? info.headers : currentHeaders;
        rangeInfo = {
          sheetName: info.sheetName,
          a1Notation: info.a1Notation,
          rows: rows,
          cols: cols,
          headers: cloneHeaderModels(incomingHeaders)
        };
        rangeInfo.fullA1 = fullA1;
      }

function getRangeInputValue() {
        const input = document.getElementById('rangeInput');
        if (input) {
          const text = input.value.trim();
          if (text) {
            return text;
          }
        }
        if (rangeInfo && rangeInfo.sheetName && rangeInfo.a1Notation) {
          return rangeInfo.sheetName + '!' + rangeInfo.a1Notation;
        }
        return '';
      }

function renderCreateHeaders() {
        renderHeaderList('headersList', currentHeaders);
      }

function setDefaultStyles() {
        const colorHeader = document.getElementById('colorHeader');
        const colorAlt1 = document.getElementById('colorAlt1');
        const colorAlt2 = document.getElementById('colorAlt2');
        const borderToggle = document.getElementById('toggleBorder');
        const boldToggle = document.getElementById('toggleBold');
        if (colorHeader) colorHeader.value = DEFAULT_STYLE.headerColor;
        if (colorAlt1) colorAlt1.value = DEFAULT_STYLE.altColor1;
        if (colorAlt2) colorAlt2.value = DEFAULT_STYLE.altColor2;
        if (borderToggle) borderToggle.checked = DEFAULT_STYLE.border;
        if (boldToggle) boldToggle.checked = DEFAULT_STYLE.bold;
      }

/* -------------------------------------------------------------------------- */
/*  Table Favorite Helpers                                                    */
/* -------------------------------------------------------------------------- */
function parseTableFavoriteRangeParts(value) {
        const trimmed = typeof value === 'string' ? value.trim() : '';
        if (!trimmed) {
          return { sheet: '', range: '' };
        }
        const bangIndex = trimmed.indexOf('!');
        if (bangIndex === -1) {
          return { sheet: '', range: trimmed };
        }
        const sheetPart = trimmed.substring(0, bangIndex).replace(/^'+|'+$/g, '');
        const rangePart = trimmed.substring(bangIndex + 1);
        return { sheet: sheetPart, range: rangePart };
      }

function getTableFavoriteName() {
        const nameInput = document.getElementById('tableName');
        return nameInput ? nameInput.value.trim() : '';
      }

function getTableFavoriteDescriptionFromConfig(config) {
        const safe = config && typeof config === 'object' ? config : {};
        return safe.description ? String(safe.description) : '';
      }

function updateTableFavoriteButtonState() {
        const btn = document.getElementById('tableFavoriteBtn');
        if (!btn) {
          return;
        }
        const editing = !!tableFavoriteEditingId;
        btn.dataset.tableFavoriteMode = editing ? 'edit' : 'create';
        if (tableFavoriteSaving) {
          btn.disabled = true;
          btn.setAttribute('aria-disabled', 'true');
        } else {
          btn.disabled = false;
          btn.removeAttribute('aria-disabled');
        }
        const idleText = editing ? 'Actualizar favorito' : 'Agregar a favoritos';
        if (tableFavoriteSaving) {
          beginFavoriteButtonLoading(btn, editing ? 'Actualizando' : 'Agregando');
        } else {
          endFavoriteButtonLoading(btn, idleText);
        }
      }

function setTableFavoriteEditingId(id, name) {
        tableFavoriteEditingId = id ? String(id) : '';
        if (name !== undefined) {
          tableFavoriteEditingName = name ? String(name) : '';
        } else if (!tableFavoriteEditingId) {
          tableFavoriteEditingName = '';
        }
        updateTableFavoriteButtonState();
      }

function collectTableFavoriteConfig(validation) {
        const base = validation && validation.values ? validation : validateTableDetails();
        const values = base && base.values ? base.values : { name: '', description: '', headers: [] };
        const headers = cloneHeaderModels(values.headers || []);
        const rangeValue = getRangeInputValue();
        const info = rangeInfo && typeof rangeInfo === 'object' ? rangeInfo : {};
        const fallbackParts = parseTableFavoriteRangeParts(rangeValue);
        const sheetName = info.sheetName || fallbackParts.sheet;
        const a1Notation = info.a1Notation || fallbackParts.range;
        const rowsRaw = info.rows !== undefined ? info.rows : 0;
        const colsRaw = info.cols !== undefined ? info.cols : headers.length;
        const rows = typeof rowsRaw === 'number' ? rowsRaw : parseInt(rowsRaw, 10) || 0;
        const cols = typeof colsRaw === 'number' ? colsRaw : parseInt(colsRaw, 10) || headers.length;
        const headerColorInput = document.getElementById('colorHeader');
        const alt1Input = document.getElementById('colorAlt1');
        const alt2Input = document.getElementById('colorAlt2');
        const borderToggle = document.getElementById('toggleBorder');
        const boldToggle = document.getElementById('toggleBold');
        const fullRange = sheetName && a1Notation ? sheetName + '!' + a1Notation : rangeValue || '';
        return {
          version: 1,
          name: values.name || '',
          description: values.description || '',
          range: {
            value: rangeValue || '',
            sheetName: sheetName || '',
            a1Notation: a1Notation || '',
            rows: rows,
            cols: cols,
            fullA1: fullRange
          },
          headers: headers,
          style: {
            headerColor: headerColorInput ? headerColorInput.value : DEFAULT_STYLE.headerColor,
            altColor1: alt1Input ? alt1Input.value : DEFAULT_STYLE.altColor1,
            altColor2: alt2Input ? alt2Input.value : DEFAULT_STYLE.altColor2,
            border: borderToggle ? !!borderToggle.checked : DEFAULT_STYLE.border,
            bold: boldToggle ? !!boldToggle.checked : DEFAULT_STYLE.bold
          },
          updateFormulaReferences: true,
          origin: 'tableCreate',
          kind: 'tableFavorite'
        };
      }

function refreshTableFavorites(options) {
        const opts = options || {};
        if (tableFavoritesLoadingPromise) {
          return tableFavoritesLoadingPromise.then(function(list) {
            return Array.isArray(list) ? list.slice() : [];
          });
        }
        tableFavoritesLoadingPromise = callServerFunction('listTableFavorites')
          .then(function(result) {
            const favorites = Array.isArray(result) ? result : [];
            const filtered = favorites.filter(function(entry) {
              if (!entry) {
                return false;
              }
              const recordType = entry.recordType || entry.favoriteKind || '';
              const origin = entry.origin || '';
              if (recordType === 'tableEditFavorite') {
                return false;
              }
              if (typeof origin === 'string' && origin.toLowerCase().indexOf('edit') !== -1) {
                return false;
              }
              return true;
            });
            tableFavoritesCache = filtered.slice();
            if (opts.broadcast !== false) {
              document.dispatchEvent(
                new CustomEvent('tc:tableFavoritesUpdated', {
                  detail: { list: filtered.slice() }
                })
              );
            }
            return filtered.slice();
          })
          .catch(function(err) {
            if (!opts.silent) {
              showMessageModal('No se pudieron obtener las tablas favoritas: ' + (err && err.message ? err.message : err), {
                title: 'No se pudo cargar',
                variant: 'error'
              });
            }
            throw err;
          })
          .finally(function() {
            tableFavoritesLoadingPromise = null;
          });
        return tableFavoritesLoadingPromise;
      }

async function handleTableFavoriteSave() {
        if (tableFavoriteSaving) {
          return;
        }
        if (isWordThemeActiveForCreate()) {
          await showMessageModal('Cambia a TableCrafter para guardar esta configuración como favorita.', {
            title: 'Función no disponible',
            variant: 'warning'
          });
          return;
        }
        const validation = validateTableDetails();
        if (validation.missing.length > 0) {
          const message = buildMissingFieldsMessage(validation.missing);
          await showMessageModal(message || 'Complete todos los campos obligatorios antes de continuar.', {
            title: 'Información incompleta',
            variant: 'error'
          });
          return;
        }
        const tableTitle = getTableFavoriteName();
        if (!tableTitle) {
          await showMessageModal('Agrega un título a la tabla antes de guardarla como favorita.', {
            title: 'Título requerido',
            variant: 'warning'
          });
          return;
        }
        currentHeaders = cloneHeaderModels(validation.values.headers || []);
        renderCreateHeaders();
        const config = collectTableFavoriteConfig(validation);
        const promptFn = typeof promptFavoriteName === 'function'
          ? promptFavoriteName
          : window.promptFavoriteName;
        const favoriteName = promptFn
          ? await promptFn({
              title: tableFavoriteEditingId ? 'Actualizar favorito' : 'Guardar en favoritos',
              label: 'Nombre del favorito',
              placeholder: 'Ej. Tabla semanal de métricas',
              confirmText: tableFavoriteEditingId ? 'Actualizar' : 'Guardar',
              defaultValue: tableFavoriteEditingName,
              maxLength: 140
            })
          : null;
        if (!favoriteName) {
          return;
        }
        const payload = {
          id: tableFavoriteEditingId || '',
          name: favoriteName,
          description: validation.values.description || getTableFavoriteDescriptionFromConfig(config),
          config: config,
          kind: 'tableFavorite',
          origin: 'tableCreate',
          idPrefix: 'CrearTablaTC',
          metadata:
            typeof buildFavoriteMetadata === 'function'
              ? buildFavoriteMetadata('createTab', {
                  tabId: 'createTab',
                  sourceType: 'table',
                  action: 'tableFavorite',
                  context: 'crearTabla',
                  sourceId: tableFavoriteEditingId || '',
                  favoriteId: tableFavoriteEditingId || '',
                  tableName: tableTitle
                })
              : (function() {
                  const suffix =
                    typeof generateMetadataGuidSuffix === 'function'
                      ? generateMetadataGuidSuffix()
                      : String(Date.now());
                  const baseId = 'CrearTablaTC:' + suffix;
                  return {
                    type: 'CrearTablaTC:' + suffix,
                    id: baseId,
                    tabId: 'createTab',
                    tab: 'createTab',
                    sourceType: 'table',
                    action: 'tableFavorite',
                    context: 'crearTabla'
                  };
                })()
        };
        tableFavoriteSaving = true;
        updateTableFavoriteButtonState();
        try {
          const response = await callServerFunction('saveTableFavorite', payload);
          if (!response || response.error) {
            throw new Error((response && response.error) || 'No se pudo guardar la tabla favorita.');
          }
          const savedId = response.id || tableFavoriteEditingId || '';
          setTableFavoriteEditingId(savedId, favoriteName);
          await refreshTableFavorites({ selectId: savedId });
          if (typeof notifySavedActionMutation === 'function') {
            notifySavedActionMutation({
              id: savedId,
              force: true,
              delay: 0,
              autoSelectFirst: false,
              forceLoad: true
            });
          } else if (typeof requestSavedActionsRefresh === 'function') {
            requestSavedActionsRefresh({
              selectId: savedId,
              force: true,
              delay: 0,
              autoSelectFirst: false,
              forceLoad: true
            });
          } else if (typeof refreshSavedActions === 'function') {
            refreshSavedActions({
              selectId: savedId,
              force: true,
              autoSelectFirst: false,
              forceLoad: true
            }).catch(function() {});
          }
          await showMessageModal((response && response.message) || 'Tabla favorita guardada.', {
            title: 'Favorito guardado',
            variant: 'success'
          });
        } catch (err) {
          await showMessageModal('No se pudo guardar la tabla favorita: ' + (err && err.message ? err.message : err), {
            title: 'No se pudo guardar',
            variant: 'error'
          });
        } finally {
          tableFavoriteSaving = false;
          updateTableFavoriteButtonState();
        }
      }

function applyTableFavoriteConfig(config) {
        const safe = config && typeof config === 'object' ? config : {};
        const headers = cloneHeaderModels(safe.headers || []);
        currentHeaders = cloneHeaderModels(headers);
        renderCreateHeaders();
        const nameInput = document.getElementById('tableName');
        if (nameInput) {
          nameInput.value = safe.name ? String(safe.name) : '';
        }
        const descInput = document.getElementById('tableDesc');
        if (descInput) {
          descInput.value = safe.description ? String(safe.description) : '';
        }
        const style = safe.style && typeof safe.style === 'object' ? safe.style : {};
        const headerColorInput = document.getElementById('colorHeader');
        if (headerColorInput && style.headerColor) {
          headerColorInput.value = String(style.headerColor);
        }
        const alt1Input = document.getElementById('colorAlt1');
        if (alt1Input && style.altColor1) {
          alt1Input.value = String(style.altColor1);
        }
        const alt2Input = document.getElementById('colorAlt2');
        if (alt2Input && style.altColor2) {
          alt2Input.value = String(style.altColor2);
        }
        const borderToggle = document.getElementById('toggleBorder');
        if (borderToggle && Object.prototype.hasOwnProperty.call(style, 'border')) {
          borderToggle.checked = !!style.border;
        }
        const boldToggle = document.getElementById('toggleBold');
        if (boldToggle && Object.prototype.hasOwnProperty.call(style, 'bold')) {
          boldToggle.checked = !!style.bold;
        }
        const range = safe.range && typeof safe.range === 'object' ? safe.range : {};
        const rangeParts = parseTableFavoriteRangeParts(range.value || range.fullA1 || '');
        const sheetName = range.sheetName || rangeParts.sheet;
        const a1Notation = range.a1Notation || rangeParts.range;
        const rows = typeof range.rows === 'number' ? range.rows : parseInt(range.rows, 10) || 0;
        const cols = typeof range.cols === 'number' ? range.cols : parseInt(range.cols, 10) || headers.length;
        const rangeValue = range.value || range.fullA1 || (sheetName && a1Notation ? sheetName + '!' + a1Notation : '');
        if (sheetName && a1Notation) {
          setRangeUI(
            {
              sheetName: sheetName,
              a1Notation: a1Notation,
              rows: rows,
              cols: cols,
              headers: cloneHeaderModels(currentHeaders)
            },
            { force: true }
          );
        } else {
          const label = document.getElementById('rangeLabel');
          if (label) {
            label.textContent = rangeValue || '—';
          }
          const rangeInput = document.getElementById('rangeInput');
          if (rangeInput) {
            rangeInput.value = rangeValue || '';
            rangeInput.dataset.manual = rangeValue ? 'true' : 'false';
          }
          rangeInfo = {
            sheetName: sheetName || '',
            a1Notation: a1Notation || '',
            rows: rows,
            cols: cols,
            headers: cloneHeaderModels(currentHeaders),
            fullA1: rangeValue || ''
          };
        }
        syncCreateRangeModeUI();
        clearCreateFormatDirty();
        resetPendingFormatState();
      }

async function openTableFavoriteForEditing(favoriteId, options) {
        const id = favoriteId ? String(favoriteId).trim() : '';
        if (!id) {
          return;
        }
        let details;
        try {
          details = await callServerFunction('getTableFavoriteDetails', id);
        } catch (err) {
          await showMessageModal('No se pudo cargar la tabla favorita: ' + (err && err.message ? err.message : err), {
            title: 'No se pudo cargar',
            variant: 'error'
          });
          return;
        }
        if (!details || details.error) {
          await showMessageModal((details && details.error) || 'No se pudo cargar la tabla favorita.', {
            title: 'No se pudo cargar',
            variant: 'error'
          });
          return;
        }
        const themeToggle = document.getElementById('themeToggle');
        if (themeToggle && themeToggle.checked) {
          themeToggle.checked = false;
          themeToggle.dispatchEvent(new Event('change', { bubbles: true }));
        }
        await attemptTabChange('createTab', { force: true, preserveForm: true });
        resetCreateTabView({ preserveRange: false, preserveFields: false, preserveHeaders: false });
        applyTableFavoriteConfig(details.config || {});
        setTableFavoriteEditingId(details.id || id, details.name || '');
        await refreshTableFavorites({ selectId: details.id || id, silent: true }).catch(function() {});
        updateTableFavoriteButtonState();
        if (!options || options.focusName !== false) {
          const nameInput = document.getElementById('tableName');
          if (nameInput) {
            nameInput.focus();
            nameInput.select();
          }
        }
      }

function bindTableFavoriteButton() {
        const btn = document.getElementById('tableFavoriteBtn');
        if (btn && btn.dataset.tableFavoriteBound !== 'true') {
          btn.addEventListener('click', function() {
            handleTableFavoriteSave();
          });
          btn.dataset.tableFavoriteBound = 'true';
          updateTableFavoriteButtonState();
        }
      }

function notifyTableFavoriteThemeChanged(nextTheme) {
        bindTableFavoriteButton();
        if (nextTheme === 'table') {
          updateTableFavoriteButtonState();
          refreshTableFavorites({ silent: true }).catch(function() {});
        } else {
          setTableFavoriteEditingId('');
        }
      }

function initializeTableFavorites() {
        bindTableFavoriteButton();
        updateTableFavoriteButtonState();
        refreshTableFavorites({ silent: true }).catch(function() {});
      }

if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initializeTableFavorites);
      } else {
        initializeTableFavorites();
      }

const TableFavoriteManager = Object.freeze({
        save: handleTableFavoriteSave,
        refreshSavedLists: refreshTableFavorites,
        openFavorite: openTableFavoriteForEditing,
        getEditingId: function() {
          return tableFavoriteEditingId;
        }
      });

window.TableFavoriteManager = TableFavoriteManager;

function loadActiveRange(updateHeaders = true) {
        if (isWordThemeActiveForCreate() && !isWordRangeSelectionEnabled()) {
          return;
        }
        google.script.run.withSuccessHandler(function(info) {
          const label = document.getElementById('rangeLabel');
          if (info.error) {
            clearRangeUI();
            if (label) {
              label.textContent = '—';
            }
            showMessageModal(info.error, {
              title: 'Rango no disponible',
              variant: 'error'
            });
            return;
          }
          const infoForUi = Object.assign({}, info);
          if (!updateHeaders) {
            infoForUi.headers = cloneHeaderModels(currentHeaders);
          }
          setRangeUI(infoForUi, { force: editingId === '' || !document.getElementById('rangeInput') || document.getElementById('rangeInput').value === '' });
          if (updateHeaders) {
            currentHeaders = cloneHeaderModels(info.headers);
          }
          renderCreateHeaders();
          markCreateFormatDirty();
          resetPendingFormatState();
        }).getActiveRangeInfo();
      }

async function handleApplyFormat() {
        if (isWordThemeActiveForCreate() && !isWordRangeSelectionEnabled()) {
          await showMessageModal('Activa "Seleccionar un rango antes de pegar" para aplicar y preparar el formato.', {
            title: 'Selecciona un rango',
            variant: 'info'
          });
          return false;
        }
        const rangeA1 = getRangeInputValue();
        if (!rangeA1) {
          await showMessageModal('Indique un rango válido antes de aplicar el formato.', {
            title: 'Rango requerido',
            variant: 'error'
          });
          return false;
        }

        const validation = validateTableDetails();
        if (!validation.valid) {
          const msg = buildMissingFieldsMessage(validation.missing);
          await showMessageModal(msg || 'Complete todos los campos obligatorios antes de continuar.', {
            title: 'Información incompleta',
            variant: 'error'
          });
          return false;
        }

        currentHeaders = cloneHeaderModels(validation.values.headers);
        renderCreateHeaders();
        const nameInput = document.getElementById('tableName');
        if (nameInput) {
          nameInput.value = validation.values.name;
        }
        const descInput = document.getElementById('tableDesc');
        if (descInput) {
          descInput.value = validation.values.description;
        }

        const headerColor = document.getElementById('colorHeader').value;
        const alt1 = document.getElementById('colorAlt1').value;
        const alt2 = document.getElementById('colorAlt2').value;
        const border = document.getElementById('toggleBorder').checked;
        const bold = document.getElementById('toggleBold').checked;
        const style = { headerColor: headerColor, altColor1: alt1, altColor2: alt2, border: border, bold: bold };
        const tableId = editingId;

        let response;
        try {
          response = await callServerFunction(
            'applyTableFormatting',
            tableId,
            rangeA1,
            validation.values.name,
            validation.values.description,
            cloneHeaderModels(currentHeaders),
            style,
            { skipSaving: true }
          );
        } catch (err) {
          await showMessageModal('No se pudo aplicar el formato: ' + (err && err.message ? err.message : err), {
            title: 'No se pudo aplicar',
            variant: 'error'
          });
          return false;
        }

        if (response && response.error) {
          await showMessageModal(response.error, {
            title: 'No se pudo aplicar',
            variant: 'error'
          });
          return false;
        }

        if (response && response.rangeInfo) {
          setRangeUI(response.rangeInfo, { force: true });
          if (Array.isArray(response.rangeInfo.headers)) {
            currentHeaders = cloneHeaderModels(response.rangeInfo.headers);
            renderCreateHeaders();
          }
          setPendingFormattedRange(response.rangeInfo);
        } else {
          const parts = rangeA1.split('!');
          if (parts.length === 2) {
            setPendingFormattedRange({ sheetName: parts[0], a1Notation: parts[1] });
          } else {
            resetPendingFormatState();
          }
        }

        clearCreateFormatDirty();

        await showMessageModal((response && response.message) || 'Formato aplicado correctamente.', {
          title: 'Formato aplicado',
          variant: 'success'
        });
        return true;
      }

async function handleSaveAction(options) {
        options = options || {};
        if (isWordThemeActiveForCreate() && !isWordRangeSelectionEnabled()) {
          await showMessageModal('El guardado requiere seleccionar un rango. Activa la opción para definir dónde pegar el texto.', {
            title: 'Selecciona un rango',
            variant: 'info'
          });
          return false;
        }
        const rangeA1 = getRangeInputValue();
        if (!rangeA1) {
          await showMessageModal('Indique un rango válido antes de guardar la tabla.', {
            title: 'Rango requerido',
            variant: 'error'
          });
          return false;
        }

        const validation = validateTableDetails();
        if (validation.missing.length > 0) {
          const missingExcludingName = validation.missing.filter(function(item) {
            return item !== 'Nombre de la tabla';
          });

          if (missingExcludingName.length > 0) {
            const msg = buildMissingFieldsMessage(validation.missing);
            await showMessageModal(msg || 'Complete todos los campos obligatorios antes de continuar.', {
              title: 'Información incompleta',
              variant: 'error'
            });
            return false;
          }

          if (validation.missing.indexOf('Nombre de la tabla') !== -1) {
            const continueWithoutName = await showConfirmModal('Guardar sin nombre hará que la tabla sea difícil de identificar. ¿Desea continuar?', {
              title: 'Guardar sin nombre',
              variant: 'warning',
              confirmText: 'Continuar',
              cancelText: 'Cancelar'
            });
            if (!continueWithoutName) {
              return false;
            }
          }
        }

        const uniqueName = await ensureUniqueTableNameOrAlert(validation.values.name, {
          ignoreId: editingId
        });
        if (!uniqueName) {
          return false;
        }

        currentHeaders = cloneHeaderModels(validation.values.headers);
        renderCreateHeaders();
        const nameInput = document.getElementById('tableName');
        if (nameInput) {
          nameInput.value = validation.values.name;
        }
        const descInput = document.getElementById('tableDesc');
        if (descInput) {
          descInput.value = validation.values.description;
        }

        const headerColor = document.getElementById('colorHeader').value;
        const alt1 = document.getElementById('colorAlt1').value;
        const alt2 = document.getElementById('colorAlt2').value;
        const border = document.getElementById('toggleBorder').checked;
        const bold = document.getElementById('toggleBold').checked;
        const style = { headerColor: headerColor, altColor1: alt1, altColor2: alt2, border: border, bold: bold };
        const tableId = editingId;
        const entryValues = Object.assign({}, validation.values, {
          updateFormulaReferences: true
        });

        if (isCreateFormatDirty() && !options.skipFormatCheck) {
          await showMessageModal('Debe aplicar el formato al rango actual antes de guardar la tabla.', {
            title: 'Formato pendiente',
            variant: 'warning'
          });
          return false;
        }

        let response;
        try {
          response = await callServerFunction(
            'applyTableFormatting',
            tableId,
            rangeA1,
            validation.values.name,
            validation.values.description,
            cloneHeaderModels(currentHeaders),
            style,
            { skipFormatting: true, formulaPreference: true }
          );
        } catch (err) {
          await showMessageModal('No se pudo guardar la tabla: ' + (err && err.message ? err.message : err), {
            title: 'No se pudo guardar',
            variant: 'error'
          });
          return false;
        }

        if (response && response.error) {
          await showMessageModal(response.error, {
            title: 'No se pudo guardar',
            variant: 'error'
          });
          return false;
        }

        if (response && response.rangeInfo) {
          setRangeUI(response.rangeInfo, { force: true });
          if (Array.isArray(response.rangeInfo.headers)) {
            currentHeaders = cloneHeaderModels(response.rangeInfo.headers);
            renderCreateHeaders();
          }
        }

        if (response && response.id) {
          lastSavedTableId = response.id;
          const cachedEntry = buildSavedTableCacheEntry(
            response.id,
            entryValues,
            (response && response.rangeInfo) || rangeInfo,
            style,
            currentHeaders
          );
          if (cachedEntry) {
            upsertSavedTablesCache(cachedEntry);
            applySavedTablesFromCache(['editSavedTables', 'aiSavedTables'], {
              selectId: response.id
            });
          }
        }

        editingId = '';

        await refreshSavedTables(['editSavedTables', 'aiSavedTables'], {
          selectId: lastSavedTableId
        });

        resetCreateTabView({
          preserveRange: false,
          preserveFields: false,
          preserveHeaders: false
        });

        await showMessageModal((response && response.message) || 'Tabla guardada correctamente.', {
          title: 'Tabla guardada',
          variant: 'success'
        });
        return true;
      }

async function clearPendingFormattedRange() {
        const targetInfo = (pendingFormatState && pendingFormatState.range) || rangeInfo;
        const rangeNotation = getFullRangeNotation(targetInfo);
        if (!rangeNotation) {
          await showMessageModal('No se pudo identificar el rango a limpiar. Actualice el rango e inténtelo nuevamente.', {
            title: 'Rango no disponible',
            variant: 'error'
          });
          return false;
        }

        let response;
        try {
          response = await callServerFunction('clearRangeByNotation', rangeNotation);
        } catch (err) {
          await showMessageModal('No se pudo borrar el rango: ' + (err && err.message ? err.message : err), {
            title: 'No se pudo borrar',
            variant: 'error'
          });
          return false;
        }

        if (response && response.error) {
          await showMessageModal(response.error, {
            title: 'No se pudo borrar',
            variant: 'error'
          });
          return false;
        }

        resetPendingFormatState();
        clearRangeUI();
        return true;
      }

async function resolvePendingFormatting() {
        if (!isFormatLockActive()) {
          return 'none';
        }
        const result = await openModal({
          title: 'Cambios pendientes',
          message: 'Se aplicó un formato que aún no se guardó. Elija guardar la tabla o borrar el formato para continuar.',
          variant: 'warning',
          primaryText: 'Guardar Tabla',
          secondaryText: 'Borrar tabla',
          allowEscape: false
        });

        if (result === 'primary') {
          const saved = await handleSaveAction({ triggeredByGuard: true });
          if (saved) {
            return 'saved';
          }
          return 'blocked';
        }
        if (result === 'secondary') {
          const cleared = await clearPendingFormattedRange();
          if (cleared) {
            await showMessageModal('Se borraron el contenido y formato del rango seleccionado.', {
              title: 'Tabla borrada',
              variant: 'success'
            });
            return 'cleared';
          }
          return 'blocked';
        }
        return 'blocked';
      }

const TableCrafterCreateTab = Object.freeze({
        markDirty: markCreateFormatDirty,
        clearDirty: clearCreateFormatDirty,
        isDirty: isCreateFormatDirty,
        resetView: resetCreateTabView,
        syncRangeModeUI: syncCreateRangeModeUI,
        resolvePendingFormatting: resolvePendingFormatting,
        clearPendingFormat: clearPendingFormattedRange,
        setRangeUI: setRangeUI,
        getRangeInputValue: getRangeInputValue,
        applyFormat: handleApplyFormat,
        saveTable: handleSaveAction
      });

window.TableCrafterCreateTab = TableCrafterCreateTab;
</script>
