<script>
/* -------------------------------------------------------------------------- */
/*  WordCrafter Create Tab UI                                                 */
/* -------------------------------------------------------------------------- */
const WORD_TITLE_AUTO_PLACEHOLDER = 'Título generado automáticamente';
const WORD_WEB_SOURCE_LIMIT = 10;
const WORD_SECTION_WEB_LIMIT = 3;
const WORD_GENERATE_BUTTON_LABEL = 'Generar y Guardar Texto';

const WORD_CONTEXT_SECTION_CONFIG = [
      {
        toggleId: null,
        wrapperId: 'wordContextDetailsWrapper',
        fieldsId: 'wordContextDetailsFields',
        controlIds: ['wordBodyContext']
      },
      {
        wrapperId: 'wordLengthSection',
        fieldsId: 'wordLengthFields',
        controlIds: ['wordBodyLength']
      },
      {
        wrapperId: 'wordLanguageSection',
        fieldsId: 'wordLanguageFields',
        controlIds: ['wordBodyLanguage']
      },
      {
        wrapperId: 'wordToneSection',
        fieldsId: 'wordToneFields',
        controlIds: ['wordBodyTone']
      },
      {
        wrapperId: 'wordProfileSection',
        fieldsId: 'wordProfileFields',
        controlIds: ['wordBodyProfile']
      }
    ];

const WORD_STRUCTURE_SECTION_CONFIG = [
      {
        toggleId: 'wordIntroToggle',
        wrapperId: 'wordIntroSection',
        fieldsId: 'wordIntroFields',
        controlIds: ['wordIntroFocus'],
        webConfig: {
          toggleId: 'wordIntroWebToggle',
          bodyId: 'wordIntroWebBody',
          listId: 'wordIntroWebList',
          addId: 'wordIntroWebAdd',
          stateKey: 'intro'
        }
      },
      {
        toggleId: 'wordConclusionToggle',
        wrapperId: 'wordConclusionSection',
        fieldsId: 'wordConclusionFields',
        controlIds: ['wordConclusionFocus'],
        webConfig: {
          toggleId: 'wordConclusionWebToggle',
          bodyId: 'wordConclusionWebBody',
          listId: 'wordConclusionWebList',
          addId: 'wordConclusionWebAdd',
          stateKey: 'conclusion'
        }
      }
    ];

let wordWebSourcesState = [];
let wordWebSourcesCollapsed = false;
let wordStructureSectionLinksState = { intro: [], conclusion: [] };
let wordWebSavedSelections = { tables: [], texts: [] };
let wordWebSavedCache = { tables: [], texts: [] };
let wordWebSavedInitialized = false;
let wordWebSavedLoadingPromise = null;
let wordWebSavedLastError = '';
let wordFavoriteEditingId = '';
let wordFavoritesCache = [];
let wordFavoritesLoadingPromise = null;
let wordFavoriteSaving = false;
let wordGenerateInProgress = false;

const WORD_SPLIT_SENTENCES_STORAGE_KEY = 'tc.wordcrafter.create.splitSentences';
let wordSplitSentencesPreference = null;

function loadWordSplitSentencesPreference() {
        if (typeof wordSplitSentencesPreference === 'boolean') {
          return wordSplitSentencesPreference;
        }
        let storedValue = false;
        let hasStoredValue = false;
        if (typeof getLocalStorage === 'function') {
          const storage = getLocalStorage();
          if (storage) {
            try {
              const raw = storage.getItem(WORD_SPLIT_SENTENCES_STORAGE_KEY);
              if (raw === 'true' || raw === 'false') {
                storedValue = raw === 'true';
                hasStoredValue = true;
              }
            } catch (err) {
              console.log('No se pudo leer la preferencia de oraciones por celda.', err);
            }
          }
        }
        if (!hasStoredValue) {
          try {
            if (typeof window !== 'undefined' && window.localStorage) {
              const raw = window.localStorage.getItem(WORD_SPLIT_SENTENCES_STORAGE_KEY);
              if (raw === 'true' || raw === 'false') {
                storedValue = raw === 'true';
                hasStoredValue = true;
              }
            }
          } catch (err) {
            console.log('No se pudo leer la preferencia de oraciones por celda.', err);
          }
        }
        wordSplitSentencesPreference = hasStoredValue ? storedValue : false;
        return wordSplitSentencesPreference;
      }

function saveWordSplitSentencesPreference(value) {
        const normalized = !!value;
        wordSplitSentencesPreference = normalized;
        let handled = false;
        if (typeof getLocalStorage === 'function') {
          const storage = getLocalStorage();
          if (storage) {
            try {
              storage.setItem(WORD_SPLIT_SENTENCES_STORAGE_KEY, normalized ? 'true' : 'false');
              handled = true;
            } catch (err) {
              console.log('No se pudo guardar la preferencia de oraciones por celda.', err);
            }
          }
        }
        if (handled) {
          return;
        }
        try {
          if (typeof window !== 'undefined' && window.localStorage) {
            window.localStorage.setItem(WORD_SPLIT_SENTENCES_STORAGE_KEY, normalized ? 'true' : 'false');
          }
        } catch (err) {
          console.log('No se pudo guardar la preferencia de oraciones por celda.', err);
        }
      }

function applyWordSplitSentencesPreferenceToToggle() {
        const toggle = document.getElementById('wordSplitSentencesToggle');
        if (!toggle) {
          return;
        }
        toggle.checked = !!loadWordSplitSentencesPreference();
      }

function ensureWordStructurePlacement() {
        const contextCard = document.getElementById('wordContextCard');
        const structureCard = document.getElementById('wordStructureCard');
        if (!contextCard || !structureCard) {
          return;
        }
        const parent = contextCard.parentNode;
        if (!parent) {
          return;
        }

        const webSourcesCard = document.getElementById('wordWebSourcesCard');
        if (webSourcesCard && webSourcesCard.parentNode === parent) {
          const desiredNext = contextCard.nextElementSibling;
          if (desiredNext !== webSourcesCard) {
            parent.insertBefore(webSourcesCard, contextCard.nextSibling);
          }
        }

        const referenceElement = webSourcesCard && webSourcesCard.parentNode === parent ? webSourcesCard : contextCard;
        const nextSibling = referenceElement.nextElementSibling;
        if (nextSibling === structureCard) {
          return;
        }
        parent.insertBefore(structureCard, referenceElement.nextSibling);
      }

function normalizeWordWebSourceEntry(entry) {
        if (!entry || typeof entry !== 'object') {
          return { url: '', description: '', hasDescription: false };
        }
        return {
          url: entry.url ? String(entry.url) : '',
          description: entry.description ? String(entry.description) : '',
          hasDescription: entry.hasDescription === true || entry.hasDescription === 'true'
        };
      }

function ensureWordWebSourceEntry(index) {
        if (index < 0 || index >= wordWebSourcesState.length) {
          return { url: '', description: '', hasDescription: false };
        }
        const normalized = normalizeWordWebSourceEntry(wordWebSourcesState[index]);
        wordWebSourcesState[index] = normalized;
        return normalized;
      }

function isWordThemeActiveForCreate() {
        return document.body && document.body.classList.contains('theme-wordcrafter');
      }

function isWordRangeSelectionEnabled() {
        if (!isWordThemeActiveForCreate()) {
          return true;
        }
        const toggle = document.getElementById('wordUseRangeToggle');
        return !toggle || toggle.checked;
      }

function resetWordFormatInputs(containerId) {
        const container = document.getElementById(containerId);
        if (!container) {
          return;
        }
        const inputs = container.querySelectorAll('input, select, textarea');
        inputs.forEach(function(control) {
          if (control.type === 'checkbox') {
            control.checked = control.defaultChecked;
            return;
          }
          const fallback = control.dataset && control.dataset.defaultValue !== undefined ? control.dataset.defaultValue : control.defaultValue;
          if (fallback !== undefined) {
            control.value = fallback;
          } else {
            control.value = '';
          }
        });
      }

function resetWordTextOptions() {
        const autoToggle = document.getElementById('wordAutoTitleToggle');
        const manualTitleToggle = document.getElementById('wordManualTitleFormatToggle');
        const manualBodyToggle = document.getElementById('wordManualBodyFormatToggle');
        const splitToggle = document.getElementById('wordSplitSentencesToggle');
        const splitLabel = document.querySelector('label[for="wordSplitSentencesToggle"]');
        const splitRow = document.getElementById('wordSplitSentencesRow');
        const titleInput = document.getElementById('tableName');
        wordStructureSectionLinksState = { intro: [], conclusion: [] };
        if (autoToggle) {
          autoToggle.checked = false;
        }
        if (manualTitleToggle) {
          manualTitleToggle.checked = false;
        }
        if (manualBodyToggle) {
          manualBodyToggle.checked = false;
        }
        if (splitToggle) {
          splitToggle.checked = !!loadWordSplitSentencesPreference();
          splitToggle.disabled = false;
          splitToggle.removeAttribute('aria-disabled');
          if (splitToggle.dataset) {
            delete splitToggle.dataset.wordStoredValue;
          }
        }
        if (splitLabel) {
          splitLabel.classList.remove('is-disabled');
          splitLabel.removeAttribute('aria-disabled');
        }
        if (splitRow) {
          splitRow.classList.remove('is-disabled');
        }
        if (titleInput) {
          if (titleInput.dataset && titleInput.dataset.autoFilled === 'true') {
            titleInput.value = titleInput.dataset.prevManualValue || '';
            delete titleInput.dataset.autoFilled;
            delete titleInput.dataset.prevManualValue;
          }
          titleInput.disabled = false;
          titleInput.removeAttribute('aria-disabled');
        }
        resetWordFormatInputs('wordTitleFormatOptions');
        resetWordFormatInputs('wordBodyFormatOptions');
        [
          { target: 'wordTitleFormatOptions', content: 'wordTitleFormatContent' },
          { target: 'wordBodyFormatOptions', content: 'wordBodyFormatContent' },
          { target: 'wordContextCard', content: 'wordContextCardContent' },
          { target: 'wordStructureCard', content: 'wordStructureContent' },
          { target: 'wordPersonalizationCard', content: 'wordPersonalizationContent' },
          { target: 'wordWebSourcesCard', content: 'wordWebSourcesContent' }
        ].forEach(function(entry) {
          const target = document.getElementById(entry.target);
          if (target) {
            target.classList.remove('is-collapsed');
          }
          const collapseId = entry.content || entry.target;
          const content = collapseId ? document.getElementById(collapseId) : null;
          if (content) {
            content.classList.remove('is-collapsed');
            content.classList.remove('is-hidden');
          }
          setWordCollapseToggleDisabled(collapseId, false);
          syncWordCollapseTargetState(collapseId);
        });
        [
          'wordIntroFields',
          'wordConclusionFields',
          'wordIntroWebBody',
          'wordConclusionWebBody',
          'wordWebSourcesBody',
          'wordWebSavedBody'
        ].forEach(function(sectionId) {
          const sectionEl = document.getElementById(sectionId);
          if (sectionEl) {
            sectionEl.classList.remove('is-collapsed');
          }
          syncWordCollapseTargetState(sectionId);
        });
        const extraFields = [
          'wordBodyContext',
          'wordBodyLanguage',
          'wordBodyProfile'
        ];
        extraFields.forEach(function(fieldId) {
          const el = document.getElementById(fieldId);
          if (el) {
            const fallback = el.dataset && el.dataset.defaultValue !== undefined ? el.dataset.defaultValue : el.defaultValue;
            if (fallback !== undefined) {
              el.value = fallback;
            } else {
              el.value = '';
            }
          }
        });
        const lengthSelect = document.getElementById('wordBodyLength');
        if (lengthSelect) {
          const fallback = lengthSelect.dataset && lengthSelect.dataset.defaultValue !== undefined ? lengthSelect.dataset.defaultValue : lengthSelect.defaultValue;
          lengthSelect.value = fallback !== undefined ? fallback : '';
        }
        const toneSelect = document.getElementById('wordBodyTone');
        if (toneSelect) {
          const fallback = toneSelect.dataset && toneSelect.dataset.defaultValue !== undefined ? toneSelect.dataset.defaultValue : toneSelect.defaultValue;
          toneSelect.value = fallback !== undefined ? fallback : '';
        }
        WORD_CONTEXT_SECTION_CONFIG.forEach(function(section) {
          const toggle = section.toggleId ? document.getElementById(section.toggleId) : null;
          if (toggle) {
            toggle.checked = toggle.defaultChecked;
          }
          syncWordContextSection(section);
        });
        WORD_STRUCTURE_SECTION_CONFIG.forEach(function(section) {
          const toggle = section.toggleId ? document.getElementById(section.toggleId) : null;
          if (toggle) {
            toggle.checked = toggle.defaultChecked;
          }
          syncWordContextSection(section);
          if (section.webConfig) {
            const webToggleControl = document.getElementById(section.webConfig.toggleId);
            if (webToggleControl) {
              webToggleControl.checked = webToggleControl.defaultChecked;
            }
            setWordSectionLinksState(section.webConfig.stateKey, []);
            renderWordSectionLinksList(section);
          }
        });
        const webToggle = document.getElementById('wordWebSourcesToggle');
        if (webToggle) {
          webToggle.checked = webToggle.defaultChecked;
        }
        wordWebSourcesState = [];
        wordWebSourcesCollapsed = false;
        const savedToggle = document.getElementById('wordWebSavedToggle');
        if (savedToggle) {
          savedToggle.checked = savedToggle.defaultChecked;
        }
        wordWebSavedSelections = { tables: [], texts: [] };
        wordWebSavedLastError = '';
        renderWordWebSourcesList();
        renderWordWebSavedLists();
        updateWordWebSavedStatus('');
        refreshWordPreviews();
        syncWordWebSourcesCard();
        syncWordStructureCard();
        setWordFavoriteEditingId('');
      }

function setWordGenerateLoading(isLoading) {
        const btn = document.getElementById('wordGenerateBtn');
        if (!btn) {
          return;
        }
        if (isLoading) {
          if (!btn.dataset.wordGenerateIdleLabel) {
            btn.dataset.wordGenerateIdleLabel = btn.textContent || WORD_GENERATE_BUTTON_LABEL;
          }
          btn.disabled = true;
          btn.classList.add('is-loading');
          btn.textContent = 'Generando…';
          btn.setAttribute('aria-busy', 'true');
        } else {
          const idle = btn.dataset.wordGenerateIdleLabel || WORD_GENERATE_BUTTON_LABEL;
          btn.disabled = false;
          btn.classList.remove('is-loading');
          btn.textContent = idle;
          btn.removeAttribute('aria-busy');
        }
      }

async function handleWordGenerate() {
        if (wordGenerateInProgress) {
          return;
        }
        const btn = document.getElementById('wordGenerateBtn');
        if (!btn) {
          return;
        }
        const favoriteName = getWordFavoriteName();
        if (!favoriteName) {
          await showMessageModal('Agrega un título al texto antes de generar y guardar.', {
            title: 'Título requerido',
            variant: 'warning'
          });
          return;
        }
        const nameInput = document.getElementById('tableName');
        const descInput = document.getElementById('tableDesc');
        const rawTitle = nameInput ? nameInput.value.trim() : '';
        const isAutoTitle = Boolean(
          nameInput &&
            nameInput.dataset &&
            nameInput.dataset.autoFilled === 'true'
        );
        const effectiveTitle = isAutoTitle || rawTitle === WORD_TITLE_AUTO_PLACEHOLDER ? '' : rawTitle;
        const description = descInput ? descInput.value.trim() : '';
        const config = collectWordFavoriteConfig();
        if (config.range && config.range.useRange && (!config.range.value || !String(config.range.value).trim())) {
          await showMessageModal('Selecciona un rango válido antes de generar el texto.', {
            title: 'Rango requerido',
            variant: 'warning'
          });
          return;
        }
        const favoriteDescription = getWordFavoriteDescriptionFromConfig(config);
        wordGenerateInProgress = true;
        setWordGenerateLoading(true);
        try {
          const response = await callServerFunction('generateWordcrafterText', {
            favoriteId: wordFavoriteEditingId || '',
            name: favoriteName,
            title: effectiveTitle,
            description: description,
            favoriteDescription: favoriteDescription,
            config: config
          });
          if (!response || response.error) {
            throw new Error((response && response.error) || 'No se pudo generar el texto.');
          }
          const savedId = response.favoriteId
            ? String(response.favoriteId)
            : response.id
            ? String(response.id)
            : wordFavoriteEditingId || '';
          if (savedId) {
            setWordFavoriteEditingId(savedId);
          }
          try {
            await refreshWordFavorites({ selectId: savedId, silent: true });
          } catch (refreshErr) {}
          if (typeof notifySavedActionMutation === 'function') {
            notifySavedActionMutation({
              id: savedId,
              force: true,
              delay: 0,
              autoSelectFirst: false,
              forceLoad: true
            });
          } else if (typeof requestSavedActionsRefresh === 'function') {
            requestSavedActionsRefresh({
              selectId: savedId,
              force: true,
              delay: 0,
              autoSelectFirst: false,
              forceLoad: true
            });
          } else if (typeof refreshSavedActions === 'function') {
            refreshSavedActions({
              selectId: savedId,
              force: true,
              autoSelectFirst: false,
              forceLoad: true
            }).catch(function() {});
          }
          const rangeInfo = response && response.range ? response.range : {};
          const rangeLabel = rangeInfo.full || rangeInfo.display || '';
          let message = response && response.message ? String(response.message) : '';
          if (!message) {
            message = 'El texto se generó y pegó correctamente.';
            if (rangeLabel) {
              message += '\n\nUbicación: ' + rangeLabel;
            }
          }
          await showMessageModal(message, {
            title: 'Texto generado',
            variant: 'success',
            primaryText: 'Aceptar'
          });
        } catch (err) {
          const errorMessage = err && err.message ? err.message : err;
          await showMessageModal('No se pudo generar y guardar el texto: ' + errorMessage, {
            title: 'Error al generar',
            variant: 'error'
          });
        } finally {
          wordGenerateInProgress = false;
          setWordGenerateLoading(false);
        }
      }

function bindWordGenerateButton() {
        const btn = document.getElementById('wordGenerateBtn');
        if (btn && btn.dataset.wordGenerateBound !== 'true') {
          btn.addEventListener('click', function() {
            handleWordGenerate();
          });
          btn.dataset.wordGenerateBound = 'true';
        }
      }

function updateWordFormatFlagClasses(container) {
        if (!container) {
          return;
        }
        const flagLabels = container.querySelectorAll('.word-format-flag');
        flagLabels.forEach(function(label) {
          const control = label.querySelector('input');
          label.classList.toggle('is-active', Boolean(control && control.checked));
        });
      }

function updateWordPreview(kind) {
        const previewId = kind === 'body' ? 'wordBodyPreview' : 'wordTitlePreview';
        const preview = document.getElementById(previewId);
        if (!preview) {
          return;
        }
        const prefix = kind === 'body' ? 'wordBody' : 'wordTitle';
        const colorInput = document.getElementById(prefix + 'Color');
        const sizeInput = document.getElementById(prefix + 'FontSize');
        const alignSelect = document.getElementById(prefix + 'Alignment');
        const fontFamilySelect = document.getElementById(prefix + 'FontFamily');
        const boldToggle = document.getElementById(prefix + 'Bold');
        const underlineToggle = document.getElementById(prefix + 'Underline');
        const italicsToggle = document.getElementById(prefix + 'Italics');
        const uppercaseToggle = kind === 'title' ? document.getElementById('wordTitleUppercase') : null;
        const highlightToggle = kind === 'body' ? document.getElementById('wordBodyHighlight') : null;
        const lineSpacingSelect = kind === 'body' ? document.getElementById('wordBodyLineSpacing') : null;
        const formatContainer = document.getElementById(prefix + 'FormatOptions');

        preview.dataset.baseText = 'Ejemplo';
        const baseText = preview.dataset.baseText;
        let displayText = baseText;
        if (kind === 'title' && uppercaseToggle && uppercaseToggle.checked) {
          displayText = baseText.toUpperCase();
        }
        preview.textContent = displayText;

        if (colorInput) {
          preview.style.color = colorInput.value || '';
        }
        preview.style.fontSize = '';
        if (alignSelect) {
          preview.style.textAlign = alignSelect.value || '';
        }
        if (fontFamilySelect && fontFamilySelect.value) {
          preview.style.fontFamily = fontFamilySelect.value;
        }
        if (boldToggle) {
          preview.style.fontWeight = boldToggle.checked ? '700' : (kind === 'title' ? '600' : '500');
        }
        const decorations = [];
        if (underlineToggle && underlineToggle.checked) {
          decorations.push('underline');
        }
        if (italicsToggle) {
          preview.style.fontStyle = italicsToggle.checked ? 'italic' : 'normal';
        }
        if (uppercaseToggle) {
          preview.style.textTransform = uppercaseToggle.checked ? 'uppercase' : 'none';
        }
        preview.classList.toggle('word-preview-highlighted', Boolean(kind === 'body' && highlightToggle && highlightToggle.checked));
        if (lineSpacingSelect && lineSpacingSelect.value) {
          preview.style.lineHeight = lineSpacingSelect.value;
        }
        preview.style.textDecoration = decorations.join(' ');
        updateWordFormatFlagClasses(formatContainer);
      }

function refreshWordPreviews() {
        updateWordPreview('title');
        updateWordPreview('body');
      }

function syncWordTitleControls() {
        const isWordTheme = isWordThemeActiveForCreate();
        const container = document.getElementById('wordTitleOptions');
        const autoToggle = document.getElementById('wordAutoTitleToggle');
        const manualToggle = document.getElementById('wordManualTitleFormatToggle');
        const formatOptions = document.getElementById('wordTitleFormatOptions');
        const titleInput = document.getElementById('tableName');
        if (container) {
          container.style.display = isWordTheme ? 'block' : 'none';
        }
        if (!isWordTheme) {
          if (autoToggle) {
            autoToggle.checked = false;
          }
          if (manualToggle) {
            manualToggle.checked = false;
          }
        }
        const autoActive = Boolean(isWordTheme && autoToggle && autoToggle.checked);
        if (titleInput) {
          if (autoActive) {
            if (titleInput.dataset.autoFilled !== 'true') {
              titleInput.dataset.prevManualValue = titleInput.value;
              if (!titleInput.value) {
                titleInput.value = WORD_TITLE_AUTO_PLACEHOLDER;
              }
              titleInput.dataset.autoFilled = 'true';
            }
            titleInput.disabled = true;
            titleInput.setAttribute('aria-disabled', 'true');
          } else {
            if (titleInput.dataset && titleInput.dataset.autoFilled === 'true') {
              titleInput.value = titleInput.dataset.prevManualValue || '';
              delete titleInput.dataset.autoFilled;
              delete titleInput.dataset.prevManualValue;
            }
            titleInput.disabled = false;
            titleInput.removeAttribute('aria-disabled');
          }
        }
        if (manualToggle) {
          const shouldDisable = !isWordTheme;
          manualToggle.disabled = shouldDisable;
          if (shouldDisable) {
            manualToggle.setAttribute('aria-disabled', 'true');
          } else {
            manualToggle.removeAttribute('aria-disabled');
          }
        }
        const manualActive = Boolean(isWordTheme && manualToggle && manualToggle.checked);
        if (formatOptions) {
          formatOptions.style.display = manualActive ? 'block' : 'none';
        }
        updateWordPreview('title');
      }

function syncWordBodyControls() {
        const isWordTheme = isWordThemeActiveForCreate();
        const container = document.getElementById('wordBodyOptions');
        const manualToggle = document.getElementById('wordManualBodyFormatToggle');
        const formatOptions = document.getElementById('wordBodyFormatOptions');
        if (container) {
          container.style.display = isWordTheme ? 'block' : 'none';
        }
        if (!isWordTheme && manualToggle) {
          manualToggle.checked = false;
        }
        const manualActive = Boolean(isWordTheme && manualToggle && manualToggle.checked);
        if (manualToggle) {
          manualToggle.disabled = !isWordTheme;
          if (manualToggle.disabled) {
            manualToggle.setAttribute('aria-disabled', 'true');
          } else {
            manualToggle.removeAttribute('aria-disabled');
          }
        }
        if (formatOptions) {
          formatOptions.style.display = manualActive ? 'block' : 'none';
        }
        updateWordPreview('body');
      }

function syncWordContextCard() {
        const contextCard = document.getElementById('wordContextCard');
        const personalizationCard = document.getElementById('wordPersonalizationCard');
        const contextContent = document.getElementById('wordContextCardContent');
        const personalizationContent = document.getElementById('wordPersonalizationContent');
        const isWordTheme = isWordThemeActiveForCreate();
        if (contextCard) {
          contextCard.style.display = isWordTheme ? 'block' : 'none';
        }
        if (personalizationCard) {
          personalizationCard.style.display = isWordTheme ? 'block' : 'none';
        }
        if (!isWordTheme) {
          if (contextCard) {
            contextCard.classList.remove('is-collapsed');
          }
          if (contextContent) {
            contextContent.classList.remove('is-collapsed');
            contextContent.classList.remove('is-hidden');
          }
          setWordCollapseToggleDisabled('wordContextCardContent', true);
          syncWordCollapseTargetState('wordContextCardContent');
          if (personalizationCard) {
            personalizationCard.classList.remove('is-collapsed');
          }
          if (personalizationContent) {
            personalizationContent.classList.remove('is-collapsed');
            personalizationContent.classList.remove('is-hidden');
          }
          setWordCollapseToggleDisabled('wordPersonalizationContent', true);
          syncWordCollapseTargetState('wordPersonalizationContent');
          return;
        }
        setWordCollapseToggleDisabled('wordContextCardContent', false);
        syncWordCollapseTargetState('wordContextCardContent');
        setWordCollapseToggleDisabled('wordPersonalizationContent', false);
        syncWordCollapseTargetState('wordPersonalizationContent');
        syncWordContextSections();
      }

function syncWordContextSection(section) {
        if (!section) {
          return;
        }
        const toggle = document.getElementById(section.toggleId);
        const wrapper = document.getElementById(section.wrapperId);
        const fields = document.getElementById(section.fieldsId);
        const isActive = Boolean(!toggle || toggle.checked);
        if (wrapper) {
          wrapper.classList.toggle('is-disabled', !isActive);
        }
        if (fields) {
          fields.classList.toggle('is-hidden', !isActive);
          const collapseId = section.fieldsId || null;
          if (collapseId) {
            setWordCollapseToggleDisabled(collapseId, !isActive);
            syncWordCollapseTargetState(collapseId);
          } else {
            fields.setAttribute('aria-hidden', String(!isActive));
          }
        }
        if (Array.isArray(section.controlIds)) {
          section.controlIds.forEach(function(controlId) {
            const control = document.getElementById(controlId);
            if (!control) {
              return;
            }
            control.disabled = !isActive;
            if (!isActive) {
              control.setAttribute('aria-disabled', 'true');
            } else {
              control.removeAttribute('aria-disabled');
            }
          });
        }
      }

function syncWordContextSections() {

function getControlDefaultValue(control) {
        if (!control) {
          return '';
        }
        if (control.type === 'checkbox') {
          return !!control.defaultChecked;
        }
        if (control.dataset && control.dataset.defaultValue !== undefined) {
          return control.dataset.defaultValue;
        }
        if (control.defaultValue !== undefined) {
          return control.defaultValue;
        }
        return '';
      }

function setControlValue(control, value) {
        if (!control) {
          return;
        }
        if (control.type === 'checkbox') {
          if (value === undefined) {
            control.checked = !!getControlDefaultValue(control);
          } else {
            control.checked = !!value;
          }
          return;
        }
        const resolvedValue = value !== undefined && value !== null ? String(value) : String(getControlDefaultValue(control) || '');
        const tagName = control.tagName ? control.tagName.toLowerCase() : '';
        if (tagName === 'select') {
          let hasMatch = false;
          const options = Array.prototype.slice.call(control.options || []);
          options.forEach(function(option) {
            if (option && option.value === resolvedValue) {
              hasMatch = true;
            }
          });
          if (hasMatch) {
            control.value = resolvedValue;
          } else {
            control.value = String(getControlDefaultValue(control) || '');
          }
          return;
        }
        control.value = resolvedValue;
      }

          ? wordWebSavedCache.texts.filter(function(entry) {

          return wordFavoritesLoadingPromise.then(function(list) {

              TableCrafterEditTab.selectSavedText(opts.selectId);

            return list.slice();
          });
        }
        wordFavoritesLoadingPromise = callServerFunction('listWordFavorites')
          .then(function(result) {
            const favorites = normalizeWordFavoriteList(result);
            wordFavoritesCache = favorites;
            if (opts.updateEditTab !== false && typeof TableCrafterEditTab !== 'undefined') {
              if (typeof TableCrafterEditTab.renderSavedTexts === 'function') {
                TableCrafterEditTab.renderSavedTexts(favorites, {

                });
              }
              if (opts.selectId && typeof TableCrafterEditTab.selectSavedText === 'function') {
                TableCrafterEditTab.selectSavedText(opts.selectId);
              }
            }
            if (opts.updateSavedCache !== false) {
              mergeWordFavoritesIntoSavedCache(favorites);
            }
            if (opts.broadcast !== false) {
              document.dispatchEvent(
                new CustomEvent('tc:wordFavoritesUpdated', {
                  detail: { list: favorites.slice() }
                })
              );
            }
            return favorites.slice();
          })
          .catch(function(err) {
            if (!opts.silent) {
              showMessageModal('No se pudieron obtener los textos guardados: ' + (err && err.message ? err.message : err), {
                title: 'No se pudo cargar',
                variant: 'error'
              });

            throw err;
          })
          .finally(function() {
            wordFavoritesLoadingPromise = null;
          });
        return wordFavoritesLoadingPromise;
      }

async function handleWordFavoriteSave() {
        if (wordFavoriteSaving) {
          return;
        }
        const name = getWordFavoriteName();
        if (!name) {
          await showMessageModal('Agrega un título al texto antes de guardarlo como favorito.', {
            title: 'Título requerido',
            variant: 'warning'
          });
          return;
        }
        const config = collectWordFavoriteConfig();
        const payload = {
          id: wordFavoriteEditingId || '',
          name: name,
          description: getWordFavoriteDescriptionFromConfig(config),
          config: config
        };
        wordFavoriteSaving = true;
        updateWordFavoriteButtonState();
        try {
          const response = await callServerFunction('saveWordFavorite', payload);
          if (!response || response.error) {
            throw new Error((response && response.error) || 'No se pudo guardar el texto favorito.');
          }
          const savedId = response.id || wordFavoriteEditingId || '';
          setWordFavoriteEditingId(savedId);
          await refreshWordFavorites({ selectId: savedId });
          if (typeof notifySavedActionMutation === 'function') {
            notifySavedActionMutation({
              id: savedId,
              force: true,
              delay: 0,
              autoSelectFirst: false,
              forceLoad: true
            });
          } else if (typeof requestSavedActionsRefresh === 'function') {
            requestSavedActionsRefresh({
              selectId: savedId,
              force: true,
              delay: 0,
              autoSelectFirst: false,
              forceLoad: true
            });
          } else if (typeof refreshSavedActions === 'function') {
            refreshSavedActions({
              selectId: savedId,
              force: true,
              autoSelectFirst: false,
              forceLoad: true
            }).catch(function() {});
          }
          await showMessageModal((response && response.message) || 'Texto guardado en favoritos.', {
            title: 'Favorito guardado',
            variant: 'success'
          });
        } catch (err) {
          await showMessageModal('No se pudo guardar el texto favorito: ' + (err && err.message ? err.message : err), {
            title: 'No se pudo guardar',
            variant: 'error'
          });
        } finally {
          wordFavoriteSaving = false;
          updateWordFavoriteButtonState();
        }
      }

function loadWordWebSavedItems() {
        if (wordWebSavedLoadingPromise) {
          return wordWebSavedLoadingPromise;
        }
        wordWebSavedLastError = '';
        const loadErrors = [];
        const tablesPromise = (typeof ensureSavedTablesLoaded === 'function'
          ? ensureSavedTablesLoaded()
          : Promise.resolve(Array.isArray(savedTablesCache) ? savedTablesCache.slice() : []))
          .catch(function(err) {

            console.log('No se pudieron cargar las tablas guardadas para WordCrafter.', err);
            return [];
          });
        const actionsFallback = typeof getSavedActionsSnapshot === 'function' ? getSavedActionsSnapshot() : [];
        const actionsPromise = (typeof ensureSavedActionsCache === 'function'
          ? ensureSavedActionsCache()
          : Promise.resolve(Array.isArray(actionsFallback) ? actionsFallback.slice() : []))
          .catch(function(err) {
            const message = err && err.message ? err.message : err;
            loadErrors.push('textos IA (' + message + ')');
            console.log('No se pudieron cargar los textos guardados para WordCrafter.', err);
            return Array.isArray(actionsFallback) ? actionsFallback.slice() : [];
          });
        const favoritesPromise = refreshWordFavorites({
          updateEditTab: false,

          loadErrors.push('textos favoritos (' + message + ')');
          console.log('No se pudieron cargar los textos favoritos para WordCrafter.', err);
          return [];
        });
        wordWebSavedLoadingPromise = Promise.all([tablesPromise, actionsPromise, favoritesPromise])
          .then(function(results) {
            const tables = Array.isArray(results[0]) ? results[0] : [];
            const actions = Array.isArray(results[1]) ? results[1] : [];
            const favorites = normalizeWordFavoriteList(results[2]);
            const normalizedTables = tables
              .map(function(entry) {
                if (!entry || !entry.id) {
                  return null;
                }
                const id = String(entry.id);
                const name = entry.name ? String(entry.name) : id;
                let detail = '';
                if (entry.fullRangeA1) {
                  detail = String(entry.fullRangeA1);
                } else if (entry.sheetName && entry.rangeA1) {
                  detail = String(entry.sheetName) + '!' + String(entry.rangeA1);
                }
                return { id: id, name: name, details: detail };
              })
              .filter(function(item) {
                return !!item;
              });
            const normalizedTextsMap = Object.create(null);
            const normalizedTexts = [];
            actions.forEach(function(entry) {
              if (!entry || !entry.id) {
                return;
              }
              if (entry.type && entry.type !== 'reportFavorite') {
                return;
              }
              const id = String(entry.id);
              if (normalizedTextsMap[id]) {
                return;
              }
              const name = entry.name ? String(entry.name) : id;
              normalizedTexts.push({ id: id, name: name, source: 'reportFavorite' });
              normalizedTextsMap[id] = true;

            favorites.forEach(function(entry) {
              if (!entry || !entry.id) {

              const id = String(entry.id);

              const name = entry.name ? String(entry.name) : id;
              normalizedTexts.push({ id: id, name: name, source: 'wordFavorite' });
              normalizedTextsMap[id] = true;

            normalizedTexts.sort(function(a, b) {
              const nameA = a && a.name ? a.name.toLowerCase() : '';
              const nameB = b && b.name ? b.name.toLowerCase() : '';
              if (nameA < nameB) {
                return -1;
              }
              if (nameA > nameB) {
                return 1;
              }
              return 0;
            });
            wordWebSavedCache = {
              tables: normalizedTables,
              texts: normalizedTexts
            };
            wordWebSavedInitialized = true;
            pruneWordWebSavedSelections();
            renderWordWebSavedLists();
            if (loadErrors.length > 0) {
              wordWebSavedLastError = 'No se pudieron cargar: ' + loadErrors.join('; ');
            } else {

            }
          })
          .finally(function() {
            wordWebSavedLoadingPromise = null;
          });

        const tablesList = document.getElementById('wordWebSavedTables');
        const textsList = document.getElementById('wordWebSavedTexts');

          body.classList.toggle('is-hidden', !shouldEnable);

          inputs.forEach(function(input) {

            .catch(function(err) {

        const tables = Array.isArray(wordWebSavedCache.tables) ? wordWebSavedCache.tables : [];
        const texts = Array.isArray(wordWebSavedCache.texts) ? wordWebSavedCache.texts : [];
        if (wordWebSavedLastError) {
          updateWordWebSavedStatus(wordWebSavedLastError);

          )
        );
      }

function setWordCollapseToggleDisabled(targetId, disabled) {
        const toggles = getWordCollapseToggles(targetId);
        toggles.forEach(function(toggle) {
          toggle.disabled = Boolean(disabled);
          if (disabled) {
            toggle.setAttribute('aria-disabled', 'true');
          } else {
            toggle.removeAttribute('aria-disabled');
          }
        });
      }

function syncWordCollapseTargetState(targetId) {
        if (!targetId) {
          return;
        }
        const target = document.getElementById(targetId);
        if (!target) {
          return;
        }
        const toggles = getWordCollapseToggles(targetId);
        const isHidden = target.classList.contains('is-hidden');
        const isCollapsed = target.classList.contains('is-collapsed');
        const expanded = !(isHidden || isCollapsed);
        target.setAttribute('aria-hidden', String(!expanded));
        toggles.forEach(function(toggle) {
          toggle.setAttribute('aria-expanded', String(expanded));
        });
      }

function bindWordCollapsibleSections() {
        const toggles = document.querySelectorAll('.word-section-toggle[data-word-collapse-target]');
        toggles.forEach(function(toggle) {
          if (toggle.dataset.wordCollapseBound === 'true') {
            return;
          }
          const targetId = toggle.getAttribute('data-word-collapse-target');
          const contentId = toggle.getAttribute('data-word-collapse-content');
          const collapseTargetId = contentId || targetId;
          const target = targetId ? document.getElementById(targetId) : null;
          if (target) {
            if (targetId === 'wordWebSourcesCard') {
              wordWebSourcesCollapsed = target.classList.contains('is-collapsed');
            }
          }
          syncWordCollapseTargetState(collapseTargetId);
          toggle.addEventListener('click', function() {
            if (!targetId) {
              return;
            }
            const collapseTarget = document.getElementById(targetId);
            if (!collapseTarget) {
              return;
            }
            const nextCollapsed = !collapseTarget.classList.contains('is-collapsed');
            collapseTarget.classList.toggle('is-collapsed', nextCollapsed);
            if (contentId) {
              const collapseContent = document.getElementById(contentId);
              if (collapseContent && collapseContent !== collapseTarget) {
                collapseContent.setAttribute('aria-hidden', String(nextCollapsed));
              }
            }
            syncWordCollapseTargetState(collapseTargetId);
            if (targetId === 'wordWebSourcesCard') {
              wordWebSourcesCollapsed = nextCollapsed;
              syncWordWebSourcesCard();
            }
          });
          toggle.dataset.wordCollapseBound = 'true';
        });
      }

function bindWordWebSourcesControls() {
        const toggle = document.getElementById('wordWebSourcesToggle');
        if (toggle && toggle.dataset.wordWebBound !== 'true') {
          toggle.addEventListener('change', function() {
            if (toggle.checked && wordWebSourcesState.length === 0) {
              wordWebSourcesState.push({ url: '', description: '', hasDescription: false });
              renderWordWebSourcesList();
            }
            syncWordWebSourcesCard();
          });
          toggle.dataset.wordWebBound = 'true';
        }
        const addBtn = document.getElementById('wordWebSourcesAdd');
        if (addBtn && addBtn.dataset.wordWebBound !== 'true') {
          addBtn.addEventListener('click', function() {
            if (wordWebSourcesState.length >= WORD_WEB_SOURCE_LIMIT) {
              return;
            }
            wordWebSourcesState.push({ url: '', description: '', hasDescription: false });
            renderWordWebSourcesList();
            syncWordWebSourcesCard();
            const list = document.getElementById('wordWebSourcesList');
            if (list) {
              const inputs = list.querySelectorAll('.word-web-input');
              const newest = inputs[inputs.length - 1];
              if (newest) {
                newest.focus();
              }
            }
          });
          addBtn.dataset.wordWebBound = 'true';
        }
        const list = document.getElementById('wordWebSourcesList');
        if (list && list.dataset.wordWebBound !== 'true') {
          list.addEventListener('input', function(event) {
            const target = event.target;
            if (!target || !target.dataset || target.dataset.wordWebIndex === undefined) {
              return;
            }
            const index = parseInt(target.dataset.wordWebIndex || '-1', 10);
            if (isNaN(index) || index < 0 || index >= wordWebSourcesState.length) {
              return;
            }
            const field = target.dataset.wordWebField || '';
            const entry = ensureWordWebSourceEntry(index);
            if (field === 'url') {
              entry.url = target.value.trim();
            } else if (field === 'description') {
              entry.description = target.value;
            }
          });
          list.addEventListener('change', function(event) {
            const target = event.target;
            if (!target || !target.dataset || target.dataset.wordWebField !== 'hasDescription') {
              return;
            }
            const index = parseInt(target.dataset.wordWebIndex || '-1', 10);
            if (isNaN(index) || index < 0 || index >= wordWebSourcesState.length) {
              return;
            }
            const entry = ensureWordWebSourceEntry(index);
            entry.hasDescription = target.checked;
            const row = typeof target.closest === 'function' ? target.closest('.word-web-row') : null;
            if (row) {
              const wrapper = row.querySelector('.word-web-description-wrapper');
              if (wrapper) {
                wrapper.classList.toggle('is-hidden', !target.checked);
                wrapper.setAttribute('aria-hidden', String(!target.checked));
              }
              const descInput = row.querySelector('.word-web-description-input');
              if (descInput) {
                descInput.disabled = !target.checked;
                if (target.checked) {
                  descInput.focus();
                }
              }
            }
          });
          list.addEventListener('click', function(event) {
            const button = event.target && event.target.closest('[data-word-web-remove]');
            if (!button) {
              return;
            }
            const index = parseInt(button.dataset.wordWebRemove || '-1', 10);
            if (isNaN(index) || index < 0 || index >= wordWebSourcesState.length) {
              return;
            }
            wordWebSourcesState.splice(index, 1);
            renderWordWebSourcesList();
            syncWordWebSourcesCard();
          });
          list.dataset.wordWebBound = 'true';
        }
        const savedToggle = document.getElementById('wordWebSavedToggle');
        if (savedToggle && savedToggle.dataset.wordWebBound !== 'true') {
          savedToggle.addEventListener('change', function() {
            syncWordWebSavedSection();
          });
          savedToggle.dataset.wordWebBound = 'true';
        }
        const savedLists = [document.getElementById('wordWebSavedTables'), document.getElementById('wordWebSavedTexts')];
        savedLists.forEach(function(savedList) {
          if (savedList && savedList.dataset.wordWebBound !== 'true') {
            savedList.addEventListener('change', function(event) {
              const input = event.target;
              if (!input || input.type !== 'checkbox') {
                return;
              }
              const type = input.dataset.wordWebSavedType;
              const id = input.value ? String(input.value) : '';
              if (!type || !id) {
                return;
              }
              if (!Array.isArray(wordWebSavedSelections[type])) {
                wordWebSavedSelections[type] = [];
              }
              const selection = wordWebSavedSelections[type];
              if (input.checked) {
                if (!selection.includes(id)) {
                  selection.push(id);
                }
              } else {
                wordWebSavedSelections[type] = selection.filter(function(entry) {
                  return entry !== id;
                });
              }
              const item = typeof input.closest === 'function' ? input.closest('.word-web-saved-item') : null;
              if (item) {
                item.classList.toggle('is-selected', input.checked);
              }
            });
            savedList.dataset.wordWebBound = 'true';
          }
        });
      }

function syncWordWebSourcesCard() {
        const card = document.getElementById('wordWebSourcesCard');
        if (!card) {
          return;
        }
        const isWordTheme = isWordThemeActiveForCreate();
        const content = document.getElementById('wordWebSourcesContent');
        const collapseBtn = document.getElementById('wordWebSourcesCollapse');
        const body = document.getElementById('wordWebSourcesBody');
        card.style.display = isWordTheme ? 'block' : 'none';
        if (!isWordTheme) {
          wordWebSourcesCollapsed = false;
          card.classList.remove('is-collapsed');
          if (collapseBtn) {
            collapseBtn.setAttribute('aria-expanded', 'true');
          }
          if (content) {
            content.setAttribute('aria-hidden', 'false');
          }
          if (body) {
            body.classList.remove('is-collapsed');
            body.classList.add('is-hidden');
            body.setAttribute('aria-hidden', 'true');
          }
          setWordCollapseToggleDisabled('wordWebSourcesBody', true);
          syncWordCollapseTargetState('wordWebSourcesBody');
          return;
        }
        const toggle = document.getElementById('wordWebSourcesToggle');
        const list = document.getElementById('wordWebSourcesList');
        const addBtn = document.getElementById('wordWebSourcesAdd');
        const isActive = Boolean(toggle && toggle.checked);
        if (isActive && wordWebSourcesState.length === 0) {
          wordWebSourcesState.push({ url: '', description: '', hasDescription: false });
          renderWordWebSourcesList();
        }
        card.classList.toggle('is-collapsed', wordWebSourcesCollapsed);
        wordWebSourcesCollapsed = card.classList.contains('is-collapsed');
        if (collapseBtn) {
          collapseBtn.setAttribute('aria-expanded', String(!wordWebSourcesCollapsed));
        }
        if (content) {
          content.setAttribute('aria-hidden', String(wordWebSourcesCollapsed));
        }
        const bodyCollapsed = Boolean(body && body.classList.contains('is-collapsed'));
        const shouldShowBody = Boolean(isActive && !wordWebSourcesCollapsed && !bodyCollapsed);
        if (body) {
          body.classList.toggle('is-hidden', !shouldShowBody);
          body.setAttribute('aria-hidden', String(!shouldShowBody));
        }
        setWordCollapseToggleDisabled('wordWebSourcesBody', !isActive || wordWebSourcesCollapsed);
        syncWordCollapseTargetState('wordWebSourcesBody');
        if (list) {
          const inputs = list.querySelectorAll('.word-web-input');
          inputs.forEach(function(input) {
            input.disabled = !isActive;
            if (!isActive) {
              input.setAttribute('aria-disabled', 'true');
            } else {
              input.removeAttribute('aria-disabled');
            }
          });
          const descriptionToggles = list.querySelectorAll('.word-web-description-toggle-input');
          descriptionToggles.forEach(function(toggle) {
            toggle.disabled = !isActive;
            if (!isActive) {
              toggle.setAttribute('aria-disabled', 'true');
            } else {
              toggle.removeAttribute('aria-disabled');
            }
          });
          const descriptionInputs = list.querySelectorAll('.word-web-description-input');
          descriptionInputs.forEach(function(descInput) {
            const row = typeof descInput.closest === 'function' ? descInput.closest('.word-web-row') : null;
            const toggle = row ? row.querySelector('.word-web-description-toggle-input') : null;
            const enabled = Boolean(isActive && toggle && toggle.checked);
            descInput.disabled = !enabled;
            if (!enabled) {
              descInput.setAttribute('aria-disabled', 'true');
            } else {
              descInput.removeAttribute('aria-disabled');
            }
          });
          const removeButtons = list.querySelectorAll('.word-web-remove');
          removeButtons.forEach(function(button) {
            button.disabled = !isActive;
            if (!isActive) {
              button.setAttribute('aria-disabled', 'true');
            } else {
              button.removeAttribute('aria-disabled');
            }
          });
        }
        if (addBtn) {
          addBtn.disabled = !isActive || wordWebSourcesState.length >= WORD_WEB_SOURCE_LIMIT;
        }
        syncWordWebSavedSection();
      }

function syncWordCreateOptions() {
        syncWordTitleControls();
        syncWordBodyControls();
        syncWordStructureCard();
        syncWordContextCard();
        syncWordWebSourcesCard();
      }

function bindWordTextToggles() {
        const autoToggle = document.getElementById('wordAutoTitleToggle');
        if (autoToggle && autoToggle.dataset.toggleBound !== 'true') {
          autoToggle.addEventListener('change', function() {
            syncWordTitleControls();
            updateWordPreview('title');
          });
          autoToggle.dataset.toggleBound = 'true';
        }
        const manualTitleToggle = document.getElementById('wordManualTitleFormatToggle');
        if (manualTitleToggle && manualTitleToggle.dataset.toggleBound !== 'true') {
          manualTitleToggle.addEventListener('change', function() {
            syncWordTitleControls();
            updateWordPreview('title');
          });
          manualTitleToggle.dataset.toggleBound = 'true';
        }
        const manualBodyToggle = document.getElementById('wordManualBodyFormatToggle');
        if (manualBodyToggle && manualBodyToggle.dataset.toggleBound !== 'true') {
          manualBodyToggle.addEventListener('change', function() {
            syncWordBodyControls();
            updateWordPreview('body');
          });
          manualBodyToggle.dataset.toggleBound = 'true';
        }
        const splitToggle = document.getElementById('wordSplitSentencesToggle');
        if (splitToggle && splitToggle.dataset.toggleBound !== 'true') {
          splitToggle.addEventListener('change', function() {
            if (splitToggle.disabled) {
              return;
            }
            saveWordSplitSentencesPreference(!!splitToggle.checked);
          });
          splitToggle.dataset.toggleBound = 'true';
        }
        bindWordContextToggles();
      }

function bindWordFormatInputs() {
        function attach(control, kind) {
          if (!control || control.dataset.wordFormatBound === 'true') {
            return;
          }
          const handler = function() {
            updateWordPreview(kind);
          };
          const tag = control.tagName ? control.tagName.toLowerCase() : '';
          const type = control.type ? control.type.toLowerCase() : '';
          const primaryEvent = type === 'color' || type === 'number' ? 'input' : (tag === 'select' ? 'change' : 'change');
          control.addEventListener(primaryEvent, handler);
          if (primaryEvent !== 'change') {
            control.addEventListener('change', handler);
          }
          control.dataset.wordFormatBound = 'true';
        }
        const titleContainer = document.getElementById('wordTitleFormatOptions');
        if (titleContainer) {
          const titleControls = titleContainer.querySelectorAll('input, select');
          titleControls.forEach(function(control) {
            attach(control, 'title');
          });
        }
        const bodyContainer = document.getElementById('wordBodyFormatOptions');
        if (bodyContainer) {
          const bodyControls = bodyContainer.querySelectorAll('input, select');
          bodyControls.forEach(function(control) {
            attach(control, 'body');
          });
        }
      }

function bindWordRangeToggle() {
        const rangeToggle = document.getElementById('wordUseRangeToggle');
        if (rangeToggle && rangeToggle.dataset.toggleBound !== 'true') {
          rangeToggle.addEventListener('change', function() {
            syncCreateRangeModeUI();
            syncWordCreateOptions();
          });
          rangeToggle.dataset.toggleBound = 'true';
        }
      }

function initializeWordRangeMode() {
        bindWordRangeToggle();
        bindWordTextToggles();
        bindWordFormatInputs();
        bindWordStructureControls();
        bindWordWebSourcesControls();
        bindWordFavoriteButton();
        bindWordGenerateButton();
        bindWordCollapsibleSections();
        renderWordWebSourcesList();
        ensureWordStructurePlacement();
        renderWordStructureLinksList();
        applyWordSplitSentencesPreferenceToToggle();
        syncCreateRangeModeUI();
        syncWordCreateOptions();
        refreshWordPreviews();
        refreshWordFavorites({ silent: true }).catch(function() {});
      }

if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initializeWordRangeMode);
      } else {
        initializeWordRangeMode();
      }

function notifyCreateThemeChanged(nextTheme) {
        bindWordRangeToggle();
        bindWordTextToggles();
        bindWordFormatInputs();
        bindWordStructureControls();
        bindWordWebSourcesControls();
        bindWordFavoriteButton();
        bindWordGenerateButton();
        renderWordWebSourcesList();
        ensureWordStructurePlacement();
        renderWordStructureLinksList();
        applyWordSplitSentencesPreferenceToToggle();
        syncCreateRangeModeUI();
        syncWordCreateOptions();
        refreshWordPreviews();
        if (typeof notifyTableFavoriteThemeChanged === 'function') {
          try {
            notifyTableFavoriteThemeChanged(nextTheme);
          } catch (err) {
            console.log('No se pudo sincronizar los favoritos de tabla.', err);
          }
        }
      }

window.notifyCreateThemeChanged = notifyCreateThemeChanged;

const WordCrafterCreateTab = Object.freeze({
        isThemeActive: isWordThemeActiveForCreate,
        isRangeSelectionEnabled: isWordRangeSelectionEnabled,
        resetTextOptions: resetWordTextOptions,
        syncOptions: syncWordCreateOptions,
        refreshPreviews: refreshWordPreviews,
        bindRangeToggle: bindWordRangeToggle,
        bindTextToggles: bindWordTextToggles,
        bindFormatInputs: bindWordFormatInputs,
        bindContextToggles: bindWordContextToggles,
        bindStructureControls: bindWordStructureControls,
        bindWebSources: bindWordWebSourcesControls,
        notifyThemeChanged: notifyCreateThemeChanged
      });

window.WordCrafterCreateTab = WordCrafterCreateTab;
const WordFavoriteManager = Object.freeze({
        save: handleWordFavoriteSave,
        refreshSavedLists: refreshWordFavorites,
        openFavorite: openWordFavoriteForEditing,
        getEditingId: function() {
          return wordFavoriteEditingId;
        }
      });
window.WordFavoriteManager = WordFavoriteManager;
</script>
