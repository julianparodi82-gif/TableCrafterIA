<script>
/* -------------------------------------------------------------------------- */
/*  TableCrafter Edit Tab State                                               */
/* -------------------------------------------------------------------------- */
let editHeaders = [];
let editRangeInfo = null;
let editingId = '';
let editFormatDirty = false;
let editSavedListCollapsed = false;
let editSavedTextsCollapsed = false;
let editFavoriteSaving = false;
let editWordFavoritesCache = [];
let editWordFavoritesLoadingPromise = null;
let editFavoriteName = '';

function getCurrentEditSavedTextSelection() {
        const select = document.getElementById('editSavedTexts');
        if (!select || select.disabled) {
          return '';
        }
        return select.value ? String(select.value) : '';
      }

function normalizeEditWordFavoriteList(entries) {
        if (typeof normalizeWordFavoriteList === 'function') {
          return normalizeWordFavoriteList(entries);
        }
        if (!Array.isArray(entries)) {
          return [];
        }
        return entries
          .map(function(entry) {
            if (!entry || !entry.id) {
              return null;
            }
            let metadata = {};
            if (entry.metadata && typeof entry.metadata === 'object') {
              try {
                metadata = JSON.parse(JSON.stringify(entry.metadata));
              } catch (err) {
                metadata = Object.assign({}, entry.metadata);
              }
            }
            return {
              id: String(entry.id),
              name: entry.name ? String(entry.name) : String(entry.id),
              description: entry.description ? String(entry.description) : '',
              createdAt: entry.createdAt || '',
              updatedAt: entry.updatedAt || '',
              metadata: metadata
            };
          })
          .filter(function(item) {
            return !!item;
          });
      }

function setEditSavedTexts(entries, options) {
        const opts = options || {};
        editWordFavoritesCache = normalizeEditWordFavoriteList(entries);
        let selectedValue = '';
        if (Object.prototype.hasOwnProperty.call(opts, 'selectedValue')) {
          selectedValue = opts.selectedValue ? String(opts.selectedValue) : '';
        } else if (Object.prototype.hasOwnProperty.call(opts, 'selectId')) {
          selectedValue = opts.selectId ? String(opts.selectId) : '';
        } else {
          selectedValue = getCurrentEditSavedTextSelection();
        }
        renderEditSavedTextsList(editWordFavoritesCache, {
          disabled: !!opts.disabled,
          selectedValue: selectedValue
        });
        return editWordFavoritesCache;
      }

function refreshEditSavedTextsData(options) {
        const opts = options || {};
        if (editWordFavoritesLoadingPromise) {
          return editWordFavoritesLoadingPromise;
        }
        let selectedValue = '';
        if (Object.prototype.hasOwnProperty.call(opts, 'selectedValue')) {
          selectedValue = opts.selectedValue ? String(opts.selectedValue) : '';
        } else if (Object.prototype.hasOwnProperty.call(opts, 'selectId')) {
          selectedValue = opts.selectId ? String(opts.selectId) : '';
        } else {
          selectedValue = getCurrentEditSavedTextSelection();
        }
        const disabled = !!opts.disabled;
        editWordFavoritesLoadingPromise = callServerFunction('listWordFavorites')
          .then(function(result) {
            const list = setEditSavedTexts(result, {
              selectedValue: selectedValue,
              disabled: disabled
            });
            return list.slice();
          })
          .catch(function(err) {
            if (!opts.silent) {
              showMessageModal('No se pudieron obtener los textos guardados: ' + (err && err.message ? err.message : err), {
                title: 'No se pudo cargar',
                variant: 'error'
              });
            }
            if (!editWordFavoritesCache || editWordFavoritesCache.length === 0) {
              renderEditSavedTextsList([], { disabled: disabled });
            } else {
              renderEditSavedTextsList(editWordFavoritesCache, {
                disabled: disabled,
                selectedValue: selectedValue
              });
            }
            throw err;
          })
          .finally(function() {
            editWordFavoritesLoadingPromise = null;
          });
        return editWordFavoritesLoadingPromise;
      }

/* -------------------------------------------------------------------------- */
/*  TableCrafter Edit Tab Saved Tables UI                                     */
/* -------------------------------------------------------------------------- */




      

function syncEditSavedListCollapseClass() {
        const listEl = document.getElementById('editSavedTablesList');
        const selectEl = document.getElementById('editSavedTables');
        if (!listEl) {
          return;
        }
        const hasSelection = !!(
          selectEl &&
          !selectEl.disabled &&
          selectEl.value &&
          String(selectEl.value).trim()
        );
        const shouldCollapse =
          hasSelection && editSavedListCollapsed && !listEl.classList.contains('disabled');
        if (shouldCollapse) {
          listEl.classList.add('collapsed');
          listEl.setAttribute('aria-expanded', 'false');
          listEl.dataset.collapsed = 'true';
        } else {
          listEl.classList.remove('collapsed');
          listEl.setAttribute('aria-expanded', 'true');
          listEl.dataset.collapsed = 'false';
        }
      }

function setEditSavedListCollapsed(collapsed) {
        editSavedListCollapsed = !!collapsed;
        syncEditSavedListCollapseClass();
      }

function syncEditSavedTextsCollapseClass() {
        const listEl = document.getElementById('editSavedTextsList');
        const selectEl = document.getElementById('editSavedTexts');
        if (!listEl) {
          return;
        }
        const hasSelection = !!(
          selectEl &&
          !selectEl.disabled &&
          selectEl.value &&
          String(selectEl.value).trim()
        );
        const shouldCollapse =
          hasSelection && editSavedTextsCollapsed && !listEl.classList.contains('disabled');
        if (shouldCollapse) {
          listEl.classList.add('collapsed');
          listEl.setAttribute('aria-expanded', 'false');
          listEl.dataset.collapsed = 'true';
        } else {
          listEl.classList.remove('collapsed');
          listEl.setAttribute('aria-expanded', 'true');
          listEl.dataset.collapsed = 'false';
        }
      }

function setEditSavedTextsCollapsed(collapsed) {
        editSavedTextsCollapsed = !!collapsed;
        syncEditSavedTextsCollapseClass();
      }

/* -------------------------------------------------------------------------- */
/*  TableCrafter Edit Tab Formula Preference                                  */
/* -------------------------------------------------------------------------- */

function updateCachedFormulaPreference(tableId, value, options) {
        if (!tableId) {
          return;
        }
        const normalizedId = String(tableId).trim();
        if (!normalizedId) {
          return;
        }
        const normalizedValue = !!value;
        let updated = false;
        if (Array.isArray(savedTablesCache)) {
          for (let i = 0; i < savedTablesCache.length; i++) {
            const entry = savedTablesCache[i];
            if (entry && entry.id === normalizedId) {
              entry.updateFormulaReferences = normalizedValue;
              updated = true;
              break;
            }
          }
        }
        const persist = !options || options.persist !== false;
        if (updated && persist) {
          persistSavedTablesCache();
        }
      }

function applyEditFormulaPreference(value, options) {
        const normalized = normalizeFormulaPreference(value);
        const toggle = document.getElementById('editUpdateFormulaRefs');
        if (toggle) {
          toggle.checked = normalized;
        }
        if (!editRangeInfo) {
          editRangeInfo = {};
        }
        editRangeInfo.updateFormulaReferences = normalized;
        if (editingId) {
          updateCachedFormulaPreference(editingId, normalized, options);
        }
        return normalized;
      }

function getEditFormulaPreference() {
        const toggle = document.getElementById('editUpdateFormulaRefs');
        if (toggle) {
          return !!toggle.checked;
        }
        if (editRangeInfo && typeof editRangeInfo.updateFormulaReferences === 'boolean') {
          return editRangeInfo.updateFormulaReferences;
        }
        return true;
      }

function createEditSavedItem(entry, selected, disabled) {
        const item = document.createElement('div');
        item.className = 'edit-saved-item';
        if (selected) {
          item.classList.add('selected');
        }
        if (disabled) {
          item.classList.add('disabled');
          item.tabIndex = -1;
          item.setAttribute('aria-disabled', 'true');
        } else {
          item.tabIndex = 0;
          item.setAttribute('aria-disabled', 'false');
        }
        item.dataset.value = entry.id;
        item.setAttribute('role', 'option');
        item.setAttribute('aria-selected', selected ? 'true' : 'false');
        styleEditListItem(item, entry);

        const label = document.createElement('span');
        label.className = 'edit-saved-label';
        const baseLabel = entry.name || entry.id;
        const metadataLabel = typeof formatFavoriteMetadataLabel === 'function'
          ? formatFavoriteMetadataLabel(entry && entry.metadata)
          : '';
        label.textContent = metadataLabel ? baseLabel + ' • ' + metadataLabel : baseLabel;
        item.appendChild(label);

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'edit-saved-locate';
        btn.dataset.value = entry.id;
        btn.title = 'Ir a la tabla';
        if (disabled) {
          btn.disabled = true;
          btn.tabIndex = -1;
        }
        const icon = document.createElement('span');
        icon.setAttribute('aria-hidden', 'true');
        icon.textContent = '📍';
        btn.appendChild(icon);
        const sr = document.createElement('span');
        sr.className = 'visually-hidden';
        sr.textContent = 'Ir a la tabla';
        btn.appendChild(sr);
        item.appendChild(btn);
        return item;
      }

function createEditSavedTextItem(entry, selected, disabled) {
        const item = document.createElement('div');
        item.className = 'edit-saved-item';
        if (selected) {
          item.classList.add('selected');
        }
        if (disabled) {
          item.classList.add('disabled');
          item.tabIndex = -1;
          item.setAttribute('aria-disabled', 'true');
        } else {
          item.tabIndex = 0;
          item.setAttribute('aria-disabled', 'false');
        }
        const entryId = entry && entry.id ? String(entry.id) : '';
        item.dataset.value = entryId;
        item.setAttribute('role', 'option');
        item.setAttribute('aria-selected', selected ? 'true' : 'false');
        styleEditListItem(item, entry);

        const label = document.createElement('span');
        label.className = 'edit-saved-label';
        const baseLabel = entry && entry.name ? entry.name : entryId || 'Texto sin título';
        const metadataLabel = typeof formatFavoriteMetadataLabel === 'function'
          ? formatFavoriteMetadataLabel(entry && entry.metadata)
          : '';
        label.textContent = metadataLabel ? baseLabel + ' • ' + metadataLabel : baseLabel;
        item.appendChild(label);

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'edit-saved-locate';
        btn.dataset.value = entryId;
        btn.title = 'Abrir texto en WordCrafter';
        btn.disabled = !!disabled;
        btn.tabIndex = disabled ? -1 : 0;
        const icon = document.createElement('span');
        icon.setAttribute('aria-hidden', 'true');
        icon.textContent = '📄';
        btn.appendChild(icon);
        const sr = document.createElement('span');
        sr.className = 'visually-hidden';
        sr.textContent = 'Abrir texto en WordCrafter';
        btn.appendChild(sr);
        item.appendChild(btn);
        return item;
      }

function renderEditSavedTablesList(entries, config) {
        const listEl = document.getElementById('editSavedTablesList');
        const selectEl = document.getElementById('editSavedTables');
        if (!listEl || !selectEl) {
          return;
        }
        const data = Array.isArray(entries) ? entries : [];
        const options = config || {};
        const disabled = !!options.disabled;
        const groupBySheet = !!options.groupBySheet;
        const selectedValue = options.selectedValue ? String(options.selectedValue) : '';
        const hasEntries = data.length > 0;
        const listDisabled = disabled || !hasEntries;
        listEl.innerHTML = '';
        listEl.setAttribute('role', 'listbox');
        listEl.setAttribute('aria-multiselectable', 'false');
        listEl.classList.toggle('disabled', listDisabled);
        listEl.setAttribute('aria-disabled', listDisabled ? 'true' : 'false');

        if (listDisabled) {
          setEditSavedListCollapsed(false);
          const empty = document.createElement('div');
          empty.className = 'edit-saved-empty';
          empty.textContent = 'No hay tablas guardadas';
          listEl.appendChild(empty);
          if (!hasEntries) {
            selectEl.innerHTML = '';
          }
          selectEl.disabled = true;
          syncEditSavedListCollapseClass();
          return;
        }

        selectEl.disabled = false;

        if (groupBySheet) {
          const grouped = Object.create(null);
          const order = [];
          data.forEach(function(entry) {
            if (!entry || !entry.id) {
              return;
            }
            const sheetLabel = entry.sheetName ? entry.sheetName : 'Sin hoja';
            if (!grouped[sheetLabel]) {
              grouped[sheetLabel] = [];
              order.push(sheetLabel);
            }
            grouped[sheetLabel].push(entry);
          });
          order.forEach(function(sheetLabel) {
            const groupWrapper = document.createElement('div');
            groupWrapper.className = 'edit-saved-group';
            const labelEl = document.createElement('div');
            labelEl.className = 'edit-saved-group-label';
            labelEl.textContent = sheetLabel;
            groupWrapper.appendChild(labelEl);
            grouped[sheetLabel].forEach(function(entry) {
              const isSelected = entry.id === selectedValue;
              const item = createEditSavedItem(entry, isSelected, disabled);
              groupWrapper.appendChild(item);
            });
            listEl.appendChild(groupWrapper);
          });
        } else {
          data.forEach(function(entry) {
            if (!entry || !entry.id) {
              return;
            }
            const isSelected = entry.id === selectedValue;
            const item = createEditSavedItem(entry, isSelected, disabled);
            listEl.appendChild(item);
          });
        }
        syncEditSavedListCollapseClass();
      }

function renderEditSavedTextsList(entries, config) {
        const listEl = document.getElementById('editSavedTextsList');
        const selectEl = document.getElementById('editSavedTexts');
        if (!listEl || !selectEl) {
          return;
        }
        const data = Array.isArray(entries) ? entries : [];
        const options = config || {};
        const disabled = !!options.disabled;
        const selectedValue = options.selectedValue ? String(options.selectedValue) : '';
        const hasEntries = data.length > 0;
        const listDisabled = disabled || !hasEntries;
        listEl.innerHTML = '';
        listEl.setAttribute('role', 'listbox');
        listEl.setAttribute('aria-multiselectable', 'false');
        listEl.classList.toggle('disabled', listDisabled);
        listEl.setAttribute('aria-disabled', listDisabled ? 'true' : 'false');

        if (listDisabled) {
          setEditSavedTextsCollapsed(false);
          const empty = document.createElement('div');
          empty.className = 'edit-saved-empty';
          empty.textContent = 'No hay textos guardados';
          listEl.appendChild(empty);
          if (!hasEntries) {
            selectEl.innerHTML = '';
          }
          selectEl.disabled = true;
          syncEditSavedTextsCollapseClass();
          return;
        }

        selectEl.disabled = false;
        selectEl.innerHTML = '';
        data.forEach(function(entry) {
          if (!entry || !entry.id) {
            return;
          }
          const option = document.createElement('option');
          option.value = String(entry.id);
          const baseLabel = entry.name || entry.id;
          const metadataLabel = typeof formatFavoriteMetadataLabel === 'function'
            ? formatFavoriteMetadataLabel(entry.metadata)
            : '';
          option.textContent = metadataLabel ? baseLabel + ' • ' + metadataLabel : baseLabel;
          selectEl.appendChild(option);
        });
        if (selectedValue) {
          selectEl.value = selectedValue;
        }

        data.forEach(function(entry) {
          if (!entry || !entry.id) {
            return;
          }
          const isSelected = entry.id === selectedValue;
          const item = createEditSavedTextItem(entry, isSelected, disabled);
          listEl.appendChild(item);
        });

        syncEditSavedTextsHighlight();
      }

function syncEditSavedTablesHighlight() {
        const listEl = document.getElementById('editSavedTablesList');
        const selectEl = document.getElementById('editSavedTables');
        if (!listEl || !selectEl) {
          return;
        }
        const selectedValue = !selectEl.disabled && selectEl.value ? String(selectEl.value) : '';
        listEl.querySelectorAll('.edit-saved-item').forEach(function(item) {
          const value = item && item.dataset ? item.dataset.value : '';
          if (!value) {
            item.classList.remove('selected');
            item.setAttribute('aria-selected', 'false');
            return;
          }
          if (selectedValue && value === selectedValue) {
            item.classList.add('selected');
            item.setAttribute('aria-selected', 'true');
          } else {
            item.classList.remove('selected');
            item.setAttribute('aria-selected', 'false');
          }
        });
        syncEditSavedListCollapseClass();
      }

function syncEditSavedTextsHighlight() {
        const listEl = document.getElementById('editSavedTextsList');
        const selectEl = document.getElementById('editSavedTexts');
        if (!listEl || !selectEl) {
          return;
        }
        const selectedValue = !selectEl.disabled && selectEl.value ? String(selectEl.value) : '';
        listEl.querySelectorAll('.edit-saved-item').forEach(function(item) {
          const value = item && item.dataset ? item.dataset.value : '';
          if (!value) {
            item.classList.remove('selected');
            item.setAttribute('aria-selected', 'false');
            return;
          }
          if (selectedValue && value === selectedValue) {
            item.classList.add('selected');
            item.setAttribute('aria-selected', 'true');
          } else {
            item.classList.remove('selected');
            item.setAttribute('aria-selected', 'false');
          }
        });
        syncEditSavedTextsCollapseClass();
      }

function initializeSavedTextsUi() {
        const select = document.getElementById('editSavedTexts');
        if (select && select.dataset.wordTextBound !== 'true') {
          select.addEventListener('change', function() {
            syncEditSavedTextsHighlight();
            const value = select.value ? String(select.value).trim() : '';
            if (value) {
              openSavedTextForEditing(value);
            }
          });
          select.dataset.wordTextBound = 'true';
        }
        const list = document.getElementById('editSavedTextsList');
        if (list && list.dataset.wordTextBound !== 'true') {
          list.addEventListener('click', function(event) {
            const target = event.target;
            if (!target) {
              return;
            }
            const button = typeof target.closest === 'function' ? target.closest('.edit-saved-locate') : null;
            if (button && !button.disabled) {
              const value = button.dataset.value ? String(button.dataset.value).trim() : '';
              if (value) {
                openSavedTextForEditing(value);
              }
              return;
            }
            const item = typeof target.closest === 'function' ? target.closest('.edit-saved-item') : null;
            if (!item || item.classList.contains('disabled')) {
              return;
            }
            const value = item.dataset.value ? String(item.dataset.value).trim() : '';
            if (!value) {
              return;
            }
            selectEditSavedText(value);
            openSavedTextForEditing(value);
          });
          list.addEventListener('keydown', function(event) {
            if (event.defaultPrevented) {
              return;
            }
            if (event.key !== 'Enter' && event.key !== ' ') {
              return;
            }
            const item = typeof event.target.closest === 'function' ? event.target.closest('.edit-saved-item') : null;
            if (!item || item.classList.contains('disabled')) {
              return;
            }
            const value = item.dataset.value ? String(item.dataset.value).trim() : '';
            if (!value) {
              return;
            }
            event.preventDefault();
            selectEditSavedText(value);
            openSavedTextForEditing(value);
          });
          list.dataset.wordTextBound = 'true';
        }
        if (!initializeSavedTextsUi._initialized) {
          renderEditSavedTextsList([], {});
          initializeSavedTextsUi._initialized = true;
        }
        refreshEditSavedTextsData({ silent: true }).catch(function() {});
      }

if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initializeSavedTextsUi);
      } else {
        initializeSavedTextsUi();
      }

document.addEventListener('tc:wordFavoritesUpdated', function(event) {
        const detail = event && event.detail ? event.detail : {};
        if (detail && Array.isArray(detail.list)) {
          const currentSelection = getCurrentEditSavedTextSelection();
          setEditSavedTexts(detail.list, { selectedValue: currentSelection });
          return;
        }
        refreshEditSavedTextsData({ silent: true }).catch(function() {});
      });

document.addEventListener('tc:themeModeChanged', function() {
        if (typeof currentTheme === 'string' && currentTheme === 'word') {
          refreshEditSavedTextsData({ silent: true }).catch(function() {});
        }
      });




      

/* -------------------------------------------------------------------------- */
/*  TableCrafter Edit Tab Formatting State                                   */
/* -------------------------------------------------------------------------- */

function clearEditFormatDirty() {
        editFormatDirty = false;
      }

function markEditFormatDirty() {
        editFormatDirty = true;
      }

function isEditFormatDirty() {
        return !!editFormatDirty;
      }

function selectEditSavedTable(value) {
        const select = document.getElementById('editSavedTables');
        if (!select) {
          return;
        }
        if (select.disabled) {
          return;
        }
        const normalized = value ? String(value) : '';
        let hasMatch = false;
        if (select.options && select.options.length) {
          Array.prototype.forEach.call(select.options, function(option) {
            if (option && option.value === normalized) {
              hasMatch = true;
            }
          });
        }
        if (!normalized || !hasMatch) {
          select.value = '';
          const event = new Event('change', { bubbles: true });
          select.dispatchEvent(event);
          return;
        }
        if (select.value !== normalized) {
          select.value = normalized;
        }
        const event = new Event('change', { bubbles: true });
        select.dispatchEvent(event);
      }

function selectEditSavedText(value) {
        const select = document.getElementById('editSavedTexts');
        if (!select || select.disabled) {
          return;
        }
        const normalized = value ? String(value) : '';
        let hasMatch = false;
        if (select.options && select.options.length) {
          Array.prototype.forEach.call(select.options, function(option) {
            if (option && option.value === normalized) {
              hasMatch = true;
            }
          });
        }
        if (!normalized || !hasMatch) {
          select.value = '';
          const event = new Event('change', { bubbles: true });
          select.dispatchEvent(event);
          return;
        }
        if (select.value !== normalized) {
          select.value = normalized;
        }
        const event = new Event('change', { bubbles: true });
        select.dispatchEvent(event);
      }

async function openSavedTextForEditing(textId, options) {
        const id = textId ? String(textId).trim() : '';
        if (!id) {
          return;
        }
        if (!window.WordFavoriteManager || typeof window.WordFavoriteManager.openFavorite !== 'function') {
          await showMessageModal('Esta versión no permite cargar textos guardados automáticamente.', {
            title: 'Función no disponible',
            variant: 'warning'
          });
          return;
        }
        try {
          await window.WordFavoriteManager.openFavorite(id, options || {});
        } catch (err) {
          await showMessageModal('No se pudo cargar el texto guardado: ' + (err && err.message ? err.message : err), {
            title: 'No se pudo cargar',
            variant: 'error'
          });
        }
      }

async function locateSavedTable(tableId) {
        const id = tableId ? String(tableId).trim() : '';
        if (!id) {
          return;
        }
        let response;
        try {
          response = await callServerFunction('focusSavedTableRange', id);
        } catch (err) {
          await showMessageModal('No se pudo enfocar la tabla: ' + (err && err.message ? err.message : err), {
            title: 'No se pudo enfocar',
            variant: 'error'
          });
          return;
        }
        if (!response || response.error) {
          await showMessageModal((response && response.error) || 'No se pudo enfocar la tabla seleccionada.', {
            title: 'No se pudo enfocar',
            variant: 'error'
          });
        }
      }

function setEditDefaultStyles() {
        const colorHeader = document.getElementById('editColorHeader');
        const colorAlt1 = document.getElementById('editColorAlt1');
        const colorAlt2 = document.getElementById('editColorAlt2');
        const borderToggle = document.getElementById('editToggleBorder');
        const boldToggle = document.getElementById('editToggleBold');
        const defaults =
          typeof getTableStyleDefaults === 'function'
            ? getTableStyleDefaults()
            : {
                headerColor: DEFAULT_STYLE.headerColor,
                altColor1: DEFAULT_STYLE.altColor1,
                altColor2: DEFAULT_STYLE.altColor2,
                border: DEFAULT_STYLE.border,
                bold: DEFAULT_STYLE.bold
              };
        if (colorHeader) colorHeader.value = defaults.headerColor;
        if (colorAlt1) colorAlt1.value = defaults.altColor1;
        if (colorAlt2) colorAlt2.value = defaults.altColor2;
        if (borderToggle) borderToggle.checked = !!defaults.border;
        if (boldToggle) boldToggle.checked = !!defaults.bold;
      }

/* -------------------------------------------------------------------------- */
/*  TableCrafter Edit Tab Favorites                                           */
/* -------------------------------------------------------------------------- */

function parseEditFavoriteRangeParts(value) {
        if (typeof parseTableFavoriteRangeParts === 'function') {
          return parseTableFavoriteRangeParts(value);
        }
        const trimmed = typeof value === 'string' ? value.trim() : '';
        if (!trimmed) {
          return { sheet: '', range: '' };
        }
        const bangIndex = trimmed.indexOf('!');
        if (bangIndex === -1) {
          return { sheet: '', range: trimmed };
        }
        const sheetPart = trimmed.substring(0, bangIndex).replace(/^'+|'+$/g, '');
        const rangePart = trimmed.substring(bangIndex + 1);
        return { sheet: sheetPart, range: rangePart };
      }

function collectEditFavoriteConfig(validation) {
        const base =
          validation && validation.values
            ? validation
            : validateTableDetails({
                nameInputId: 'editTableName',
                descInputId: 'editTableDesc',
                headers: editHeaders
              });
        const values = base && base.values ? base.values : { name: '', description: '', headers: [] };

        const label = document.getElementById('editRangeLabel');

function setEditRangeUI(info, options) {
        options = options || {};
        if (!info || !info.sheetName || !info.a1Notation) {
          clearEditRangeUI();
          return;
        }
        const rows = typeof info.rows === 'number' ? info.rows : (info.rows || 0);
        const cols = typeof info.cols === 'number' ? info.cols : (info.cols || 0);
        const label = document.getElementById('editRangeLabel');
        const input = document.getElementById('editRangeInput');
        const fullA1 = info.sheetName + '!' + info.a1Notation;
        if (label) {
          const dims = rows && cols ? ' (' + cols + '×' + rows + ')' : '';
          label.textContent = fullA1 + dims;
        }
        if (input && (options.force || input.dataset.manual !== 'true')) {
          input.value = fullA1;
          input.dataset.manual = 'false';
        }
        const previousInfo = editRangeInfo;
        const incomingEditHeaders = Array.isArray(info.headers) ? info.headers : editHeaders;
        const previousHeadersSource = previousInfo && Array.isArray(previousInfo.headers)
          ? previousInfo.headers
          : Array.isArray(editHeaders)
          ? editHeaders
          : [];
        const normalizedPreviousHeaders = cloneHeaderModels(previousHeadersSource);
        const normalizedHeaders = cloneHeaderModels(incomingEditHeaders);
        if (normalizedPreviousHeaders.length > 0) {
          for (let i = 0; i < normalizedHeaders.length; i++) {
            const header = normalizedHeaders[i];
            const fallback = normalizedPreviousHeaders[i];
            if (!fallback) {
              continue;
            }
            const labelText = header.label ? String(header.label).trim() : '';
            if (!labelText) {
              header.label = fallback.label || '';
            }
            const hasDescriptionText = header.description ? String(header.description).trim() : '';
            if ((!hasDescriptionText || !header.hasDescription) && fallback.hasDescription) {
              header.description = fallback.description || '';
              header.hasDescription = true;
            }
            const fallbackPrompt = fallback.aiFillPrompt ? String(fallback.aiFillPrompt).trim() : '';
            if (fallback.aiFillEnabled && !header.aiFillEnabled) {
              header.aiFillEnabled = true;
            }
            if ((!header.aiFillPrompt || !String(header.aiFillPrompt).trim()) && fallbackPrompt) {
              header.aiFillPrompt = fallbackPrompt;
            }
            if (fallback.key) {
              header.key = fallback.key;
            }
          }
        }
        const incomingPreference =
          typeof info.updateFormulaReferences === 'boolean'
            ? info.updateFormulaReferences
            : previousInfo && typeof previousInfo.updateFormulaReferences === 'boolean'
            ? previousInfo.updateFormulaReferences
            : true;
        info.headers = normalizedHeaders;
        editRangeInfo = {
          sheetName: info.sheetName,
          a1Notation: info.a1Notation,
          rows: rows,
          cols: cols,
          headers: cloneHeaderModels(info.headers),
          updateFormulaReferences: incomingPreference
        };
        editRangeInfo.fullA1 = fullA1;
        if (options.clearDirty) {
          clearEditFormatDirty();
        } else if (options.markDirty) {
          markEditFormatDirty();
        }
      }

                if (label) {

                }
                showMessageModal(info.error, {
                  title: 'Rango no disponible',
                  variant: 'error'
                });
                resolve({ ok: false, error: info.error });
                return;
              }
              const infoForUi = Object.assign({}, info);
              if (!updateHeaders) {

              const input = document.getElementById('editRangeInput');

              setEditRangeUI(infoForUi, { force: shouldForce, markDirty: !!opts.markDirty });
              if (updateHeaders) {

          );

          await showMessageModal('No se pudo aplicar el formato: ' + (err && err.message ? err.message : err), {
            title: 'No se pudo aplicar',
            variant: 'error'
          });
          return false;
        }

        if (response && response.error) {
          await showMessageModal(response.error, {
            title: 'No se pudo aplicar',
            variant: 'error'
          });
          return false;
        }

        if (response && response.rangeInfo) {
          setEditRangeUI(response.rangeInfo, { force: true, clearDirty: true });
          if (Array.isArray(response.rangeInfo.headers)) {
            editHeaders = cloneHeaderModels(response.rangeInfo.headers);
            renderEditHeaders();
          }
          const appliedPreference =
            typeof response.rangeInfo.updateFormulaReferences === 'boolean'
              ? response.rangeInfo.updateFormulaReferences
              : updateFormulaReferences;
          applyEditFormulaPreference(appliedPreference);
          entryValues.updateFormulaReferences = appliedPreference;
        } else {
          applyEditFormulaPreference(updateFormulaReferences);
        }

        if (response && response.id) {
          editingId = response.id;
          lastSavedTableId = response.id;
          const cachedEntry = buildSavedTableCacheEntry(
            response.id,
            entryValues,
            (response && response.rangeInfo) || editRangeInfo,
            style,
            editHeaders
          );
          if (cachedEntry) {
            upsertSavedTablesCache(cachedEntry);
            applySavedTablesFromCache(['editSavedTables', 'aiSavedTables'], {
              selectId: response.id
            });
          }
        }

        updateEditFavoriteButtonState();

        await refreshSavedTables(['editSavedTables', 'aiSavedTables'], {
          selectId: editingId
        });

        clearEditFormatDirty();

        await showMessageModal((response && response.message) || 'Formato aplicado correctamente.', {
          title: 'Formato aplicado',
          variant: 'success'
        });
        return true;
      }



      document.getElementById('saveTableBtn').addEventListener('click', function() {
        handleSaveAction();
      });

      document.getElementById('editSaveTableBtn').addEventListener('click', function() {
        handleEditSaveAction();
      });

      const editFavoriteBtn = document.getElementById('editFavoriteBtn');
      if (editFavoriteBtn) {
        editFavoriteBtn.addEventListener('click', function() {
          handleEditSaveFavorite();
        });
      }

      updateEditFavoriteButtonState();

      

async function handleEditSaveAction(options) {
        const opts = options || {};
        if (!editingId) {
          await showMessageModal('Seleccione una tabla guardada antes de guardar los cambios.', {
            title: 'Seleccione una tabla',
            variant: 'error'
          });
          return false;
        }

        const rangeA1 = getEditRangeInputValue();
        if (!rangeA1) {
          await showMessageModal('Indique un rango válido antes de guardar la tabla.', {
            title: 'Rango requerido',
            variant: 'error'
          });
          return false;
        }

        const validation = validateTableDetails({
          nameInputId: 'editTableName',
          descInputId: 'editTableDesc',
          headers: editHeaders
        });

        if (validation.missing.length > 0) {
          const missingExcludingName = validation.missing.filter(function(item) {
            return item !== 'Nombre de la tabla';
          });

          if (missingExcludingName.length > 0) {
            const msg = buildMissingFieldsMessage(validation.missing);
            await showMessageModal(msg || 'Complete todos los campos obligatorios antes de continuar.', {
              title: 'Información incompleta',
              variant: 'error'
            });
            return false;
          }

          if (validation.missing.indexOf('Nombre de la tabla') !== -1) {
            const continueWithoutName = await showConfirmModal(
              'Guardar sin nombre hará que la tabla sea difícil de identificar. ¿Desea continuar?',
              {
                title: 'Guardar sin nombre',
                variant: 'warning',
                confirmText: 'Continuar',
                cancelText: 'Cancelar'
              }
            );
            if (!continueWithoutName) {
              return false;
            }
          }
        }

        const uniqueName = await ensureUniqueTableNameOrAlert(validation.values.name, {
          ignoreId: editingId
        });
        if (!uniqueName) {
          return false;
        }

        editHeaders = cloneHeaderModels(validation.values.headers);
        renderEditHeaders();
        const nameInput = document.getElementById('editTableName');
        if (nameInput) {
          nameInput.value = validation.values.name;
        }
        const descInput = document.getElementById('editTableDesc');
        if (descInput) {
          descInput.value = validation.values.description;
        }

        const headerColorInput = document.getElementById('editColorHeader');
        const alt1Input = document.getElementById('editColorAlt1');
        const alt2Input = document.getElementById('editColorAlt2');
        const borderToggle = document.getElementById('editToggleBorder');
        const boldToggle = document.getElementById('editToggleBold');
        const defaults =
          typeof getTableStyleDefaults === 'function'
            ? getTableStyleDefaults()
            : {
                headerColor: DEFAULT_STYLE.headerColor,
                altColor1: DEFAULT_STYLE.altColor1,
                altColor2: DEFAULT_STYLE.altColor2,
                border: DEFAULT_STYLE.border,
                bold: DEFAULT_STYLE.bold
              };
        const style = {
          headerColor: headerColorInput ? headerColorInput.value : defaults.headerColor,
          altColor1: alt1Input ? alt1Input.value : defaults.altColor1,
          altColor2: alt2Input ? alt2Input.value : defaults.altColor2,
          border: borderToggle ? !!borderToggle.checked : defaults.border,
          bold: boldToggle ? !!boldToggle.checked : defaults.bold
        };

        const updateFormulaReferences = shouldUpdateEditFormulaReferences();
        const entryValues = Object.assign({}, validation.values, {
          updateFormulaReferences: updateFormulaReferences
        });

        if (isEditFormatDirty() && !opts.skipFormatPrompt) {
          const decision = await openModal({
            title: 'Formato pendiente',
            message: 'Debe aplicar formato antes de guardar.',
            variant: 'warning',
            primaryText: 'Aplicar formato y guardar',
            secondaryText: 'Cancelar'
          });
          if (decision === 'primary') {
            const applied = await handleEditApplyFormat();
            if (!applied) {
              return false;
            }
            return handleEditSaveAction(Object.assign({}, opts, { skipFormatPrompt: true }));
          }
          return false;
        }

        let response;
        try {
          response = await callServerFunction(
            'applyTableFormatting',
            editingId,
            rangeA1,
            validation.values.name,
            validation.values.description,
            cloneHeaderModels(editHeaders),
            style,
            { skipFormatting: true, formulaPreference: updateFormulaReferences }
          );
        } catch (err) {
          await showMessageModal('No se pudo guardar la tabla: ' + (err && err.message ? err.message : err), {
            title: 'No se pudo guardar',
            variant: 'error'
          });
          return false;
        }

        if (response && response.error) {
          await showMessageModal(response.error, {
            title: 'No se pudo guardar',
            variant: 'error'
          });
          return false;
        }

        if (response && response.rangeInfo) {
          setEditRangeUI(response.rangeInfo, { force: true, clearDirty: true });
          if (Array.isArray(response.rangeInfo.headers)) {
            editHeaders = cloneHeaderModels(response.rangeInfo.headers);
            renderEditHeaders();
          }
          const appliedPreference =
            typeof response.rangeInfo.updateFormulaReferences === 'boolean'
              ? response.rangeInfo.updateFormulaReferences
              : updateFormulaReferences;
          applyEditFormulaPreference(appliedPreference);
          entryValues.updateFormulaReferences = appliedPreference;
        } else {
          applyEditFormulaPreference(updateFormulaReferences);
        }

        if (response && response.id) {
          editingId = response.id;
          lastSavedTableId = response.id;
          const cachedEntry = buildSavedTableCacheEntry(
            response.id,
            entryValues,
            (response && response.rangeInfo) || editRangeInfo,
            style,
            editHeaders
          );
          if (cachedEntry) {
            upsertSavedTablesCache(cachedEntry);
            applySavedTablesFromCache(['editSavedTables', 'aiSavedTables'], {
              selectId: response.id
            });
          }
        }

        updateEditFavoriteButtonState();

        await refreshSavedTables(['editSavedTables', 'aiSavedTables'], {
          selectId: editingId
        });

        await showMessageModal((response && response.message) || 'Tabla guardada correctamente.', {
          title: 'Tabla guardada',
          variant: 'success'
        });
        return true;
      }
const TableCrafterEditTab = Object.freeze({
        markDirty: markEditFormatDirty,
        clearDirty: clearEditFormatDirty,
        isDirty: isEditFormatDirty,
        resetView: resetEditTabView,
        loadActiveRange: loadEditActiveRange,
        applyFormat: handleEditApplyFormat,
        saveTable: handleEditSaveAction,
        selectSavedText: selectEditSavedText,
        renderSavedTexts: setEditSavedTexts,
        refreshSavedTexts: refreshEditSavedTextsData,
        openSavedText: openSavedTextForEditing
      });

window.TableCrafterEditTab = TableCrafterEditTab;
