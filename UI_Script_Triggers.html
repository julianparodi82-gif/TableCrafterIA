<script>
/* -------------------------------------------------------------------------- */
/*  TableCrafter Triggers Tab State                                          */
/* -------------------------------------------------------------------------- */
const TRIGGER_CATEGORY_DEFS = Object.freeze({
  tableCreate: { key: 'tableCreate', label: 'Crear Tabla', group: 'table' },
  tableEdit: { key: 'tableEdit', label: 'Editar Tabla', group: 'table' },
  tableDelete: { key: 'tableDelete', label: 'Borrar Tabla', group: 'table' },
  tableIa: { key: 'tableIa', label: 'Panel IA TC', group: 'table' },
  wordCreate: { key: 'wordCreate', label: 'Crear Texto', group: 'word' },
  wordEdit: { key: 'wordEdit', label: 'Editar Texto', group: 'word' },
  wordDelete: { key: 'wordDelete', label: 'Borrar Texto', group: 'word' },
  wordIa: { key: 'wordIa', label: 'Panel IA WC', group: 'word' }
});
const TRIGGER_GROUP_ORDER = Object.freeze([
  { key: 'table', label: 'TableCrafter', categories: ['tableCreate', 'tableEdit', 'tableDelete', 'tableIa'] },
  { key: 'word', label: 'Wordcrafter', categories: ['wordCreate', 'wordEdit', 'wordDelete', 'wordIa'] }
]);

let triggerEntries = [];
let triggerIdCounter = 0;
let triggerActionCache = [];
let triggerActionGroupCache = [];
let triggerActionMap = Object.create(null);
let triggerActionPickerInitialized = false;
let triggerActionMenuOpen = false;
let triggerActionDocumentEventsBound = false;

const TRIGGER_CALENDAR_MONTH_NAMES = Object.freeze([
  'Enero',
  'Febrero',
  'Marzo',
  'Abril',
  'Mayo',
  'Junio',
  'Julio',
  'Agosto',
  'Septiembre',
  'Octubre',
  'Noviembre',
  'Diciembre'
]);
const TRIGGER_CALENDAR_MONTH_SHORT_NAMES = Object.freeze([
  'Ene',
  'Feb',
  'Mar',
  'Abr',
  'May',
  'Jun',
  'Jul',
  'Ago',
  'Sep',
  'Oct',
  'Nov',
  'Dic'
]);
const TRIGGER_CALENDAR_YEAR_SPAN = 6;
const TRIGGER_WEEKDAY_LABELS = Object.freeze([
  'Lunes',
  'Martes',
  'Miércoles',
  'Jueves',
  'Viernes',
  'Sábado',
  'Domingo'
]);
const TRIGGER_WEEKDAY_SHORT_LABELS = Object.freeze([
  'Lun',
  'Mar',
  'Mié',
  'Jue',
  'Vie',
  'Sáb',
  'Dom'
]);
const TRIGGER_SCHEDULE_DAY_MS = 24 * 60 * 60 * 1000;
let triggerCalendarState = {
  activeYear: null,
  activeMonth: null,
  selectedDate: '',
  selectedDates: [],
  selectionLimit: 1,
  frequency: 'once',
  weeklyDay: null,
  biweeklyDays: [],
  todayParts: null
};

function refreshTriggerTodayParts() {
  const parts = getTriggerCalendarTodayParts();
  triggerCalendarState.todayParts = parts;
  return parts;
}

function getTriggerTodayDateString() {
  const parts = refreshTriggerTodayParts();
  return formatTriggerDateParts(parts.year, parts.month, parts.day);
}

function isTriggerDateInPast(parts) {
  if (!parts || !parts.date) {
    return false;
  }
  const todayParts = triggerCalendarState.todayParts || refreshTriggerTodayParts();
  const todayTime = new Date(todayParts.year, todayParts.month, todayParts.day).getTime();
  return parts.date.getTime() < todayTime;
}

function isTriggerDateStringInPast(dateString) {
  if (!dateString) {
    return false;
  }
  const parsed = parseTriggerDateString(dateString);
  if (!parsed) {
    return false;
  }
  return isTriggerDateInPast(parsed);
}

function isTriggerSectionEnabled() {
  const toggle = document.getElementById('triggerSectionToggle');
  return !toggle || toggle.checked;
}

function getCurrentTimeValue() {
  const now = new Date();
  const hours = String(now.getHours()).padStart(2, '0');
  const minutes = String(now.getMinutes()).padStart(2, '0');
  return hours + ':' + minutes;
}

function isTriggerStartToday() {
  if (!isTriggerSectionEnabled()) {
    return false;
  }
  const frequency = triggerCalendarState.frequency || getTriggerFrequencyValue() || '';
  if (!frequency) {
    return false;
  }
  const todayString = getTriggerTodayDateString();
  if (!todayString) {
    return false;
  }
  if (frequency === 'custom') {
    return Array.isArray(triggerCalendarState.selectedDates)
      ? triggerCalendarState.selectedDates.indexOf(todayString) !== -1
      : false;
  }
  if (frequency === 'weekly') {
    const fromInput = document.getElementById('triggerDateFrom');
    return !!(fromInput && fromInput.value === todayString);
  }
  if (Array.isArray(triggerCalendarState.selectedDates) && triggerCalendarState.selectedDates.length) {
    return triggerCalendarState.selectedDates[0] === todayString;
  }
  const fromInput = document.getElementById('triggerDateFrom');
  return !!(fromInput && fromInput.value === todayString);
}

function applyTriggerTimeConstraints() {
  const startTimeInput = document.getElementById('triggerStartTime');
  if (!startTimeInput) {
    return false;
  }
  const startTimeControl = document.getElementById('triggerStartTimeControl');
  const fieldset = document.getElementById('triggerSectionFieldset');
  const sectionActive = isTriggerSectionEnabled() && (!fieldset || !fieldset.disabled);
  if (!sectionActive || startTimeInput.disabled) {
    if (startTimeInput.min) {
      startTimeInput.min = '';
    }
    return false;
  }
  if (isTriggerStartToday()) {
    const currentValue = getCurrentTimeValue();
    startTimeInput.min = currentValue;
    if (!startTimeInput.value || startTimeInput.value < currentValue) {
      startTimeInput.value = currentValue;
      updateTriggerStartTimeDisplay();
      if (startTimeControl && typeof startTimeControl.__triggerTimeSync === 'function') {
        try {
          startTimeControl.__triggerTimeSync();
        } catch (err) {
          // ignore sync errors
        }
      }
      return true;
    }
  } else if (startTimeInput.min) {
    startTimeInput.min = '';
  }
  return false;
}

function normalizeTriggerSearchText(value) {
  if (value === null || value === undefined) {
    return '';
  }
  let text = String(value).trim();
  if (!text) {
    return '';
  }
  if (typeof text.normalize === 'function') {
    try {
      text = text.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    } catch (err) {
      // ignore normalization errors
    }
  }
  return text.toLowerCase();
}

function collectTriggerTokenCandidates(action) {
  const tokens = [];
  if (!action) {
    return tokens;
  }
  const metadata = action.metadata && typeof action.metadata === 'object' ? action.metadata : {};
  const metadataKeys = [
    'context',
    'tabId',
    'tab',
    'origin',
    'action',
    'favoriteKind',
    'recordType',
    'sourceType',
    'theme',
    'id',
    'type',
    'scope'
  ];
  metadataKeys.forEach(function(key) {
    const value = metadata[key];
    if (value === null || value === undefined) {
      return;
    }
    if (typeof value === 'string' || typeof value === 'number') {
      tokens.push(value);
    }
  });
  if (Array.isArray(metadata.tags)) {
    metadata.tags.forEach(function(tag) {
      if (tag !== null && tag !== undefined && tag !== '') {
        tokens.push(tag);
      }
    });
  }
  if (action.id) {
    tokens.push(action.id);
  }
  if (action.name) {
    tokens.push(action.name);
  }
  if (action.description) {
    tokens.push(action.description);
  }
  if (action.type) {
    tokens.push(action.type);
  }
  return tokens;
}

function resolveTriggerActionTheme(action, resolvedType, normalizedTokens) {
  const tokens = Array.isArray(normalizedTokens) ? normalizedTokens : [];
  if (typeof isWordcrafterActionFavorite === 'function') {
    try {
      if (isWordcrafterActionFavorite(action, resolvedType)) {
        return 'word';
      }
    } catch (err) {
      // ignore failures
    }
  }
  const typeText = normalizeTriggerSearchText(resolvedType);
  if (typeText === 'wordfavorite') {
    return 'word';
  }
  for (let i = 0; i < tokens.length; i++) {
    const token = tokens[i];
    if (!token) {
      continue;
    }
    if (
      token.indexOf('word') !== -1 ||
      token.indexOf('texto') !== -1 ||
      token.indexOf('accioneswc') !== -1 ||
      token.indexOf('paneliaword') !== -1 ||
      token.indexOf('paneliawc') !== -1 ||
      token.indexOf('wordcrafter') !== -1
    ) {
      return 'word';
    }
  }
  return 'table';
}

function resolveTriggerActionCategoryKey(action, resolvedType, normalizedTokens) {
  const tokens = Array.isArray(normalizedTokens) ? normalizedTokens : [];
  const theme = resolveTriggerActionTheme(action, resolvedType, tokens);
  const fallback = theme === 'word' ? 'wordCreate' : 'tableCreate';

  function hasToken(keyword) {
    if (!keyword) {
      return false;
    }
    for (let i = 0; i < tokens.length; i++) {
      if (tokens[i] && tokens[i].indexOf(keyword) !== -1) {
        return true;
      }
    }
    return false;
  }

  if (hasToken('borrartabla') || hasToken('eliminartabla') || hasToken('deletetable') || hasToken('borrartc')) {
    return 'tableDelete';
  }
  if (hasToken('borrartexto') || hasToken('eliminartexto') || hasToken('deletetext') || hasToken('deleteword')) {
    return 'wordDelete';
  }
  if (hasToken('paneliawc') || hasToken('accioneswc') || hasToken('paneliaword') || hasToken('paneliawordrewrite')) {
    return 'wordIa';
  }
  if (hasToken('paneliareport') || hasToken('paneliaask') || hasToken('paneliatc') || hasToken('accionestc')) {
    return 'tableIa';
  }
  if (hasToken('panelia') && theme === 'word') {
    return 'wordIa';
  }
  if (hasToken('panelia') && theme === 'table') {
    return 'tableIa';
  }
  if (hasToken('creartablatc') || hasToken('creartabla') || hasToken('createtable')) {
    return 'tableCreate';
  }
  if (hasToken('creartextowc') || hasToken('creartexto') || hasToken('createtext') || hasToken('createtexto')) {
    return 'wordCreate';
  }
  if (hasToken('editartablatc') || hasToken('editartabla') || hasToken('edittable') || hasToken('tablaeditar')) {
    return 'tableEdit';
  }
  if (hasToken('editartextowc') || hasToken('editartexto') || hasToken('edittext') || hasToken('editword')) {
    return 'wordEdit';
  }
  if (hasToken('tablapanelia')) {
    return 'tableIa';
  }
  const metadata = action && action.metadata && typeof action.metadata === 'object' ? action.metadata : {};
  const tabId = normalizeTriggerSearchText(metadata.tabId || metadata.tab || '');
  if (tabId === 'edittab') {
    return theme === 'word' ? 'wordEdit' : 'tableEdit';
  }
  if (tabId === 'createtab') {
    return theme === 'word' ? 'wordCreate' : 'tableCreate';
  }
  const resolved = normalizeTriggerSearchText(resolvedType);
  if (resolved === 'tableeditfavorite') {
    return 'tableEdit';
  }
  if (resolved === 'tablefavorite' || resolved === 'table') {
    return 'tableCreate';
  }
  if (resolved === 'wordfavorite') {
    if (hasToken('editar') || hasToken('edit')) {
      return 'wordEdit';
    }
    return 'wordCreate';
  }
  if (resolved === 'reportfavorite') {
    return theme === 'word' ? 'wordIa' : 'tableIa';
  }
  if (theme === 'word') {
    if (hasToken('edit')) {
      return 'wordEdit';
    }
    return 'wordCreate';
  }
  return fallback;
}

function getTriggerCalendarTodayParts() {
  const now = new Date();
  return {
    year: now.getFullYear(),
    month: now.getMonth(),
    day: now.getDate()
  };
}

function formatTriggerDateParts(year, month, day) {
  const mm = String(month + 1).padStart(2, '0');
  const dd = String(day).padStart(2, '0');
  return year + '-' + mm + '-' + dd;
}

function parseTriggerDateString(value) {
  if (!value) {
    return null;
  }
  const parts = String(value).split('-');
  if (parts.length !== 3) {
    return null;
  }
  const year = parseInt(parts[0], 10);
  const month = parseInt(parts[1], 10) - 1;
  const day = parseInt(parts[2], 10);
  if (isNaN(year) || isNaN(month) || isNaN(day)) {
    return null;
  }
  return {
    year: year,
    month: month,
    day: day,
    date: new Date(year, month, day)
  };
}

function ensureTriggerCalendarDefaults() {
  if (!triggerCalendarState.todayParts) {
    triggerCalendarState.todayParts = getTriggerCalendarTodayParts();
  }
  if (typeof triggerCalendarState.activeYear !== 'number' || typeof triggerCalendarState.activeMonth !== 'number') {
    const anchorValue =
      triggerCalendarState.selectedDate ||
      (triggerCalendarState.selectedDates && triggerCalendarState.selectedDates.length
        ? triggerCalendarState.selectedDates[0]
        : '');
    const selected = parseTriggerDateString(anchorValue);
    const base = selected || triggerCalendarState.todayParts || getTriggerCalendarTodayParts();
    triggerCalendarState.activeYear = base.year;
    triggerCalendarState.activeMonth = base.month;
  }
}

function populateTriggerCalendarMonthOptions(select) {
  if (!select) {
    return;
  }
  if (select.options && select.options.length === TRIGGER_CALENDAR_MONTH_SHORT_NAMES.length) {
    return;
  }
  select.innerHTML = '';
  TRIGGER_CALENDAR_MONTH_SHORT_NAMES.forEach(function(name, index) {
    const option = document.createElement('option');
    option.value = String(index);
    option.textContent = name;
    select.appendChild(option);
  });
}

function populateTriggerCalendarYearOptions(select, targetYear) {
  if (!select) {
    return;
  }
  const baseYear = typeof targetYear === 'number' ? targetYear : (triggerCalendarState.todayParts || getTriggerCalendarTodayParts()).year;
  const startYear = baseYear - TRIGGER_CALENDAR_YEAR_SPAN;
  const endYear = baseYear + TRIGGER_CALENDAR_YEAR_SPAN;
  const existingOptions = Array.prototype.slice.call(select.options || []).map(function(option) {
    return parseInt(option.value, 10);
  });
  if (existingOptions.length && existingOptions[0] === startYear && existingOptions[existingOptions.length - 1] === endYear) {
    return;
  }
  select.innerHTML = '';
  for (let year = startYear; year <= endYear; year++) {
    const option = document.createElement('option');
    option.value = String(year);
    option.textContent = String(year);
    select.appendChild(option);
  }
}

function getTriggerFrequencyValue() {
  const frequencySelect = document.getElementById('triggerFrequencySelect');
  return frequencySelect ? frequencySelect.value || '' : '';
}

function getTriggerCustomSelectionLimit() {
  const countInput = document.getElementById('triggerFrequencyCount');
  if (!countInput) {
    return 0;
  }
  const parsed = countInput.value ? parseInt(countInput.value, 10) : NaN;
  if (isNaN(parsed) || parsed <= 0) {
    return 0;
  }
  return Math.min(parsed, 20);
}

function trimTriggerSelectedDates() {
  if (!Array.isArray(triggerCalendarState.selectedDates)) {
    triggerCalendarState.selectedDates = [];
  }
  const original = triggerCalendarState.selectedDates.slice();
  const todayParts = triggerCalendarState.todayParts || refreshTriggerTodayParts();
  const todayTime = new Date(todayParts.year, todayParts.month, todayParts.day).getTime();
  const seen = Object.create(null);
  const filtered = [];
  original.forEach(function(dateString) {
    if (!dateString || seen[dateString]) {
      return;
    }
    const parsed = parseTriggerDateString(dateString);
    if (!parsed || !parsed.date || parsed.date.getTime() < todayTime) {
      return;
    }
    seen[dateString] = true;
    filtered.push(dateString);
  });
  let finalDates = filtered;
  if (triggerCalendarState.selectionLimit > 0 && finalDates.length > triggerCalendarState.selectionLimit) {
    finalDates = finalDates.slice(0, triggerCalendarState.selectionLimit);
  }
  triggerCalendarState.selectedDates = finalDates;
  triggerCalendarState.selectedDate = finalDates.length ? finalDates[0] : '';
  if (finalDates.length !== original.length) {
    return true;
  }
  for (let i = 0; i < finalDates.length; i++) {
    if (finalDates[i] !== original[i]) {
      return true;
    }
  }
  return false;
}

function isBiweeklyScheduledDate(anchorParts, startTime, currentParts, windowCheck) {
  if (!anchorParts || !anchorParts.date || !currentParts || !currentParts.date) {
    return false;
  }
  if (isNaN(startTime)) {
    return false;
  }
  const currentTime = currentParts.date.getTime();
  if (currentTime < startTime) {
    return false;
  }
  if (typeof windowCheck === 'function' && !windowCheck(currentTime)) {
    return false;
  }
  const anchorDay = anchorParts.day;
  const targetDate = currentParts.date;
  let occurrence = new Date(anchorParts.date.getTime());

  function computeNext(previous) {
    const next = new Date(previous.getTime());
    if (anchorDay === 15 && previous.getDate() === 15) {
      const monthDays = new Date(previous.getFullYear(), previous.getMonth() + 1, 0).getDate();
      if (monthDays !== 30) {
        return new Date(previous.getFullYear(), previous.getMonth(), monthDays);
      }
      next.setDate(next.getDate() + 15);
      return next;
    }
    next.setDate(next.getDate() + 15);
    if (anchorDay === 15 && previous.getDate() !== 15) {
      const monthDays = new Date(previous.getFullYear(), previous.getMonth() + 1, 0).getDate();
      if (previous.getDate() === monthDays && monthDays !== 30) {
        return new Date(previous.getFullYear(), previous.getMonth() + 1, 15);
      }
    }
    return next;
  }

  let guard = 0;
  while (occurrence.getTime() < startTime && guard < 400) {
    const nextOccurrence = computeNext(occurrence);
    if (nextOccurrence.getTime() <= occurrence.getTime()) {
      break;
    }
    occurrence = nextOccurrence;
    guard++;
  }

  guard = 0;
  while (occurrence.getTime() <= currentTime && guard < 400) {
    if (
      occurrence.getFullYear() === targetDate.getFullYear() &&
      occurrence.getMonth() === targetDate.getMonth() &&
      occurrence.getDate() === targetDate.getDate()
    ) {
      return true;
    }
    const nextOccurrence = computeNext(occurrence);
    if (nextOccurrence.getTime() <= occurrence.getTime()) {
      break;
    }
    occurrence = nextOccurrence;
    guard++;
  }
  return false;
}

function updateTriggerCalendarSelectionLimit() {
  const frequency = triggerCalendarState.frequency || getTriggerFrequencyValue() || '';
  if (!frequency) {
    triggerCalendarState.selectionLimit = 0;
    triggerCalendarState.selectedDates = [];
    triggerCalendarState.selectedDate = '';
    syncTriggerSelectedInputs();
    return;
  }
  if (frequency === 'custom') {
    const limit = getTriggerCustomSelectionLimit();
    triggerCalendarState.selectionLimit = limit > 0 ? limit : 0;
  } else if (frequency === 'weekly') {
    triggerCalendarState.selectionLimit = 0;
  } else if (frequency === 'biweekly') {
    triggerCalendarState.selectionLimit = 1;
  } else {
    triggerCalendarState.selectionLimit = 1;
  }
  if (frequency === 'custom' && triggerCalendarState.selectionLimit <= 0) {
    triggerCalendarState.selectedDates = [];
    triggerCalendarState.selectedDate = '';
    syncTriggerSelectedInputs({ skipFrom: true });
  }
  if (trimTriggerSelectedDates()) {
    syncTriggerSelectedInputs();
  }
}

function syncTriggerSelectedInputs(options) {
  const opts = options || {};
  const hiddenStart = document.getElementById('triggerStartDate');
  const listInput = document.getElementById('triggerSelectedDates');
  const fromInput = document.getElementById('triggerDateFrom');
  if (hiddenStart) {
    hiddenStart.value = triggerCalendarState.selectedDates.length ? triggerCalendarState.selectedDates[0] : '';
  }
  if (listInput) {
    listInput.value = triggerCalendarState.selectedDates.join(',');
  }
  const frequency = triggerCalendarState.frequency || getTriggerFrequencyValue() || '';
  const shouldSyncFromInput =
    !opts.skipFrom &&
    frequency &&
    (frequency === 'once' || frequency === 'daily' || frequency === 'biweekly' || frequency === 'monthly');
  if (fromInput && shouldSyncFromInput) {
    fromInput.value = triggerCalendarState.selectedDates.length ? triggerCalendarState.selectedDates[0] : '';
  }
}

function setTriggerSelectedDates(dateStrings, options) {
  triggerCalendarState.selectedDates = Array.isArray(dateStrings) ? dateStrings.slice() : [];
  trimTriggerSelectedDates();
  syncTriggerSelectedInputs(options);
}

function setTriggerSingleDate(dateString, options) {
  if (dateString) {
    setTriggerSelectedDates([dateString], options);
  } else {
    setTriggerSelectedDates([], options);
  }
}

function toggleTriggerCustomDate(dateString) {
  if (!dateString) {
    return;
  }
  if (isTriggerDateStringInPast(dateString)) {
    return;
  }
  if (!Array.isArray(triggerCalendarState.selectedDates)) {
    triggerCalendarState.selectedDates = [];
  }
  const index = triggerCalendarState.selectedDates.indexOf(dateString);
  const limit = triggerCalendarState.selectionLimit;
  if (limit <= 0 && index === -1) {
    return;
  }
  if (index !== -1) {
    triggerCalendarState.selectedDates.splice(index, 1);
  } else {
    if (limit > 0 && triggerCalendarState.selectedDates.length >= limit) {
      return;
    }
    triggerCalendarState.selectedDates.push(dateString);
  }
  trimTriggerSelectedDates();
  syncTriggerSelectedInputs({ skipFrom: true });
}

function updateTriggerWeeklyButtons() {
  const container = document.getElementById('triggerWeeklyOptions');
  if (!container) {
    return;
  }
  const buttons = container.querySelectorAll('.tc-trigger-weekly-button');
  buttons.forEach(function(button) {
    const value = button.getAttribute('data-weekday');
    const dayIndex = value === null ? null : parseInt(value, 10);
    if (dayIndex !== null && !isNaN(dayIndex) && dayIndex === triggerCalendarState.weeklyDay) {
      button.classList.add('is-selected');
      button.setAttribute('aria-pressed', 'true');
    } else {
      button.classList.remove('is-selected');
      button.setAttribute('aria-pressed', 'false');
    }
  });
}

function setTriggerWeeklyDay(dayIndex, options) {
  const opts = options || {};
  if (dayIndex === null || dayIndex === undefined || isNaN(dayIndex)) {
    triggerCalendarState.weeklyDay = null;
    updateTriggerWeeklyButtons();
    updateTriggerScheduleSummary();
    updateTriggerFormState();
    return;
  }

  triggerCalendarState.weeklyDay = dayIndex;

  let nextDateString = '';
  if (opts.preserveAnchor && opts.anchorDate) {
    nextDateString = opts.anchorDate;
  } else {
    const anchorDateString = opts.anchorDate || '';
    const anchorParts = anchorDateString ? parseTriggerDateString(anchorDateString) : null;
    const todayParts = refreshTriggerTodayParts();
    const todayDate = new Date(todayParts.year, todayParts.month, todayParts.day);
    let referenceDate = anchorParts && anchorParts.date ? new Date(anchorParts.date.getTime()) : null;
    if (!referenceDate || referenceDate.getTime() < todayDate.getTime()) {
      referenceDate = new Date(todayDate.getTime());
    }
    if (referenceDate) {
      const referenceWeekday = (referenceDate.getDay() + 6) % 7;
      const offset = (dayIndex - referenceWeekday + 7) % 7;
      const targetDate = new Date(
        referenceDate.getFullYear(),
        referenceDate.getMonth(),
        referenceDate.getDate()
      );
      targetDate.setDate(targetDate.getDate() + offset);
      nextDateString = formatTriggerDateParts(
        targetDate.getFullYear(),
        targetDate.getMonth(),
        targetDate.getDate()
      );
    }
  }

  if (nextDateString) {
    setTriggerSelectedDates([nextDateString], { skipFrom: true });
    const parsedTarget = parseTriggerDateString(nextDateString);
    if (parsedTarget) {
      triggerCalendarState.activeYear = parsedTarget.year;
      triggerCalendarState.activeMonth = parsedTarget.month;
    }
    const fromInput = document.getElementById('triggerDateFrom');
    if (fromInput) {
      fromInput.value = nextDateString;
    }
  }

  updateTriggerWeeklyButtons();
  updateTriggerScheduleSummary();
  updateTriggerFormState();
}

function updateTriggerBiweeklyInputs() {
  const day1Input = document.getElementById('triggerBiweeklyDay1');
  const day2Input = document.getElementById('triggerBiweeklyDay2');
  const days = Array.isArray(triggerCalendarState.biweeklyDays)
    ? triggerCalendarState.biweeklyDays.slice().sort(function(a, b) {
        return a - b;
      })
    : [];
  if (day1Input) {
    day1Input.value = days[0] ? String(days[0]) : '';
  }
  if (day2Input) {
    day2Input.value = days[1] ? String(days[1]) : '';
  }
}

function setTriggerBiweeklyDays(days, options) {
  const validDays = Array.isArray(days)
    ? days
        .map(function(day) {
          const parsed = parseInt(day, 10);
          return !isNaN(parsed) && parsed >= 1 && parsed <= 31 ? parsed : null;
        })
        .filter(function(day) {
          return day !== null;
        })
    : [];
  const unique = [];
  const seen = Object.create(null);
  validDays.forEach(function(day) {
    if (!seen[day] && unique.length < 2) {
      seen[day] = true;
      unique.push(day);
    }
  });
  triggerCalendarState.biweeklyDays = unique.sort(function(a, b) {
    return a - b;
  });
  if (options && options.anchorDate) {
    setTriggerSelectedDates([options.anchorDate], { skipFrom: true });
  }
  updateTriggerBiweeklyInputs();
  updateTriggerScheduleSummary();
  updateTriggerFormState();
}

function toggleTriggerBiweeklyDay(day, anchorDateString) {
  const parsedDay = parseInt(day, 10);
  if (isNaN(parsedDay) || parsedDay < 1 || parsedDay > 31) {
    return;
  }
  if (!Array.isArray(triggerCalendarState.biweeklyDays)) {
    triggerCalendarState.biweeklyDays = [];
  }
  const index = triggerCalendarState.biweeklyDays.indexOf(parsedDay);
  if (index !== -1) {
    triggerCalendarState.biweeklyDays.splice(index, 1);
  } else {
    if (triggerCalendarState.biweeklyDays.length >= 2) {
      return;
    }
    triggerCalendarState.biweeklyDays.push(parsedDay);
  }
  setTriggerBiweeklyDays(triggerCalendarState.biweeklyDays.slice(), { anchorDate: anchorDateString });
}

function buildTriggerSelectedDatesSummary() {
  if (!triggerCalendarState.selectedDates || !triggerCalendarState.selectedDates.length) {
    return '';
  }
  return triggerCalendarState.selectedDates
    .slice()
    .sort()
    .join(', ');
}

function updateTriggerScheduleSummary() {
  const summaryEl = document.getElementById('triggerScheduleSummary');
  if (!summaryEl) {
    return;
  }
  const frequency = triggerCalendarState.frequency || getTriggerFrequencyValue() || '';
  if (!frequency) {
    summaryEl.textContent = '';
    summaryEl.classList.add('ai-hidden');
    return;
  }
  const fromInput = document.getElementById('triggerDateFrom');
  const startReference =
    triggerCalendarState.selectedDates && triggerCalendarState.selectedDates.length
      ? triggerCalendarState.selectedDates[0]
      : fromInput && fromInput.value
      ? fromInput.value
      : '';
  let message = '';
  if (frequency === 'custom') {
    const selectedSummary = buildTriggerSelectedDatesSummary();
    if (selectedSummary) {
      const limit = triggerCalendarState.selectionLimit;
      if (limit > 0) {
        message =
          'Fechas seleccionadas (' + triggerCalendarState.selectedDates.length + '/' + limit + '): ' + selectedSummary;
      } else {
        message = 'Fechas seleccionadas: ' + selectedSummary;
      }
    } else {
      const limit = triggerCalendarState.selectionLimit;
      message = limit > 0 ? 'Seleccioná ' + limit + ' fechas en el calendario.' : 'Indicá cuántas repeticiones necesitas.';
    }
  } else if (frequency === 'weekly') {
    if (typeof triggerCalendarState.weeklyDay === 'number') {
      message = 'Ejecuta los ' + TRIGGER_WEEKDAY_LABELS[triggerCalendarState.weeklyDay] + ' de cada semana';
      if (startReference) {
        message += ' desde ' + startReference;
      }
      message += '.';
    } else {
      message = 'Elegí un día de la semana para programar el trigger.';
    }
  } else if (frequency === 'biweekly') {
    if (startReference) {
      message = 'Se ejecuta cada 15 días desde ' + startReference + '.';
    } else {
      message = 'Seleccioná una fecha para comenzar la ejecución quincenal.';
    }
  } else if (frequency === 'monthly') {
    if (startReference) {
      message = 'Se ejecuta cada 30 días desde ' + startReference + '.';
    } else {
      message = 'Seleccioná una fecha para iniciar la ejecución mensual.';
    }
  } else {
    message = '';
  }
  if (message) {
    summaryEl.textContent = message;
    summaryEl.classList.remove('ai-hidden');
  } else {
    summaryEl.textContent = '';
    summaryEl.classList.add('ai-hidden');
  }
}

function isTriggerScheduleReady(frequency) {
  switch (frequency) {
    case 'once':
    case 'daily':
    case 'biweekly':
    case 'monthly':
      return triggerCalendarState.selectedDates && triggerCalendarState.selectedDates.length > 0;
    case 'custom': {
      const limit = triggerCalendarState.selectionLimit;
      if (limit > 0) {
        return (
          triggerCalendarState.selectedDates &&
          triggerCalendarState.selectedDates.length === limit
        );
      }
      return triggerCalendarState.selectedDates && triggerCalendarState.selectedDates.length > 0;
    }
    case 'weekly':
      return typeof triggerCalendarState.weeklyDay === 'number';
    default:
      return !!frequency;
  }
}

function renderTriggerCalendar() {
  const calendar = document.getElementById('triggerStartCalendar');
  const monthSelect = document.getElementById('triggerCalendarMonth');
  const yearSelect = document.getElementById('triggerCalendarYear');
  const daysContainer = document.getElementById('triggerCalendarDays');
  if (!calendar || !monthSelect || !yearSelect || !daysContainer) {
    return;
  }
  ensureTriggerCalendarDefaults();
  updateTriggerCalendarSelectionLimit();
  const state = triggerCalendarState;
  const trimmed = trimTriggerSelectedDates();
  if (trimmed) {
    syncTriggerSelectedInputs();
    updateTriggerScheduleSummary();
    updateTriggerFormState();
  }
  const todayParts = refreshTriggerTodayParts();
  populateTriggerCalendarMonthOptions(monthSelect);
  populateTriggerCalendarYearOptions(yearSelect, state.activeYear);
  monthSelect.value = String(state.activeMonth);
  yearSelect.value = String(state.activeYear);

  let frequency = state.frequency || getTriggerFrequencyValue() || '';
  const isFrequencyDisabled = !frequency;
  if (!frequency) {
    frequency = 'once';
  }
  const firstOfMonth = new Date(state.activeYear, state.activeMonth, 1);
  let startWeekday = firstOfMonth.getDay();
  startWeekday = (startWeekday + 6) % 7;
  const daysInMonth = new Date(state.activeYear, state.activeMonth + 1, 0).getDate();
  const selectedDates = Array.isArray(state.selectedDates) ? state.selectedDates.slice() : [];
  const selectedSet = isFrequencyDisabled ? new Set() : new Set(selectedDates);
  if (!isFrequencyDisabled && state.selectedDate && !selectedSet.has(state.selectedDate)) {
    selectedSet.add(state.selectedDate);
  }
  const fromInput = document.getElementById('triggerDateFrom');
  const toInput = document.getElementById('triggerDateTo');
  const startValue = isFrequencyDisabled ? '' : fromInput && fromInput.value ? fromInput.value : '';
  const startParts = startValue ? parseTriggerDateString(startValue) : null;
  const anchorValue =
    isFrequencyDisabled
      ? ''
      : state.selectedDates && state.selectedDates.length
      ? state.selectedDates[0]
      : state.selectedDate || '';
  const anchorParts = anchorValue ? parseTriggerDateString(anchorValue) : null;
  const effectiveStartParts = startParts || anchorParts;
  const effectiveStartTime = effectiveStartParts && effectiveStartParts.date ? effectiveStartParts.date.getTime() : NaN;
  const endParts = toInput && !toInput.disabled && toInput.value ? parseTriggerDateString(toInput.value) : null;
  const endTime = endParts && endParts.date ? endParts.date.getTime() : NaN;

  function isWithinWindow(time) {
    if (!isNaN(effectiveStartTime) && time < effectiveStartTime) {
      return false;
    }
    if (!isNaN(endTime) && time > endTime) {
      return false;
    }
    return true;
  }

  daysContainer.innerHTML = '';
  for (let fillerIndex = 0; fillerIndex < startWeekday; fillerIndex++) {
    const filler = document.createElement('span');
    filler.className = 'tc-trigger-calendar-day is-placeholder';
    filler.setAttribute('aria-hidden', 'true');
    daysContainer.appendChild(filler);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const dateString = formatTriggerDateParts(state.activeYear, state.activeMonth, day);
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = String(day);
    button.dataset.date = dateString;
    button.setAttribute('role', 'gridcell');
    button.setAttribute('aria-label', day + ' de ' + TRIGGER_CALENDAR_MONTH_NAMES[state.activeMonth] + ' de ' + state.activeYear);

    const classes = ['tc-trigger-calendar-day'];
    const currentParts = {
      year: state.activeYear,
      month: state.activeMonth,
      day: day,
      date: new Date(state.activeYear, state.activeMonth, day)
    };
    const currentTime = currentParts.date.getTime();
    const todayTime = new Date(todayParts.year, todayParts.month, todayParts.day).getTime();
    if (currentTime === todayTime) {
      classes.push('is-today');
    }
    const isPast = currentTime < todayTime;

    const weekdayIndex = (currentParts.date.getDay() + 6) % 7;
    const isSelected = selectedSet.has(dateString);
    let isScheduled = false;
    let isAnchor = false;

    if (anchorParts && anchorParts.date && currentTime === anchorParts.date.getTime()) {
      isAnchor = true;
    }

    switch (frequency) {
      case 'once':
        isScheduled = isSelected;
        break;
      case 'daily':
        if (!isNaN(effectiveStartTime) && currentTime >= effectiveStartTime && isWithinWindow(currentTime)) {
          isScheduled = true;
        }
        break;
      case 'custom':
        isScheduled = isSelected;
        break;
      case 'weekly':
        if (typeof state.weeklyDay === 'number' && weekdayIndex === state.weeklyDay && isWithinWindow(currentTime)) {
          isScheduled = true;
        }
        break;
      case 'biweekly':
        if (isBiweeklyScheduledDate(anchorParts, effectiveStartTime, currentParts, isWithinWindow)) {
          isScheduled = true;
        }
        break;
      case 'monthly':
        if (!isNaN(effectiveStartTime) && currentTime >= effectiveStartTime && isWithinWindow(currentTime)) {
          const diffDays = Math.round((currentTime - effectiveStartTime) / TRIGGER_SCHEDULE_DAY_MS);
          if (diffDays % 30 === 0) {
            isScheduled = true;
          }
        }
        break;
      default:
        isScheduled = isSelected;
        break;
    }

    if (isScheduled) {
      classes.push('is-scheduled');
    }
    if (isSelected) {
      classes.push('is-selected');
    }
    if (isAnchor && classes.indexOf('is-anchor') === -1) {
      classes.push('is-anchor');
    }
    if (isPast) {
      classes.push('is-disabled');
    }
    const shouldDisable = isFrequencyDisabled || isPast;
    if (shouldDisable) {
      button.disabled = true;
      button.setAttribute('aria-disabled', 'true');
    } else {
      button.disabled = false;
      button.removeAttribute('aria-disabled');
    }
    button.className = classes.join(' ');
    const pressed = isSelected || isScheduled;
    button.setAttribute('aria-pressed', pressed ? 'true' : 'false');
    button.setAttribute('aria-selected', pressed ? 'true' : 'false');
    daysContainer.appendChild(button);
  }
  applyTriggerTimeConstraints();
}

function applyTriggerDateSelection(dateString, options) {
  const frequency = triggerCalendarState.frequency || getTriggerFrequencyValue() || '';
  if (!frequency) {
    return;
  }
  if (!dateString) {
    if (frequency === 'custom' || frequency === 'weekly') {
      setTriggerSelectedDates([], { skipFrom: true });
      if (frequency === 'weekly') {
        triggerCalendarState.weeklyDay = null;
        updateTriggerWeeklyButtons();
      }
    } else {
      setTriggerSingleDate('', options);
    }
    renderTriggerCalendar();
    updateTriggerScheduleSummary();
    updateTriggerFormState();
    return;
  }

  const parsed = parseTriggerDateString(dateString);
  if (!parsed) {
    return;
  }
  if (isTriggerDateInPast(parsed)) {
    return;
  }

  triggerCalendarState.activeYear = parsed.year;
  triggerCalendarState.activeMonth = parsed.month;

  if (frequency === 'custom') {
    toggleTriggerCustomDate(dateString);
  } else if (frequency === 'weekly') {
    const weekday = (parsed.date.getDay() + 6) % 7;
    const fromInput = document.getElementById('triggerDateFrom');
    if (fromInput) {
      fromInput.value = dateString;
    }
    setTriggerWeeklyDay(weekday, { anchorDate: dateString, preserveAnchor: true });
  } else if (frequency === 'biweekly' || frequency === 'monthly') {
    const fromInput = document.getElementById('triggerDateFrom');
    if (fromInput) {
      fromInput.value = dateString;
    }
    setTriggerSingleDate(dateString, { skipFrom: true });
  } else {
    setTriggerSingleDate(dateString, options);
  }

  updateTriggerCalendarSelectionLimit();
  renderTriggerCalendar();
  updateTriggerScheduleSummary();
  updateTriggerFormState();
}

function handleTriggerCalendarMonthChange(event) {
  const value = event && event.target ? parseInt(event.target.value, 10) : NaN;
  if (isNaN(value)) {
    return;
  }
  triggerCalendarState.activeMonth = value;
  renderTriggerCalendar();
}

function handleTriggerCalendarYearChange(event) {
  const value = event && event.target ? parseInt(event.target.value, 10) : NaN;
  if (isNaN(value)) {
    return;
  }
  triggerCalendarState.activeYear = value;
  populateTriggerCalendarYearOptions(event.target, value);
  renderTriggerCalendar();
}

function handleTriggerCalendarNav(direction) {
  ensureTriggerCalendarDefaults();
  let month = triggerCalendarState.activeMonth;
  let year = triggerCalendarState.activeYear;
  month += direction;
  if (month < 0) {
    month = 11;
    year -= 1;
  } else if (month > 11) {
    month = 0;
    year += 1;
  }
  triggerCalendarState.activeMonth = month;
  triggerCalendarState.activeYear = year;
  renderTriggerCalendar();
}

function handleTriggerCalendarDayClick(event) {
  const target = event && event.target ? event.target : null;
  if (
    !target ||
    !target.classList ||
    !target.classList.contains('tc-trigger-calendar-day') ||
    target.classList.contains('is-placeholder')
  ) {
    return;
  }
  if (!isTriggerSectionEnabled() || target.disabled || target.getAttribute('aria-disabled') === 'true') {
    return;
  }
  const dateString = target.getAttribute('data-date');
  if (!dateString) {
    return;
  }
  applyTriggerDateSelection(dateString);
}

function handleTriggerDateFromChange() {
  const fromInput = document.getElementById('triggerDateFrom');
  if (!fromInput) {
    return;
  }
  if (!isTriggerSectionEnabled()) {
    return;
  }
  if (fromInput.value && isTriggerDateStringInPast(fromInput.value)) {
    fromInput.value = getTriggerTodayDateString();
  }
  const value = fromInput.value || '';
  const frequency = triggerCalendarState.frequency || getTriggerFrequencyValue() || '';
  if (!frequency) {
    return;
  }
  if (frequency === 'once' || frequency === 'daily' || frequency === 'biweekly' || frequency === 'monthly') {
    setTriggerSingleDate(value, { skipFrom: true });
  } else if (frequency === 'weekly') {
    if (value) {
      const parsed = parseTriggerDateString(value);
      if (parsed && parsed.date) {
        const weekday = (parsed.date.getDay() + 6) % 7;
        setTriggerWeeklyDay(weekday, { anchorDate: value, preserveAnchor: true });
      } else {
        setTriggerSelectedDates([value], { skipFrom: true });
        updateTriggerWeeklyButtons();
        updateTriggerScheduleSummary();
        updateTriggerFormState();
      }
    } else {
      setTriggerSelectedDates([], { skipFrom: true });
      setTriggerWeeklyDay(null);
    }
  }
  renderTriggerCalendar();
  updateTriggerScheduleSummary();
  updateTriggerFormState();
}

function handleTriggerDateToChange() {
  const fromInput = document.getElementById('triggerDateFrom');
  const toInput = document.getElementById('triggerDateTo');
  if (!toInput) {
    return;
  }
  if (!isTriggerSectionEnabled()) {
    return;
  }
  const frequency = triggerCalendarState.frequency || getTriggerFrequencyValue() || '';
  if (!frequency) {
    return;
  }
  if (toInput.disabled) {
    renderTriggerCalendar();
    return;
  }
  const toValue = toInput.value || '';
  const fromValue = fromInput && fromInput.value ? fromInput.value : '';
  if (toValue && fromValue && toValue < fromValue) {
    toInput.value = fromValue;
  }
  renderTriggerCalendar();
  updateTriggerScheduleSummary();
}

function handleTriggerWeeklyOptionClick(event) {
  const target = event && event.target ? event.target : null;
  if (!target || !target.classList || !target.classList.contains('tc-trigger-weekly-button')) {
    return;
  }
  const value = target.getAttribute('data-weekday');
  if (value === null || value === undefined) {
    return;
  }
  const dayIndex = parseInt(value, 10);
  if (isNaN(dayIndex)) {
    return;
  }
  const anchorValue =
    triggerCalendarState.selectedDates && triggerCalendarState.selectedDates.length
      ? triggerCalendarState.selectedDates[0]
      : (document.getElementById('triggerDateFrom') || { value: '' }).value || '';
  setTriggerWeeklyDay(dayIndex, { anchorDate: anchorValue });
  renderTriggerCalendar();
}

function handleTriggerBiweeklyInputChange() {
  const day1Input = document.getElementById('triggerBiweeklyDay1');
  const day2Input = document.getElementById('triggerBiweeklyDay2');
  const days = [];
  if (day1Input && day1Input.value) {
    days.push(day1Input.value);
  }
  if (day2Input && day2Input.value) {
    days.push(day2Input.value);
  }
  const anchorValue =
    triggerCalendarState.selectedDates && triggerCalendarState.selectedDates.length
      ? triggerCalendarState.selectedDates[0]
      : (document.getElementById('triggerDateFrom') || { value: '' }).value || '';
  setTriggerBiweeklyDays(days, { anchorDate: anchorValue });
  renderTriggerCalendar();
}

function handleTriggerFrequencyCountInput() {
  const countInput = document.getElementById('triggerFrequencyCount');
  if (countInput && countInput.value) {
    const parsed = parseInt(countInput.value, 10);
    if (!isNaN(parsed) && parsed > 20) {
      countInput.value = '20';
    }
  }
  updateTriggerCalendarSelectionLimit();
  updateTriggerScheduleSummary();
  renderTriggerCalendar();
  updateTriggerFormState();
}

function initializeTriggerCalendar() {
  const calendar = document.getElementById('triggerStartCalendar');
  if (!calendar) {
    return;
  }
  triggerCalendarState.todayParts = getTriggerCalendarTodayParts();
  triggerCalendarState.frequency = getTriggerFrequencyValue() || '';
  const hiddenInput = document.getElementById('triggerStartDate');
  const listInput = document.getElementById('triggerSelectedDates');
  const fromInput = document.getElementById('triggerDateFrom');
  let initialDates = [];
  if (listInput && listInput.value) {
    initialDates = listInput.value
      .split(',')
      .map(function(part) {
        return part.trim();
      })
      .filter(function(part) {
        return !!part;
      });
  }
  if (!initialDates.length) {
    const fallback = hiddenInput && hiddenInput.value ? hiddenInput.value : fromInput && fromInput.value ? fromInput.value : '';
    if (fallback) {
      initialDates = [fallback];
    }
  }
  initialDates = initialDates.filter(function(dateString) {
    return !isTriggerDateStringInPast(dateString);
  });
  setTriggerSelectedDates(initialDates, { skipFrom: true });
  const parsed = initialDates.length ? parseTriggerDateString(initialDates[0]) : null;
  if (parsed) {
    triggerCalendarState.activeYear = parsed.year;
    triggerCalendarState.activeMonth = parsed.month;
  }
  updateTriggerCalendarSelectionLimit();
  updateTriggerWeeklyButtons();
  updateTriggerBiweeklyInputs();
  updateTriggerScheduleSummary();
  const prevBtn = document.getElementById('triggerCalendarPrev');
  const nextBtn = document.getElementById('triggerCalendarNext');
  const monthSelect = document.getElementById('triggerCalendarMonth');
  const yearSelect = document.getElementById('triggerCalendarYear');
  const daysContainer = document.getElementById('triggerCalendarDays');
  if (prevBtn) {
    prevBtn.addEventListener('click', function() {
      handleTriggerCalendarNav(-1);
    });
  }
  if (nextBtn) {
    nextBtn.addEventListener('click', function() {
      handleTriggerCalendarNav(1);
    });
  }
  if (monthSelect) {
    monthSelect.addEventListener('change', handleTriggerCalendarMonthChange);
  }
  if (yearSelect) {
    yearSelect.addEventListener('change', handleTriggerCalendarYearChange);
  }
  if (daysContainer) {
    daysContainer.addEventListener('click', handleTriggerCalendarDayClick);
  }
  if (fromInput) {
    fromInput.addEventListener('change', handleTriggerDateFromChange);
    fromInput.addEventListener('input', handleTriggerDateFromChange);
  }
  const toInput = document.getElementById('triggerDateTo');
  if (toInput) {
    toInput.addEventListener('change', handleTriggerDateToChange);
    toInput.addEventListener('input', handleTriggerDateToChange);
  }
  const weeklyOptions = document.getElementById('triggerWeeklyOptions');
  if (weeklyOptions) {
    weeklyOptions.addEventListener('click', handleTriggerWeeklyOptionClick);
  }
  const biweeklyDay1 = document.getElementById('triggerBiweeklyDay1');
  const biweeklyDay2 = document.getElementById('triggerBiweeklyDay2');
  if (biweeklyDay1) {
    biweeklyDay1.addEventListener('input', handleTriggerBiweeklyInputChange);
    biweeklyDay1.addEventListener('change', handleTriggerBiweeklyInputChange);
  }
  if (biweeklyDay2) {
    biweeklyDay2.addEventListener('input', handleTriggerBiweeklyInputChange);
    biweeklyDay2.addEventListener('change', handleTriggerBiweeklyInputChange);
  }
  renderTriggerCalendar();
}

function getTriggerActionDisplayLabel(action) {
  if (!action) {
    return '';
  }
  const label = action.name ? String(action.name) : 'Favorito sin nombre';
  const typeLabel = typeof getActionTypeLabel === 'function' ? getActionTypeLabel(action.type) : '';
  return typeLabel ? label + ' • ' + typeLabel : label;
}

function buildTriggerActionGroups(actions) {
  const groups = TRIGGER_GROUP_ORDER.map(function(groupDef) {
    return {
      key: groupDef.key,
      label: groupDef.label,
      categories: groupDef.categories.map(function(categoryKey) {
        const categoryDef = TRIGGER_CATEGORY_DEFS[categoryKey];
        return {
          key: categoryKey,
          label: categoryDef ? categoryDef.label : categoryKey,
          items: []
        };
      })
    };
  });
  const categoryIndex = Object.create(null);
  groups.forEach(function(group) {
    group.categories.forEach(function(category) {
      categoryIndex[category.key] = category;
    });
  });
  const map = Object.create(null);
  const list = Array.isArray(actions) ? actions.slice() : [];
  list.forEach(function(action) {
    if (!action || action.id === null || action.id === undefined) {
      return;
    }
    const id = String(action.id);
    if (!id) {
      return;
    }
    const resolvedType =
      typeof resolveFavoriteTypeFromEntry === 'function' ? resolveFavoriteTypeFromEntry(action) : action.type || '';
    const tokenCandidates = collectTriggerTokenCandidates(action);
    const normalizedTokens = tokenCandidates.map(normalizeTriggerSearchText).filter(Boolean);
    const categoryKey = resolveTriggerActionCategoryKey(action, resolvedType, normalizedTokens);
    const category = categoryIndex[categoryKey];
    if (!category) {
      return;
    }
    const label = action.name ? String(action.name) : 'Favorito sin nombre';
    const meta = typeof getActionTypeLabel === 'function' ? getActionTypeLabel(action.type) : '';
    const tooltip = typeof buildSavedActionTooltip === 'function' ? buildSavedActionTooltip(action) : '';
    const displayLabel = getTriggerActionDisplayLabel(action);
    category.items.push({
      value: id,
      label: label,
      meta: meta,
      displayLabel: displayLabel,
      tooltip: tooltip,
      sortLabel: normalizeTriggerSearchText(label),
      action: action
    });
    if (!map[id]) {
      map[id] = {
        action: action,
        displayLabel: displayLabel,
        label: label,
        meta: meta,
        tooltip: tooltip,
        category: categoryKey
      };
    }
  });
  groups.forEach(function(group) {
    group.categories.forEach(function(category) {
      category.items.sort(function(a, b) {
        return a.sortLabel.localeCompare(b.sortLabel);
      });
    });
  });
  return { groups: groups, map: map };
}

function updateTriggerActionSelectionVisual(selectedId) {
  const listElement = document.getElementById('triggerActionList');
  if (!listElement) {
    return;
  }
  const buttons = listElement.querySelectorAll('.ai-multi-item');
  for (let i = 0; i < buttons.length; i++) {
    const button = buttons[i];
    const isSelected = selectedId && button.dataset.value === selectedId;
    if (isSelected) {
      button.classList.add('selected');
      button.setAttribute('aria-checked', 'true');
    } else {
      button.classList.remove('selected');
      button.setAttribute('aria-checked', 'false');
    }
  }
}

function updateTriggerActionToggleLabel(selectedId) {
  const toggleLabel = document.getElementById('triggerActionToggleLabel');
  const picker = document.getElementById('triggerActionPicker');
  if (!toggleLabel || !picker) {
    return;
  }
  if (selectedId && triggerActionMap[selectedId]) {
    const entry = triggerActionMap[selectedId];
    const label = entry.displayLabel || entry.label || 'Favorito seleccionado';
    toggleLabel.textContent = label;
    picker.dataset.empty = 'false';
  } else {
    toggleLabel.textContent = 'Seleccionar...';
  }
}

function handleTriggerActionSelection(value) {
  const hiddenInput = document.getElementById('triggerActionSelect');
  if (!hiddenInput) {
    return;
  }
  const normalizedValue = value === null || value === undefined ? '' : String(value);
  if (!normalizedValue || !triggerActionMap[normalizedValue]) {
    hiddenInput.value = '';
    updateTriggerActionSelectionVisual('');
    updateTriggerActionToggleLabel('');
    closeTriggerActionMenu({ focusToggle: true });
    updateTriggerFormState();
    return;
  }
  hiddenInput.value = normalizedValue;
  updateTriggerActionSelectionVisual(normalizedValue);
  updateTriggerActionToggleLabel(normalizedValue);
  closeTriggerActionMenu({ focusToggle: true });
  updateTriggerFormState();
}

function renderTriggerActionMenu() {
  const listElement = document.getElementById('triggerActionList');
  const picker = document.getElementById('triggerActionPicker');
  const toggle = document.getElementById('triggerActionToggle');
  const toggleLabel = document.getElementById('triggerActionToggleLabel');

      } else {

          item.dataset.label = itemData.displayLabel;

            item.dataset.tooltip = itemData.tooltip;
          }

          }

          check.className = 'ai-check';
          check.setAttribute('aria-hidden', 'true');
          item.appendChild(labelSpan);
          item.appendChild(check);
          item.addEventListener('click', function() {
            handleTriggerActionSelection(itemData.value);
          });

          });

function openTriggerActionMenu() {
  const picker = document.getElementById('triggerActionPicker');
  const toggle = document.getElementById('triggerActionToggle');
  const listElement = document.getElementById('triggerActionList');
  if (!picker || !toggle || !listElement || toggle.disabled) {
    return;
  }
  picker.classList.add('open');
  toggle.setAttribute('aria-expanded', 'true');
  triggerActionMenuOpen = true;
  const selected = listElement.querySelector('.ai-multi-item.selected');
  const focusTarget = selected || listElement.querySelector('.ai-multi-item');
  if (focusTarget) {
    focusTarget.focus();
  }
}

function closeTriggerActionMenu(options) {
  const picker = document.getElementById('triggerActionPicker');
  const toggle = document.getElementById('triggerActionToggle');
  if (!picker || !toggle) {
    triggerActionMenuOpen = false;
    return;
  }
  if (!triggerActionMenuOpen && !picker.classList.contains('open')) {
    return;
  }
  picker.classList.remove('open');
  toggle.setAttribute('aria-expanded', 'false');
  triggerActionMenuOpen = false;
  const opts = options || {};
  if (opts.focusToggle && !toggle.disabled) {
    toggle.focus();
  }
}

function handleTriggerPickerToggle(event) {
  event.preventDefault();
  if (triggerActionMenuOpen) {
    closeTriggerActionMenu();
  } else {
    openTriggerActionMenu();
  }
}

function handleTriggerPickerKeydown(event) {
  const key = event.key;
  if (key === 'ArrowDown' || key === 'ArrowUp') {
    event.preventDefault();
    if (!triggerActionMenuOpen) {
      openTriggerActionMenu();
    }
    const listElement = document.getElementById('triggerActionList');
    if (!listElement) {
      return;
    }
    const items = listElement.querySelectorAll('.ai-multi-item');
    if (!items.length) {
      return;
    }
    const target = key === 'ArrowUp' ? items[items.length - 1] : items[0];
    if (target) {
      target.focus();
    }
    return;
  }
  if (key === 'Enter' || key === ' ') {
    event.preventDefault();
    if (triggerActionMenuOpen) {
      closeTriggerActionMenu();
    } else {
      openTriggerActionMenu();
    }
  }
}

function handleTriggerActionMenuNavigation(event) {
  if (!triggerActionMenuOpen) {
    return;
  }
  const key = event.key;
  if (key === 'Escape') {
    event.preventDefault();
    closeTriggerActionMenu({ focusToggle: true });
    return;
  }
  if (key !== 'ArrowDown' && key !== 'ArrowUp') {
    return;
  }
  const listElement = document.getElementById('triggerActionList');
  if (!listElement) {
    return;
  }
  const items = Array.prototype.slice.call(listElement.querySelectorAll('.ai-multi-item'));
  if (!items.length) {
    return;
  }
  const currentIndex = items.indexOf(document.activeElement);
  let nextIndex = 0;
  if (key === 'ArrowDown') {
    nextIndex = currentIndex === -1 ? 0 : (currentIndex + 1) % items.length;
  } else {
    nextIndex = currentIndex <= 0 ? items.length - 1 : currentIndex - 1;
  }
  const target = items[nextIndex];
  if (target) {
    event.preventDefault();
    target.focus();
  }
}

function handleTriggerActionDocumentClick(event) {
  if (!triggerActionMenuOpen) {
    return;
  }
  const picker = document.getElementById('triggerActionPicker');
  if (!picker) {
    return;
  }
  if (picker.contains(event.target)) {
    return;
  }
  closeTriggerActionMenu();
}

function handleTriggerActionDocumentFocus(event) {
  if (!triggerActionMenuOpen) {
    return;
  }
  const picker = document.getElementById('triggerActionPicker');
  if (!picker) {
    return;
  }
  if (picker.contains(event.target)) {
    return;
  }
  closeTriggerActionMenu();
}

function initializeTriggerActionPicker() {
  if (triggerActionPickerInitialized) {
    return;
  }
  const picker = document.getElementById('triggerActionPicker');
  const toggle = document.getElementById('triggerActionToggle');
  const menu = document.getElementById('triggerActionMenu');
  if (!picker || !toggle || !menu) {
    return;
  }
  triggerActionPickerInitialized = true;
  toggle.addEventListener('click', handleTriggerPickerToggle);
  toggle.addEventListener('keydown', handleTriggerPickerKeydown);
  if (!triggerActionDocumentEventsBound) {
    document.addEventListener('click', handleTriggerActionDocumentClick);
    document.addEventListener('keydown', handleTriggerActionMenuNavigation, true);
    document.addEventListener('focusin', handleTriggerActionDocumentFocus);
    triggerActionDocumentEventsBound = true;
  }
}

function formatTriggerTimeDisplay(value) {
  if (!value) {
    return '--:-- --';
  }
  const parts = String(value).split(':');
  if (parts.length < 2) {
    return '--:-- --';
  }
  let hours = parseInt(parts[0], 10);
  if (isNaN(hours)) {
    return '--:-- --';
  }
  const minutes = parts[1] !== undefined ? parts[1] : '00';
  const period = hours >= 12 ? 'PM' : 'AM';
  hours = hours % 12;
  if (hours === 0) {
    hours = 12;
  }
  const paddedHours = String(hours).padStart(2, '0');
  const paddedMinutes = String(minutes).padStart(2, '0');
  return paddedHours + ':' + paddedMinutes + ' ' + period;
}

function updateTriggerStartTimeDisplay() {
  const startTimeInput = document.getElementById('triggerStartTime');
  const display = document.getElementById('triggerStartTimeDisplay');
  if (!display) {

  }
  const value = startTimeInput && startTimeInput.value ? startTimeInput.value : '';
  if (value) {
    display.textContent = formatTriggerTimeDisplay(value);
    display.setAttribute('data-state', 'filled');
  } else {
    display.textContent = '--:-- --';
    display.setAttribute('data-state', 'empty');
  }
}

function parseTriggerTimeValue(value) {
  if (!value) {
    return null;
  }
  const match = /^([0-2]?\d):([0-5]\d)$/.exec(String(value).trim());
  if (!match) {
    return null;
  }
  const hour = parseInt(match[1], 10);
  const minute = parseInt(match[2], 10);
  if (isNaN(hour) || isNaN(minute)) {
    return null;
  }
  if (hour < 0 || hour > 23 || minute < 0 || minute > 59) {
    return null;
  }
  return { hour: hour, minute: minute };
}

function getTriggerTimeSelectionParts(value) {
  const parsed = parseTriggerTimeValue(value) || parseTriggerTimeValue(getCurrentTimeValue());
  if (!parsed) {
    return {
      hour: '12',
      minute: '00',
      period: 'AM'
    };
  }
  let hour = parsed.hour;
  const minute = parsed.minute;
  const period = hour >= 12 ? 'PM' : 'AM';
  hour = hour % 12;
  if (hour === 0) {
    hour = 12;
  }
  return {
    hour: String(hour).padStart(2, '0'),
    minute: String(minute).padStart(2, '0'),
    period: period
  };
}

function buildTriggerTimeValue(hourString, minuteString, period) {
  let hour = parseInt(hourString, 10);
  const minute = parseInt(minuteString, 10);
  if (isNaN(hour) || isNaN(minute)) {
    return '';
  }
  if (hour < 1) {
    hour = 1;
  }
  if (hour > 12) {
    hour = hour % 12;
    if (hour === 0) {
      hour = 12;
    }
  }
  let normalizedHour = hour;
  if (period === 'PM' && hour < 12) {
    normalizedHour = hour + 12;
  } else if (period === 'AM' && hour === 12) {
    normalizedHour = 0;
  }
  const clampedMinute = Math.max(0, Math.min(59, minute));
  return String(normalizedHour).padStart(2, '0') + ':' + String(clampedMinute).padStart(2, '0');
}

function updateTriggerFormState() {
  const actionInput = document.getElementById('triggerActionSelect');
  const frequencySelect = document.getElementById('triggerFrequencySelect');
  const countInput = document.getElementById('triggerFrequencyCount');

    createBtn.setAttribute('aria-disabled', 'true');
    return;
  }
  const actionReady = !!(actionInput && actionInput.value);
  const frequencyValue = frequencySelect ? frequencySelect.value : '';
  let frequencyReady = !!frequencyValue;
  if (frequencyValue === 'custom') {
    const parsed = countInput && countInput.value ? parseInt(countInput.value, 10) : NaN;
    frequencyReady = !isNaN(parsed) && parsed > 0;
  }
  const scheduleReady = frequencyReady
    ? isTriggerScheduleReady(frequencyValue || triggerCalendarState.frequency || '')
    : false;
  createBtn.disabled = !(actionReady && frequencyReady && scheduleReady);
  createBtn.setAttribute('aria-disabled', createBtn.disabled ? 'true' : 'false');
}

function getTriggerScheduleData() {
  const frequencySelect = document.getElementById('triggerFrequencySelect');
  const fromInput = document.getElementById('triggerDateFrom');
  const toInput = document.getElementById('triggerDateTo');
  const countInput = document.getElementById('triggerFrequencyCount');
  const startTimeInput = document.getElementById('triggerStartTime');
  const frequency = frequencySelect ? frequencySelect.value || '' : '';
  const data = {
    frequency: frequency,
    selectedDates: triggerCalendarState.selectedDates
      ? triggerCalendarState.selectedDates.slice().sort()
      : [],
    startDate: '',
    endDate: '',
    weeklyDay: triggerCalendarState.weeklyDay,
    biweeklyDays: triggerCalendarState.biweeklyDays ? triggerCalendarState.biweeklyDays.slice() : [],
    customCount: countInput && countInput.value ? parseInt(countInput.value, 10) : 0,
    startTime: startTimeInput && startTimeInput.value ? startTimeInput.value : ''
  };
  switch (frequency) {
    case 'once':
    case 'daily':
    case 'biweekly':
    case 'monthly':
      data.startDate = data.selectedDates.length ? data.selectedDates[0] : '';
      break;
    case 'custom':
      data.startDate = data.selectedDates.length ? data.selectedDates[0] : '';
      if (triggerCalendarState.selectionLimit > 0) {
        data.customCount = triggerCalendarState.selectionLimit;
      }
      break;
    case 'weekly':
      data.startDate = fromInput && fromInput.value ? fromInput.value : data.selectedDates.length ? data.selectedDates[0] : '';
      break;
    default:
      data.startDate = fromInput && fromInput.value ? fromInput.value : data.selectedDates.length ? data.selectedDates[0] : '';
  }
  if (toInput && !toInput.disabled && toInput.value) {
    data.endDate = toInput.value;
  }
  if (isNaN(data.customCount)) {
    data.customCount = 0;
  }
  return data;
}

function buildTriggerTitle(actionLabel, frequencyLabel) {
  const parts = [];
  if (frequencyLabel) {
    parts.push(frequencyLabel);
  }
  if (actionLabel) {
    parts.push(actionLabel);
  }
  return parts.length ? parts.join(' • ') : 'Trigger programado';
}

function buildTriggerScheduleSummary(scheduleData) {
  if (!scheduleData) {
    return 'Inicio: Al guardar';
  }
  const segments = [];
  const frequency = scheduleData.frequency || '';
  switch (frequency) {
    case 'once':
      if (scheduleData.startDate) {
        segments.push('Fecha ' + scheduleData.startDate);
      }
      break;
    case 'daily':
      if (scheduleData.startDate) {
        segments.push('Desde ' + scheduleData.startDate);
      }
      if (scheduleData.endDate) {
        segments.push('Hasta ' + scheduleData.endDate);
      }
      break;
    case 'custom':
      if (scheduleData.selectedDates && scheduleData.selectedDates.length) {
        segments.push('Fechas: ' + scheduleData.selectedDates.join(', '));
      }
      break;
    case 'weekly':
      if (typeof scheduleData.weeklyDay === 'number') {
        segments.push('Día ' + TRIGGER_WEEKDAY_LABELS[scheduleData.weeklyDay] + ' de cada semana');
      }
      if (scheduleData.startDate) {
        segments.push('Desde ' + scheduleData.startDate);
      }
      if (scheduleData.endDate) {
        segments.push('Hasta ' + scheduleData.endDate);
      }
      break;
    case 'biweekly':
      if (scheduleData.startDate) {
        segments.push('Cada 15 días desde ' + scheduleData.startDate);
      }
      if (scheduleData.endDate) {
        segments.push('Hasta ' + scheduleData.endDate);
      }
      break;
    case 'monthly': {
      if (scheduleData.startDate) {
        segments.push('Cada 30 días desde ' + scheduleData.startDate);
      }
      if (scheduleData.endDate) {
        segments.push('Hasta ' + scheduleData.endDate);
      }
      break;
    }
    default:
      if (scheduleData.startDate) {
        segments.push('Desde ' + scheduleData.startDate);
      }
      if (scheduleData.endDate) {
        segments.push('Hasta ' + scheduleData.endDate);
      }
  }
  if (scheduleData.startTime) {
    segments.push('Hora ' + scheduleData.startTime);
  }
  if (!segments.length) {
    return 'Inicio: Al guardar';
  }
  return 'Programación: ' + segments.join(' • ');
}

function handleTriggerCreate() {
  const actionInput = document.getElementById('triggerActionSelect');
  const frequencySelect = document.getElementById('triggerFrequencySelect');
  if (!actionInput || !frequencySelect) {
    return;
  }
  if (!isTriggerSectionEnabled()) {
    return;
  }
  applyTriggerTimeConstraints();
  const actionId = actionInput.value;
  const frequency = frequencySelect.value;
  if (!actionId || !frequency) {
    showMessageModal('Seleccioná un favorito y una frecuencia para guardar el trigger.', {
      title: 'Datos incompletos',
      variant: 'warning'
    });
    return;
  }
  let customCount = 0;
  if (frequency === 'custom') {
    const parsed = triggerCalendarState.selectionLimit;
    if (!parsed || parsed <= 0) {
      showMessageModal('Indicá cuántas veces querés ejecutar el trigger.', {
        title: 'Falta indicar repeticiones',
        variant: 'warning'
      });
      return;
    }
    customCount = parsed;
  }
  if (!isTriggerScheduleReady(frequency)) {
    showMessageModal('Configurá la programación del calendario antes de guardar el trigger.', {
      title: 'Falta definir la programación',
      variant: 'warning'
    });
    return;
  }
  const actionEntry = triggerActionMap[actionId];
  const actionLabel = actionEntry ? actionEntry.displayLabel || actionEntry.label : '';
  const scheduleData = getTriggerScheduleData();
  const frequencyLabel = getTriggerFrequencyLabel(frequency, { count: customCount || scheduleData.customCount });
  const entrySchedule = Object.assign({}, scheduleData, {
    customCount: frequency === 'custom' ? (customCount || scheduleData.customCount) : 0
  });
  const entry = {
    id: 'localTrigger:' + ++triggerIdCounter,
    actionId: actionId,
    actionLabel: actionLabel,
    frequency: frequency,
    frequencyLabel: frequencyLabel,
    customCount: entrySchedule.customCount,
    startDate: entrySchedule.startDate,
    endDate: entrySchedule.endDate,
    startTime: entrySchedule.startTime,
    selectedDates: entrySchedule.selectedDates,
    weeklyDay: entrySchedule.weeklyDay,
    biweeklyDays: entrySchedule.biweeklyDays,
    schedule: entrySchedule,
    startsAtLabel: buildTriggerScheduleSummary(entrySchedule),
    title: buildTriggerTitle(actionLabel, frequencyLabel)
  };
  triggerEntries.push(entry);
  renderTriggerList();
  showMessageModal('Trigger guardado. Puedes editarlo cuando conectemos el programador.', {
    title: 'Trigger registrado',
    variant: 'success'
  });
}

function applyTriggerSectionState() {
  const toggle = document.getElementById('triggerSectionToggle');
  const fieldset = document.getElementById('triggerSectionFieldset');
  const card = document.getElementById('triggerSectionCard');
  const startTimeControl = document.getElementById('triggerStartTimeControl');
  const enabled = !toggle || toggle.checked;

  if (card) {
    if (enabled) {
      card.classList.remove('is-inactive');
    } else {
      card.classList.add('is-inactive');
    }
  }

  if (fieldset) {
    fieldset.disabled = !enabled;
    if (enabled) {
      fieldset.classList.remove('is-collapsed');
      fieldset.removeAttribute('aria-hidden');
    } else {
      fieldset.classList.add('is-collapsed');
      fieldset.setAttribute('aria-hidden', 'true');
    }
  }

  if (!enabled) {
    if (startTimeControl) {
      startTimeControl.setAttribute('aria-disabled', 'true');
      startTimeControl.classList.remove('is-editing');
      startTimeControl.removeAttribute('data-editing');
      startTimeControl.setAttribute('aria-expanded', 'false');
      if (typeof startTimeControl.__triggerTimeClose === 'function') {
        try {
          startTimeControl.__triggerTimeClose({ restoreFocus: false });
        } catch (err) {
          // ignore close errors
        }
      }
    }
    closeTriggerActionMenu({ focusToggle: false });
    applyTriggerTimeConstraints();
    updateTriggerFormState();
    return;
  }

  if (startTimeControl && !startTimeControl.classList.contains('ai-hidden')) {
    startTimeControl.removeAttribute('aria-disabled');
    if (typeof startTimeControl.__triggerTimeSync === 'function') {
      try {
        startTimeControl.__triggerTimeSync();
      } catch (err) {
        // ignore sync errors
      }
    }
  }

  updateTriggerFrequencyFields();
  applyTriggerTimeConstraints();
  updateTriggerStartTimeDisplay();
  updateTriggerFormState();
}

document.addEventListener('DOMContentLoaded', function() {
  initializeTriggerActionPicker();
  initializeTriggerCalendar();
  const frequencySelect = document.getElementById('triggerFrequencySelect');
  const countInput = document.getElementById('triggerFrequencyCount');
  const createBtn = document.getElementById('triggerCreateBtn');
  const refreshBtn = document.getElementById('triggerRefreshBtn');
  const startTimeInput = document.getElementById('triggerStartTime');
  const startTimeControl = document.getElementById('triggerStartTimeControl');
  const sectionToggle = document.getElementById('triggerSectionToggle');

  if (frequencySelect) {
    frequencySelect.addEventListener('change', updateTriggerFrequencyFields);
  }
  if (countInput) {
    countInput.addEventListener('input', handleTriggerFrequencyCountInput);
    countInput.addEventListener('change', handleTriggerFrequencyCountInput);
  }
  if (createBtn) {
    createBtn.addEventListener('click', handleTriggerCreate);
  }
  if (refreshBtn) {
    refreshBtn.addEventListener('click', function() {
      renderTriggerList();
    });
  }
  if (startTimeInput) {
    const startTimeEditBtn = document.getElementById('triggerStartTimeEditBtn');
    const timePopover = document.getElementById('triggerStartTimePopover');
    const hourSelect = document.getElementById('triggerStartTimeHour');
    const minuteSelect = document.getElementById('triggerStartTimeMinute');
    const periodSelect = document.getElementById('triggerStartTimePeriod');
    let isTimePopoverOpen = false;
    if (!startTimeInput.value) {
      startTimeInput.value = getCurrentTimeValue();
    }
    updateTriggerStartTimeDisplay();
    applyTriggerTimeConstraints();
    const ensureTimeSelectOptions = function() {
      if (hourSelect && hourSelect.options.length === 0) {
        for (let hour = 1; hour <= 12; hour++) {
          const option = document.createElement('option');
          const value = String(hour).padStart(2, '0');
          option.value = value;
          option.textContent = value;
          hourSelect.appendChild(option);
        }
      }
      if (minuteSelect && minuteSelect.options.length === 0) {
        for (let minute = 0; minute < 60; minute++) {
          const option = document.createElement('option');
          const value = String(minute).padStart(2, '0');
          option.value = value;
          option.textContent = value;
          minuteSelect.appendChild(option);
        }
      }
      if (periodSelect && periodSelect.options.length === 0) {
        ['AM', 'PM'].forEach(function(period) {
          const option = document.createElement('option');
          option.value = period;
          option.textContent = period;
          periodSelect.appendChild(option);
        });
      }
    };
    const syncTimeSelectsToValue = function() {
      ensureTimeSelectOptions();
      const parts = getTriggerTimeSelectionParts(startTimeInput.value);
      if (hourSelect) {
        hourSelect.value = parts.hour;
      }
      if (minuteSelect) {
        minuteSelect.value = parts.minute;
      }
      if (periodSelect) {
        periodSelect.value = parts.period;
      }
    };
    const focusTimeSelect = function(targetElement) {
      const element = targetElement || hourSelect;
      if (!element) {
        return;
      }
      try {
        element.focus({ preventScroll: true });
      } catch (err) {
        element.focus();
      }
    };
    const commitTimeFromSelects = function() {
      ensureTimeSelectOptions();
      const hourValue = hourSelect ? hourSelect.value : '12';
      const minuteValue = minuteSelect ? minuteSelect.value : '00';
      const periodValue = periodSelect ? periodSelect.value : 'AM';
      const newValue = buildTriggerTimeValue(hourValue, minuteValue, periodValue);
      if (!newValue || newValue === startTimeInput.value) {
        updateTriggerStartTimeDisplay();
        return;
      }
      startTimeInput.value = newValue;
      startTimeInput.dispatchEvent(new Event('input', { bubbles: true }));
      startTimeInput.dispatchEvent(new Event('change', { bubbles: true }));
    };
    const handleDocumentPointerDown = function(event) {
      if (!startTimeControl) {
        return;
      }
      const target = event && event.target ? event.target : null;
      if (target && startTimeControl.contains(target)) {
        return;
      }
      closeTimePopover({ restoreFocus: false });
    };
    const handleDocumentKeyDown = function(event) {
      if (!isTimePopoverOpen) {
        return;
      }
      if (event.key === 'Escape' || event.key === 'Esc') {
        event.preventDefault();
        closeTimePopover({ restoreFocus: true });
      }
    };
    const closeTimePopover = function(options) {
      if (!isTimePopoverOpen) {
        return;
      }
      const opts = options || {};
      if (timePopover) {
        timePopover.setAttribute('aria-hidden', 'true');
      }
      if (startTimeControl) {
        startTimeControl.classList.remove('is-popover-open');
        startTimeControl.setAttribute('aria-expanded', 'false');
      }
      document.removeEventListener('pointerdown', handleDocumentPointerDown, true);
      document.removeEventListener('keydown', handleDocumentKeyDown, true);
      isTimePopoverOpen = false;
      if (opts.restoreFocus && startTimeControl) {
        try {
          startTimeControl.focus({ preventScroll: true });
        } catch (err) {
          startTimeControl.focus();
        }
      }
    };
    const openTimePopover = function(options) {
      if (startTimeInput.disabled) {
        return;
      }
      ensureTimeSelectOptions();
      syncTimeSelectsToValue();
      if (timePopover) {
        timePopover.setAttribute('aria-hidden', 'false');
      }
      if (startTimeControl) {
        startTimeControl.classList.add('is-popover-open');
        startTimeControl.setAttribute('aria-expanded', 'true');
      }
      if (!isTimePopoverOpen) {
        document.addEventListener('pointerdown', handleDocumentPointerDown, true);
        document.addEventListener('keydown', handleDocumentKeyDown, true);
      }
      isTimePopoverOpen = true;
      const opts = options || {};
      const focusTarget = opts.focusTarget || hourSelect;
      requestAnimationFrame(function() {
        focusTimeSelect(focusTarget);
      });
    };
    const handleSelectInteraction = function(event) {
      if (!event) {
        return;
      }
      if (event.type === 'keydown') {
        if (event.key === 'Escape' || event.key === 'Esc') {
          event.preventDefault();
          closeTimePopover({ restoreFocus: true });
          return;
        }
        if (event.key === 'Enter') {
          event.preventDefault();
          commitTimeFromSelects();
          closeTimePopover({ restoreFocus: true });
          return;
        }
      }
      if (event.type === 'change' || event.type === 'input') {
        commitTimeFromSelects();
      }
    };
    [hourSelect, minuteSelect, periodSelect].forEach(function(select) {
      if (!select) {
        return;
      }
      select.addEventListener('change', handleSelectInteraction);
      select.addEventListener('input', handleSelectInteraction);
      select.addEventListener('keydown', handleSelectInteraction);
    });
    if (startTimeControl) {
      startTimeControl.addEventListener('click', function(event) {
        if (startTimeInput.disabled) {
          return;
        }
        if (timePopover && timePopover.contains(event.target)) {
          return;
        }
        openTimePopover({ focusTarget: hourSelect });
      });
      startTimeControl.addEventListener('keydown', function(event) {
        if (startTimeInput.disabled) {
          return;
        }
        if (event.key === ' ' || event.key === 'Spacebar' || event.key === 'Enter' || event.key === 'ArrowDown') {
          event.preventDefault();
          openTimePopover({ focusTarget: hourSelect });
        }
        if ((event.key === 'Escape' || event.key === 'Esc') && isTimePopoverOpen) {
          event.preventDefault();
          closeTimePopover({ restoreFocus: true });
        }
      });
    }
    if (startTimeEditBtn) {
      startTimeEditBtn.addEventListener('click', function(event) {
        if (event) {
          event.preventDefault();
          event.stopPropagation();
        }
        if (startTimeInput.disabled) {
          return;
        }
        openTimePopover({ focusTarget: hourSelect });
      });
    }
    if (startTimeControl) {
      startTimeControl.__triggerTimeClose = function(opts) {
        closeTimePopover(opts || {});
      };
      startTimeControl.__triggerTimeSync = function() {
        if (isTimePopoverOpen) {
          syncTimeSelectsToValue();
        }
      };
    }
    const handleTimeChange = function() {
      const adjusted = applyTriggerTimeConstraints();
      if (!adjusted) {
        updateTriggerStartTimeDisplay();
      }
      if (startTimeControl && typeof startTimeControl.__triggerTimeSync === 'function') {
        try {
          startTimeControl.__triggerTimeSync();
        } catch (err) {
          // ignore sync errors
        }
      }
      updateTriggerFormState();
    };
    startTimeInput.addEventListener('input', handleTimeChange);
    startTimeInput.addEventListener('change', handleTimeChange);
  }
  if (sectionToggle) {
    sectionToggle.addEventListener('change', function() {
      applyTriggerSectionState();
    });
  }
  document.addEventListener('keydown', function(event) {
    if (
      event.altKey &&
      !event.ctrlKey &&
      !event.metaKey &&
      !event.shiftKey &&
      event.key &&
      event.key.toLowerCase() === 'g'
    ) {
      const targetBtn = document.getElementById('triggerCreateBtn');
      if (targetBtn && !targetBtn.disabled) {
        event.preventDefault();
        targetBtn.click();
      }
    }
  });

  document.addEventListener('tc:savedActionsUpdated', function(event) {
    const actions = event && event.detail && Array.isArray(event.detail.actions) ? event.detail.actions : [];
    populateTriggerActionSelect(actions);
  });

  if (typeof getSavedActionsSnapshot === 'function') {
    populateTriggerActionSelect(getSavedActionsSnapshot());
  }
  if (typeof ensureSavedActionsCache === 'function') {
    ensureSavedActionsCache().catch(function() {
      populateTriggerActionSelect([]);
    });
  }

  applyTriggerSectionState();
  updateTriggerStartTimeDisplay();
  renderTriggerList();
});

const TableCrafterTriggersTab = Object.freeze({
  renderList: renderTriggerList,
  updateFormState: updateTriggerFormState,
  createTrigger: handleTriggerCreate
});

window.TableCrafterTriggersTab = TableCrafterTriggersTab;

</script>
